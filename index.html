<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuel Pipeline Optimization Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        html, body, #root { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden; }
        #map { height: 100%; width: 100%; position: absolute; top: 0; bottom: 0; left: 0; right: 0; z-index: 1; }
        
        /* Custom UI Slider Accents */
        .custom-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #2563eb;
            cursor: pointer;
            border: 2px solid white;
            box-shadow: 0 1px 4px rgba(0,0,0,0.2);
        }

        /* Marker Badges Anchoring & Scale Interactions */
        .custom-leaflet-pin {
            background: transparent !important;
            border: none !important;
        }
        .marker-badge-pulse {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: center center;
            backface-visibility: hidden;
        }
        .marker-badge-pulse:hover {
            transform: scale(1.15) translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
            z-index: 99999 !important;
        }

        /* Utility Scroll Cleanups */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-900 font-sans overflow-hidden select-none">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Mock Forecourt Simulation Pipeline Data
        const generateMockForecourts = (centerLat, centerLng, count = 25) => {
            const brands = ['ASDA', 'SAINSBURYS', 'MORRISONS', 'GULF', 'JET', 'BP', 'SHELL'];
            const labels = {
                'ASDA': ['CHESSER BYPASS', 'HALBEATH ROAD RETAIL PARK', 'MILTON LINK'],
                'SAINSBURYS': ['WESTFIELD ROAD', 'INGLIS GREEN ROAD', 'STRAITON MAINS'],
                'MORRISONS': ['WATERFRONT BROADWAY', 'ALNWICKHILL ROAD', 'FERRY ROAD'],
                'GULF': ['PRIMROSE LANE', 'CALDER ROAD', 'RESTALRIG'],
                'JET': ['BARCLAY PLACE', 'LONSDALE TERRACE', 'CORSTORPHINE'],
                'BP': ['QUEENSFERRY ROAD', 'MAYFIELD ROAD', 'SLATEFORD'],
                'SHELL': ['SALISBURY ROAD', 'SEAFIELD HIGHWAY', 'CALDER SYSTEM']
            };

            return Array.from({ length: count }, (_, i) => {
                const brand = brands[Math.floor(Math.random() * brands.length)];
                const addressList = labels[brand];
                const address = `${Math.floor(Math.random() * 45) + 1} ${addressList[Math.floor(Math.random() * addressList.length)]}`;
                
                const offsetLat = (Math.random() - 0.5) * 0.14;
                const offsetLng = (Math.random() - 0.5) * 0.18;
                
                const basePrice = parseFloat((144.5 + Math.random() * 14).toFixed(1));
                return {
                    id: `st-${i}-${Math.random().toString(36).substr(2, 4)}`,
                    brand,
                    address,
                    lat: centerLat + offsetLat,
                    lng: centerLng + offsetLng,
                    prices: {
                        e10: basePrice,
                        e5: parseFloat((basePrice + 14.0).toFixed(1)),
                        b7: parseFloat((basePrice + 18.0).toFixed(1))
                    }
                };
            });
        };

        function App() {
            // Fix: Local area search is selected by default
            const [searchMode, setSearchMode] = useState('local'); 
            
            // Text Input Fields
            const [startInput, setStartInput] = useState('Dunfermline');
            const [destInput, setDestInput] = useState('Edinburgh');
            const [interimInput, setInterimInput] = useState('Moffat');
            const [localSearch, setLocalSearch] = useState('City of Edinburgh, Scotland');
            
            // Config Parameters
            const [radius, setRadius] = useState(8);
            const [efficiency, setEfficiency] = useState(48);
            const [fuelVariant, setFuelVariant] = useState('Petrol Unleaded (E10)');
            const [traditionalPumps, setTraditionalPumps] = useState(false);

            // Active Datastream Status Records
            const [forecourts, setForecourts] = useState([]);
            const [selectedStation, setSelectedStation] = useState(null);
            const [suggestions, setSuggestions] = useState([]);
            const [activeSuggestionField, setActiveSuggestionField] = useState(null);
            
            // Overlay Layout Windows
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isPoolsOpen, setIsPoolsOpen] = useState(false);

            // Mapping References
            const mapRef = useRef(null);
            const routeGroupRef = useRef(null);
            const markerGroupRef = useRef(null);
            const activeCircleOverlayRef = useRef(null);

            // Core Map Engine Initializer
            useEffect(() => {
                if (!mapRef.current) {
                    // zoomControl: false to allow our custom pill-styled zoom block
                    mapRef.current = L.map('map', { zoomControl: false }).setView([55.9533, -3.1883], 11);
                    
                    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                        attribution: '© OpenStreetMap contributors'
                    }).addTo(mapRef.current);

                    markerGroupRef.current = L.layerGroup().addTo(mapRef.current);
                    routeGroupRef.current = L.layerGroup().addTo(mapRef.current);

                    // Seed starting telemetry rows
                    setForecourts(generateMockForecourts(55.9533, -3.1883, 20));
                }
            }, []);

            // Precise Marker Rendering Configuration
            useEffect(() => {
                if (markerGroupRef.current && mapRef.current) {
                    markerGroupRef.current.clearLayers();

                    forecourts.forEach(station => {
                        const price = station.prices.e10;
                        let colorVariantClass = 'bg-blue-600'; 
                        if (price < 149) colorVariantClass = 'bg-emerald-500';
                        if (price > 155) colorVariantClass = 'bg-rose-500';

                        const generatedHtmlContent = `
                            <div class="marker-badge-pulse ${colorVariantClass} text-white text-[11px] font-bold px-2 py-0.5 rounded shadow-md border border-white flex items-center justify-center gap-1 cursor-pointer">
                                ${price}p
                            </div>
                        `;

                        const premiumIconInstance = L.divIcon({
                            className: 'custom-leaflet-pin',
                            html: generatedHtmlContent,
                            iconSize: [52, 22],
                            iconAnchor: [26, 11]
                        });

                        const leafletMarkerObject = L.marker([station.lat, station.lng], { icon: premiumIconInstance });
                        leafletMarkerObject.on('click', () => setSelectedStation(station));
                        markerGroupRef.current.addLayer(leafletMarkerObject);
                    });
                }
            }, [forecourts]);

            // Preserved Implementation: Smooth Geolocation Radius Blue Circle Mapping
            useEffect(() => {
                if (searchMode === 'local' && mapRef.current) {
                    if (activeCircleOverlayRef.current) {
                        mapRef.current.removeLayer(activeCircleOverlayRef.current);
                    }
                    const visibleCenterCoord = mapRef.current.getCenter();
                    activeCircleOverlayRef.current = L.circle(visibleCenterCoord, {
                        radius: radius * 1609.34, 
                        color: '#3b82f6',
                        fillColor: '#2563eb',
                        fillOpacity: 0.06,
                        weight: 1.5,
                        dashArray: '4, 6'
                    }).addTo(mapRef.current);
                } else {
                    if (activeCircleOverlayRef.current && mapRef.current) {
                        mapRef.current.removeLayer(activeCircleOverlayRef.current);
                        activeCircleOverlayRef.current = null;
                    }
                }
            }, [radius, searchMode]);

            // Auto-complete Geocoding Services
            const executeGeocodeLookup = async (textVal, fieldIdentifier) => {
                if (fieldIdentifier === 'start') setStartInput(textVal);
                if (fieldIdentifier === 'dest') setDestInput(textVal);
                if (fieldIdentifier === 'interim') setInterimInput(textVal);
                if (fieldIdentifier === 'local') setLocalSearch(textVal);

                if (textVal.trim().length < 3) {
                    setSuggestions([]);
                    return;
                }

                setActiveSuggestionField(fieldIdentifier);
                try {
                    const queryUrl = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(textVal)}&countrycodes=gb&limit=4`;
                    const networkResponse = await fetch(queryUrl, { headers: { 'Accept-Language': 'en' } });
                    const returnedDataset = await networkResponse.json();
                    setSuggestions(returnedDataset);
                } catch (err) {
                    console.error("Geocoding lookup exception:", err);
                }
            };

            const confirmSuggestionAssignment = (selectedItem, fieldIdentifier) => {
                const titleStr = selectedItem.display_name.split(',')[0] + ', ' + (selectedItem.display_name.split(',')[1] || '').trim();
                
                if (fieldIdentifier === 'start') setStartInput(titleStr);
                if (fieldIdentifier === 'dest') setDestInput(titleStr);
                if (fieldIdentifier === 'interim') setInterimInput(titleStr);
                if (fieldIdentifier === 'local') {
                    setLocalSearch(titleStr);
                    const latVal = parseFloat(selectedItem.lat);
                    const lonVal = parseFloat(selectedItem.lon);
                    mapRef.current.setView([latVal, lonVal], 12);
                    setForecourts(generateMockForecourts(latVal, lonVal, 22));
                }

                setSuggestions([]);
                setActiveSuggestionField(null);
            };

            const acquireHardwareCoordinates = () => {
                if (!navigator.geolocation) return;
                navigator.geolocation.getCurrentPosition((position) => {
                    const { latitude, longitude } = position.coords;
                    mapRef.current.setView([latitude, longitude], 12);
                    setLocalSearch("Device Telemetry Position");
                    setForecourts(generateMockForecourts(latitude, longitude, 18));
                });
            };

            // Road Network Route Corridor Calculation
            const computeNetworkRoadCorridor = async () => {
                if (!startInput || !destInput) return;
                routeGroupRef.current.clearLayers();

                try {
                    const locationsMatrix = [startInput, interimInput, destInput].filter(str => str && str.trim() !== '');
                    const arrayCoordinatesStrings = [];

                    for (let address of locationsMatrix) {
                        const parsingUrl = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}&countrycodes=gb&limit=1`;
                        const res = await fetch(parsingUrl);
                        const dataset = await res.json();
                        if (dataset && dataset.length > 0) {
                            arrayCoordinatesStrings.push(`${dataset[0].lon},${dataset[0].lat}`);
                        }
                    }

                    if (arrayCoordinatesStrings.length < 2) return;

                    const osrmRequestUrl = `https://router.project-osrm.org/route/v1/driving/${arrayCoordinatesStrings.join(';')}?overview=full&geometries=geojson`;
                    const responseStream = await fetch(osrmRequestUrl);
                    const routeResultPayload = await responseStream.json();

                    if (routeResultPayload.routes && routeResultPayload.routes.length > 0) {
                        const spatialGeometryLine = routeResultPayload.routes[0].geometry;
                        const formattedLeafletLatLngs = spatialGeometryLine.coordinates.map(node => [node[1], node[0]]);

                        const interactiveRouteLine = L.polyline(formattedLeafletLatLngs, {
                            color: '#2563eb',
                            weight: 4.5,
                            opacity: 0.85
                        }).addTo(routeGroupRef.current);

                        mapRef.current.fitBounds(interactiveRouteLine.getBounds(), { padding: [40, 40] });
                        const medianPathNode = formattedLeafletLatLngs[Math.floor(formattedLeafletLatLngs.length / 2)];
                        setForecourts(generateMockForecourts(medianPathNode[0], medianPathNode[1], 28));
                    }
                } catch (error) {
                    console.error("OSRM pipeline corridor mapping layer crash:", error);
                }
            };

            const clearActiveRoutingLayers = () => {
                setStartInput('');
                setDestInput('');
                setInterimInput('');
                routeGroupRef.current.clearLayers();
            };

            // Manual Map Bounding Scan Trigger
            const scanMapBoundingViewport = () => {
                if (!mapRef.current) return;
                const dynamicViewCenter = mapRef.current.getCenter();
                setForecourts(generateMockForecourts(dynamicViewCenter.lat, dynamicViewCenter.lng, 24));
            };

            // Sort logic to identify target tier categories
            const calculatedOptimalListings = [...forecourts]
                .sort((x, y) => x.prices.e10 - y.prices.e10)
                .slice(0, 3);

            return (
                <div className="relative w-full h-full flex overflow-hidden bg-slate-50">
                    
                    {/* Map Node Container */}
                    <div id="map"></div>

                    {/* Fix: Restored Premium Top-Right Navigation Pill Menu Bar */}
                    <div className="absolute top-4 right-4 bg-white/90 backdrop-blur-md px-4 py-2 rounded-xl shadow-lg z-[1000] border border-slate-200/80 flex items-center gap-5 text-xs font-semibold text-slate-700">
                        <div className="flex items-center gap-1.5 text-emerald-600 font-bold uppercase tracking-wider">
                            <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                            System Live
                        </div>
                        <div className="w-px h-3 bg-slate-200"></div>
                        <button className="hover:text-blue-600 transition">Dashboard</button>
                        <button className="hover:text-blue-600 transition flex items-center gap-1.5">
                            Saved Routes 
                            <span className="bg-blue-100 text-blue-600 font-extrabold px-1.5 py-0.5 rounded text-[10px]">12</span>
                        </button>
                        <button className="hover:text-blue-600 transition flex items-center gap-1.5">
                            Starred Forecourts
                            <span className="bg-amber-100 text-amber-700 font-extrabold px-1.5 py-0.5 rounded text-[10px]">4</span>
                        </button>
                    </div>

                    {/* Fix: Beautiful Custom Zoom Controls Pill Group (Bottom Right) */}
                    <div className="absolute bottom-24 right-4 z-[1000] flex flex-col gap-1 shadow-lg rounded-xl overflow-hidden border border-slate-200 bg-white">
                        <button 
                            onClick={() => mapRef.current?.zoomIn()} 
                            className="w-10 h-10 bg-white hover:bg-slate-50 flex items-center justify-center font-bold text-slate-700 border-b border-slate-100 text-base transition"
                        >
                            ＋
                        </button>
                        <button 
                            onClick={() => mapRef.current?.zoomOut()} 
                            className="w-10 h-10 bg-white hover:bg-slate-50 flex items-center justify-center font-bold text-slate-700 text-base transition"
                        >
                            －
                        </button>
                    </div>

                    {/* Fix: Restored Holistic Sidebar Styling & Typography Frame */}
                    <div className="absolute top-4 left-4 bottom-4 w-[390px] bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl z-[1000] flex flex-col overflow-hidden border border-slate-200/60 pointer-events-auto">
                        <div className="p-5 flex flex-col gap-4 overflow-y-auto no-scrollbar flex-1">
                            
                            {/* Standard Sidebar Top Branding Section Header */}
                            <div>
                                <h1 className="text-xl font-black text-slate-900 tracking-tight">Fuel Optimization</h1>
                                <p className="text-[9px] text-emerald-500 font-bold tracking-widest uppercase mt-0.5">
                                    CORRIDOR TRACK COMPUTATIONAL PIPELINE ACTIVE
                                </p>
                            </div>

                            {/* Main Context Layout Mode Toggles */}
                            <div className="flex bg-slate-100 p-1 rounded-xl border border-slate-200/40">
                                <button 
                                    onClick={() => setSearchMode('local')} 
                                    className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${searchMode === 'local' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-400 hover:text-slate-600'}`}
                                >
                                    📍 Local Area Map
                                </button>
                                <button 
                                    onClick={() => setSearchMode('route')} 
                                    className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${searchMode === 'route' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-400 hover:text-slate-600'}`}
                                >
                                    🏎️ Route Corridor
                                </button>
                            </div>

                            {/* Local Area Section Component */}
                            {searchMode === 'local' && (
                                <div className="flex flex-col gap-3.5 animate-in fade-in duration-150">
                                    <div className="relative">
                                        <label className="text-[10px] font-bold tracking-wider uppercase text-slate-400 block mb-1">Search Center Location</label>
                                        <div className="relative flex items-center">
                                            <input 
                                                type="text" 
                                                value={localSearch} 
                                                onChange={(e) => executeGeocodeLookup(e.target.value, 'local')} 
                                                className="w-full text-xs font-semibold border border-slate-200 rounded-xl pl-3.5 pr-10 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500/20 text-slate-800 bg-slate-50/50" 
                                                placeholder="e.g. Edinburgh, Scotland" 
                                            />
                                            <button onClick={acquireHardwareCoordinates} className="absolute right-2.5 p-1.5 rounded-lg hover:bg-slate-100 text-slate-400 transition" title="Get device coordinates">
                                                🎯
                                            </button>
                                        </div>

                                        {activeSuggestionField === 'local' && suggestions.length > 0 && (
                                            <div className="absolute w-full bg-white border border-slate-200 mt-1 rounded-xl shadow-2xl z-[5000] max-h-44 overflow-y-auto">
                                                {suggestions.map((s, idx) => (
                                                    <div key={idx} onClick={() => confirmSuggestionAssignment(s, 'local')} className="p-2.5 text-xs hover:bg-slate-50 cursor-pointer border-b last:border-0 border-slate-100 text-slate-700 font-medium">{s.display_name}</div>
                                                ))}
                                            </div>
                                        )}
                                    </div>

                                    <div>
                                        <div className="flex justify-between text-[10px] font-bold tracking-wider uppercase text-slate-400 mb-1">
                                            <span>Scan Window Radius</span>
                                            <span className="text-blue-600 bg-blue-50 px-2 py-0.5 rounded font-bold text-xs">{radius} Miles Scope</span>
                                        </div>
                                        <input 
                                            type="range" min="1" max="25" value={radius} 
                                            onChange={(e) => setRadius(parseInt(e.target.value))} 
                                            className="w-full h-1.5 bg-slate-100 rounded-lg appearance-none cursor-pointer custom-slider border border-slate-200/40" 
                                        />
                                    </div>
                                </div>
                            )}

                            {/* Fix: Restored Unified Route Planner Vertical Stacking Input Connectors Style */}
                            {searchMode === 'route' && (
                                <div className="bg-slate-50 border border-slate-200/60 p-4 rounded-xl flex flex-col gap-3 relative animate-in fade-in duration-150">
                                    {/* Left margin dotted pipeline vertical line */}
                                    <div className="absolute left-[25px] top-7 bottom-7 w-px border-l-2 border-dashed border-blue-200 z-0"></div>
                                    
                                    {/* Start Node Row */}
                                    <div className="flex items-center gap-3 relative z-10">
                                        <span className="w-4 h-4 rounded-full bg-white border-2 border-blue-500 flex items-center justify-center text-[9px] text-blue-500 font-bold shadow-sm">○</span>
                                        <div className="flex-1 relative">
                                            <input 
                                                type="text" value={startInput} onChange={(e) => executeGeocodeLookup(e.target.value, 'start')} 
                                                className="w-full text-xs font-semibold bg-white border border-slate-200 rounded-lg px-3 py-2 focus:outline-none text-slate-800" placeholder="Starting Location" 
                                            />
                                            {activeSuggestionField === 'start' && suggestions.length > 0 && (
                                                <div className="absolute w-full bg-white border border-slate-200 mt-1 rounded-lg shadow-xl z-[5000] max-h-36 overflow-y-auto">
                                                    {suggestions.map((s, idx) => (
                                                        <div key={idx} onClick={() => confirmSuggestionAssignment(s, 'start')} className="p-2 text-xs hover:bg-slate-50 cursor-pointer text-slate-700">{s.display_name}</div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    </div>

                                    {/* Interim Node Row */}
                                    <div className="flex items-center gap-3 relative z-10">
                                        <span className="w-4 h-4 rounded-full bg-white border-2 border-blue-400 flex items-center justify-center text-[9px] text-blue-400 font-bold shadow-sm">○</span>
                                        <div className="flex-1 relative">
                                            <input 
                                                type="text" value={interimInput} onChange={(e) => executeGeocodeLookup(e.target.value, 'interim')} 
                                                className="w-full text-xs font-semibold bg-white border border-slate-200 rounded-lg px-3 py-2 focus:outline-none text-slate-800" placeholder="Interim Stop (Optional)" 
                                            />
                                            {activeSuggestionField === 'interim' && suggestions.length > 0 && (
                                                <div className="absolute w-full bg-white border border-slate-200 mt-1 rounded-lg shadow-xl z-[5000] max-h-36 overflow-y-auto">
                                                    {suggestions.map((s, idx) => (
                                                        <div key={idx} onClick={() => confirmSuggestionAssignment(s, 'interim')} className="p-2 text-xs hover:bg-slate-50 cursor-pointer text-slate-700">{s.display_name}</div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    </div>

                                    {/* Destination Node Row */}
                                    <div className="flex items-center gap-3 relative z-10">
                                        <span className="w-4 h-4 rounded-full bg-blue-600 flex items-center justify-center text-[10px] text-white font-bold shadow-sm">📍</span>
                                        <div className="flex-1 relative">
                                            <input 
                                                type="text" value={destInput} onChange={(e) => executeGeocodeLookup(e.target.value, 'dest')} 
                                                className="w-full text-xs font-semibold bg-white border border-slate-200 rounded-lg px-3 py-2 focus:outline-none text-slate-800" placeholder="Destination Point" 
                                            />
                                            {activeSuggestionField === 'dest' && suggestions.length > 0 && (
                                                <div className="absolute w-full bg-white border border-slate-200 mt-1 rounded-lg shadow-xl z-[5000] max-h-36 overflow-y-auto">
                                                    {suggestions.map((s, idx) => (
                                                        <div key={idx} onClick={() => confirmSuggestionAssignment(s, 'dest')} className="p-2 text-xs hover:bg-slate-50 cursor-pointer text-slate-700">{s.display_name}</div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            )}

                            <hr className="border-slate-100" />

                            {/* Configurations Management Cards */}
                            <div className="flex flex-col gap-3">
                                <div>
                                    <label className="text-[10px] font-bold tracking-wider uppercase text-slate-400 block mb-1">Vehicle Consumption Efficiency (MPG)</label>
                                    <input 
                                        type="number" value={efficiency} onChange={(e) => setEfficiency(e.target.value)} 
                                        className="w-full text-xs font-semibold border border-slate-200 rounded-xl px-3.5 py-2.5 focus:outline-none text-slate-800 bg-slate-50/50" 
                                    />
                                </div>

                                <div>
                                    <label className="text-[10px] font-bold tracking-wider uppercase text-slate-400 block mb-1">Fuel Core Variant Composition</label>
                                    <select 
                                        value={fuelVariant} onChange={(e) => setFuelVariant(e.target.value)} 
                                        className="w-full text-xs font-bold border border-slate-200 rounded-xl px-3 py-2.5 bg-white text-slate-700 focus:outline-none"
                                    >
                                        <option>Petrol Unleaded (E10)</option>
                                        <option>Super Unleaded (E5)</option>
                                        <option>Diesel (B7)</option>
                                    </select>
                                </div>
                            </div>

                            {/* Conditional Display Logic: Financial Summary Block */}
                            {searchMode === 'route' && (
                                <div className="bg-emerald-50/60 border border-emerald-100 rounded-xl p-4 flex flex-col gap-2 mt-1 animate-in fade-in duration-150">
                                    <span className="text-[10px] font-bold tracking-wider uppercase text-slate-400 block">📊 Financial Calculations Summary</span>
                                    <div className="text-xs font-semibold text-slate-600 flex justify-between">
                                        <span>Total Track: <strong className="text-slate-900">18.5 miles</strong></span>
                                        <span>Optimal Expenses: <strong className="text-emerald-600">£2.86</strong></span>
                                    </div>
                                    <button 
                                        onClick={() => setIsModalOpen(true)} 
                                        className="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-2 px-3 rounded-lg transition flex items-center justify-between mt-1 shadow-sm"
                                    >
                                        <span>📋 Open Full Analysis</span>
                                        <span>→</span>
                                    </button>
                                </div>
                            )}

                            {/* Render System Listings */}
                            {calculatedOptimalListings.length > 0 && (
                                <div className="flex flex-col gap-2 mt-1">
                                    <span className="text-[10px] font-bold tracking-wider uppercase text-slate-400 block">🏆 Cheapest Selection Choices</span>
                                    {calculatedOptimalListings.map((station, index) => (
                                        <div 
                                            key={station.id} 
                                            onClick={() => { mapRef.current.setView([station.lat, station.lng], 13); setSelectedStation(station); }} 
                                            className="bg-white border border-slate-100 p-3 rounded-xl flex justify-between items-center hover:border-blue-300 shadow-sm cursor-pointer transition"
                                        >
                                            <div className="flex items-center gap-2.5">
                                                <span className="text-xs font-bold text-amber-600 bg-amber-50 w-6 h-6 rounded flex items-center justify-center border border-amber-100">#{index + 1}</span>
                                                <div>
                                                    <h4 className="text-xs font-black text-slate-800">{station.brand}</h4>
                                                    <p className="text-[9px] text-slate-400 font-semibold uppercase tracking-wide truncate max-w-[180px]">{station.address}</p>
                                                </div>
                                            </div>
                                            <span className="text-xs font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-100">{station.prices.e10}p</span>
                                        </div>
                                    ))}
                                </div>
                            )}

                        </div>

                        {/* Fix: Restored Sidebar Action Bottom Deck (Pools + Primary Execution Split) */}
                        <div className="p-3 bg-slate-50 border-t border-slate-100 flex items-center gap-2">
                            <button 
                                onClick={() => setIsPoolsOpen(true)} 
                                className="px-4 py-3 bg-white border border-slate-200 rounded-xl hover:bg-slate-50 font-bold text-xs text-slate-700 shadow-sm flex items-center gap-2 transition active:scale-95 shrink-0"
                            >
                                📊 Pools
                            </button>
                            
                            <button 
                                onClick={searchMode === 'route' ? computeNetworkRoadCorridor : scanMapBoundingViewport}
                                className="flex-1 py-3 bg-slate-900 hover:bg-slate-800 text-white rounded-xl font-bold text-xs tracking-wider uppercase transition active:scale-[0.98] shadow-md text-center"
                            >
                                {searchMode === 'route' ? '🔎 Search Route Corridor' : '🔍 Scan Local Region'}
                            </button>
                        </div>
                    </div>

                    {/* Viewport Boundary Floating Scanner Button */}
                    <div className="absolute bottom-6 left-1/2 -translate-x-1/2 z-[1000]">
                        <button 
                            onClick={scanMapBoundingViewport} 
                            className="bg-slate-900 text-white border border-slate-800 px-5 py-2.5 rounded-full text-[11px] font-bold tracking-wider uppercase shadow-2xl hover:bg-slate-800 transition active:scale-95"
                        >
                            🔄 Sync Viewport Area
                        </button>
                    </div>

                    {/* Fix: Color-Coded Stations Details Overlay Panel (Emulating Build 02.10.17) */}
                    {selectedStation && (
                        <div className="absolute bottom-6 right-16 z-[1000] bg-white rounded-2xl shadow-2xl p-5 w-80 border border-slate-200/80 flex flex-col gap-3.5 animate-in slide-in-from-bottom-4 duration-200">
                            <div className="flex justify-between items-start">
                                <div>
                                    <h3 className="text-base font-black text-slate-900 tracking-tight">{selectedStation.brand}</h3>
                                    <p className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">{selectedStation.address}</p>
                                </div>
                                <button onClick={() => setSelectedStation(null)} className="text-slate-400 hover:text-slate-600 font-bold text-xs p-1">✕</button>
                            </div>
                            
                            {/* Color-coded tier boxes layout row matching previous parameters */}
                            <div className="grid grid-cols-3 gap-2">
                                <div className="bg-emerald-50 text-emerald-800 border border-emerald-200/60 p-2 rounded-xl text-center">
                                    <p className="text-[9px] font-bold uppercase tracking-wide opacity-80">Unleaded</p>
                                    <p className="text-sm font-black mt-0.5">{selectedStation.prices.e10}p</p>
                                </div>
                                <div className="bg-blue-50 text-blue-800 border border-blue-200/60 p-2 rounded-xl text-center">
                                    <p className="text-[9px] font-bold uppercase tracking-wide opacity-80">Super E5</p>
                                    <p className="text-sm font-black mt-0.5">{selectedStation.prices.e5}p</p>
                                </div>
                                <div className="bg-amber-50 text-amber-800 border border-amber-200/60 p-2 rounded-xl text-center">
                                    <p className="text-[9px] font-bold uppercase tracking-wide opacity-80">Diesel B7</p>
                                    <p className="text-sm font-black mt-0.5">{selectedStation.prices.b7}p</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Remote Clusters Slide Drawer Layer Sheet */}
                    {isPoolsOpen && (
                        <div className="absolute top-0 right-0 h-full w-80 bg-white/95 backdrop-blur-md z-[2000] border-l border-slate-200 shadow-2xl p-5 flex flex-col gap-4 animate-in slide-in-from-right duration-200">
                            <div className="flex justify-between items-center">
                                <h2 className="text-xs font-bold text-slate-900 uppercase tracking-wider">Cluster Rows Array</h2>
                                <button onClick={() => setIsPoolsOpen(false)} className="text-slate-400 font-bold hover:text-slate-600">✕</button>
                            </div>
                            <div className="flex-1 overflow-y-auto flex flex-col gap-2 no-scrollbar">
                                {forecourts.map((station) => (
                                    <div 
                                        key={station.id} onClick={() => { mapRef.current.setView([station.lat, station.lng], 13); setSelectedStation(station); }}
                                        className="p-2.5 bg-white border border-slate-100 rounded-lg hover:border-blue-400 cursor-pointer transition text-xs font-semibold text-slate-700"
                                    >
                                        <div className="flex justify-between">
                                            <span>{station.brand}</span>
                                            <span className="text-emerald-600 font-bold">{station.prices.e10}p</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Pricing Calculation High-Fidelity Details Analytics Modal Overlay Window */}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-[99999] flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-5 border border-slate-200 flex flex-col gap-4 animate-in zoom-in-95 duration-100">
                                <div className="flex justify-between items-center">
                                    <h3 className="text-xs font-bold text-slate-900 uppercase tracking-wider">Financial Analysis Breakdown</h3>
                                    <button onClick={() => setIsModalOpen(false)} className="text-slate-400 font-bold hover:text-slate-600">✕</button>
                                </div>

                                <div className="flex flex-col gap-2">
                                    <div className="flex justify-between items-center p-2.5 bg-slate-50 rounded-lg">
                                        <span className="text-xs text-slate-500 font-medium">Path Range</span>
                                        <span className="text-xs font-bold text-slate-800">18.5 miles</span>
                                    </div>
                                    <div className="flex justify-between items-center p-2.5 bg-emerald-50 text-emerald-800 rounded-lg">
                                        <span className="text-xs font-medium">Benchmark Fuel Price</span>
                                        <span className="text-xs font-bold">146.2p / L</span>
                                    </div>
                                    <div className="flex justify-between items-center p-2.5 bg-blue-50 text-blue-800 rounded-lg">
                                        <span className="text-xs font-medium">Projected Cost Run Target</span>
                                        <span className="text-xs font-black">£2.86 Total</span>
                                    </div>
                                </div>

                                <button onClick={() => setIsModalOpen(false)} className="w-full bg-slate-900 text-white py-2.5 rounded-xl text-xs font-bold hover:bg-slate-700 transition">
                                    Dismiss Analysis
                                </button>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
