<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuel Pipeline Optimization Engine</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%2280%22 font-size=%2270%22>⛽</text></svg>">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        html, body, #root { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden; }
        #map { height: 100%; width: 100%; position: absolute; top: 0; bottom: 0; left: 0; right: 0; z-index: 1; }
        
        .custom-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #2563eb;
            cursor: pointer;
            border: 2px solid white;
            box-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }

        .custom-leaflet-pin { background: transparent !important; border: none !important; }
        .pill-marker-container {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: bottom center;
        }
        .pill-marker-container:hover {
            transform: scale(1.1) translateY(-2px);
            z-index: 99999 !important;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-900 font-sans overflow-hidden select-none">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Realistic terrestrial coordinate nodes covering Dunfermline & Edinburgh route passes
        const REAL_TERRESTRIAL_STATIONS = [
            { id: 'st-1', brand: 'ASDA', address: 'Halbeath Road, Dunfermline', lat: 56.0715, lng: -3.4422, prices: { e10: 141.7, e5: 155.9, b7: 159.2 } },
            { id: 'st-2', brand: 'SHELL', address: 'Bothwell Street, Dunfermline', lat: 56.0640, lng: -3.4500, prices: { e10: 149.9, e5: 163.9, b7: 165.4 } },
            { id: 'st-3', brand: 'BP', address: 'Fife Leisure Park, Dunfermline', lat: 56.0810, lng: -3.4130, prices: { e10: 151.2, e5: 164.9, b7: 166.2 } },
            { id: 'st-4', brand: 'JET', address: 'Link Road, Cowdenbeath', lat: 56.1089, lng: -3.3541, prices: { e10: 142.4, e5: 156.4, b7: 158.9 } },
            { id: 'st-5', brand: 'MORRISONS', address: 'Grange Road, Cowdenbeath', lat: 56.1132, lng: -3.3412, prices: { e10: 141.9, e5: 155.4, b7: 159.4 } },
            { id: 'st-6', brand: 'GULF', address: 'Main Street, Inverkeithing', lat: 56.0310, lng: -3.3980, prices: { e10: 144.5, e5: 158.9, b7: 161.2 } },
            { id: 'st-7', brand: 'SHELL', address: 'Ferrytoll Access, Rosyth', lat: 56.0335, lng: -3.4180, prices: { e10: 148.9, e5: 162.9, b7: 164.9 } },
            { id: 'st-8', brand: 'BP', address: 'Queensferry Corridor, Kirkliston', lat: 55.9890, lng: -3.4020, prices: { e10: 154.9, e5: 168.9, b7: 169.9 } },
            { id: 'st-9', brand: 'SAINSBURYS', address: 'Craigleith Retail Park, Edinburgh', lat: 55.9605, lng: -3.2360, prices: { e10: 143.2, e5: 157.2, b7: 160.4 } },
            { id: 'st-10', brand: 'MORRISONS', address: 'Gyle Muir Road, Edinburgh', lat: 55.9385, lng: -3.2920, prices: { e10: 142.9, e5: 156.9, b7: 159.9 } },
            { id: 'st-11', brand: 'SHELL', address: 'Maybury Road, Edinburgh', lat: 55.9465, lng: -3.2988, prices: { e10: 150.4, e5: 164.4, b7: 165.9 } },
            { id: 'st-12', brand: 'BP', address: 'Corstorphine Spine, Edinburgh', lat: 55.9415, lng: -3.2690, prices: { e10: 151.9, e5: 165.9, b7: 166.9 } },
            { id: 'st-13', brand: 'ASDA', address: 'Chesser Suburban Route, Edinburgh', lat: 55.9254, lng: -3.2452, prices: { e10: 141.4, e5: 155.4, b7: 158.4 } },
            { id: 'st-14', brand: 'TEXACO', address: 'Slateford Road, Edinburgh', lat: 55.9288, lng: -3.2312, prices: { e10: 145.9, e5: 159.9, b7: 162.9 } },
            { id: 'st-15', brand: 'JET', address: 'Restalrig Road, Edinburgh', lat: 55.9641, lng: -3.1512, prices: { e10: 143.7, e5: 157.4, b7: 160.2 } }
        ];

        function App() {
            const [searchMode, setSearchMode] = useState('route'); 
            const [startInput, setStartInput] = useState('Dunfermline');
            const [destInput, setDestInput] = useState('Edinburgh');
            const [interimInput, setInterimInput] = useState('');
            const [showInterimField, setShowInterimField] = useState(false);
            const [localSearch, setLocalSearch] = useState('Dunfermline, Fife');
            const [isLocating, setIsLocating] = useState(false);
            
            const [radius, setRadius] = useState(5);
            const [efficiency, setEfficiency] = useState(45);
            const [fuelVariant, setFuelVariant] = useState('Petrol Unleaded (E10)');

            const [visibleMarkers, setVisibleMarkers] = useState([]);
            const [selectedStation, setSelectedStation] = useState(null);
            const [suggestions, setSuggestions] = useState([]);
            const [activeSuggestionField, setActiveSuggestionField] = useState(null);
            
            // Stored Route Analytics State
            const [routeDistanceMiles, setRouteDistanceMiles] = useState(16.4); // Dynamic fallback default
            const [savedRoutes, setSavedRoutes] = useState([
                { id: 'r1', title: 'Dunfermline Corridor Bypass', info: '14.5 miles · 4 stations' }
            ]);
            const [starredIds, setStarredIds] = useState(['st-1']);
            const [activeHeaderDropdown, setActiveHeaderDropdown] = useState(null); 

            // Mapping References
            const mapRef = useRef(null);
            const routeGroupRef = useRef(null);
            const markerGroupRef = useRef(null);
            const activeCircleOverlayRef = useRef(null);
            const activeRouteCoordinatesRef = useRef(null);

            useEffect(() => {
                if (!mapRef.current) {
                    mapRef.current = L.map('map', { zoomControl: false }).setView([56.02, -3.35], 11);
                    
                    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                        attribution: '© OpenStreetMap'
                    }).addTo(mapRef.current);

                    markerGroupRef.current = L.layerGroup().addTo(mapRef.current);
                    routeGroupRef.current = L.layerGroup().addTo(mapRef.current);

                    mapRef.current.on('moveend', () => {
                        syncMarkersWithMapViewport();
                    });
                }
                setTimeout(computeNetworkRoadCorridor, 500);
            }, [searchMode]);

            const computeDistanceMiles = (lat1, lon1, lat2, lon2) => {
                const R = 3958.8; 
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLon = (lon2 - lon1) * Math.PI / 180;
                const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                          Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                          Math.sin(dLon/2) * Math.sin(dLon/2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                return R * c;
            };

            const syncMarkersWithMapViewport = () => {
                if (!mapRef.current) return;

                if (searchMode === 'route' && activeRouteCoordinatesRef.current) {
                    const matchedStations = REAL_TERRESTRIAL_STATIONS.filter(station => {
                        return activeRouteCoordinatesRef.current.some(coord => {
                            const dist = computeDistanceMiles(station.lat, station.lng, coord[0], coord[1]);
                            return dist <= radius;
                        });
                    });
                    setVisibleMarkers(matchedStations);
                } else {
                    const bounds = mapRef.current.getBounds();
                    const matchedStations = REAL_TERRESTRIAL_STATIONS.filter(station => {
                        return bounds.contains([station.lat, station.lng]);
                    });
                    setVisibleMarkers(matchedStations);
                }
            };

            // Marker Layer Renderer
            useEffect(() => {
                if (markerGroupRef.current && mapRef.current) {
                    markerGroupRef.current.clearLayers();

                    visibleMarkers.forEach(station => {
                        const price = fuelVariant.includes('E5') ? station.prices.e5 : (fuelVariant.includes('B7') ? station.prices.b7 : station.prices.e10);
                        
                        let badgeColor = 'bg-blue-600';
                        if (price <= 143.5) badgeColor = 'bg-emerald-600';
                        if (price >= 151.0) badgeColor = 'bg-rose-600';

                        const htmlContent = `
                            <div class="pill-marker-container flex flex-col items-center">
                                <div class="flex items-stretch bg-white rounded-full shadow-md border border-slate-200/80 overflow-hidden pr-2.5 h-7">
                                    <div class="${badgeColor} text-white text-[10px] font-black px-2 flex items-center justify-center min-w-[38px]">
                                        ${price}p
                                    </div>
                                    <div class="text-[10px] font-bold text-slate-800 flex items-center pl-2 tracking-tight">
                                        ${station.brand}
                                    </div>
                                </div>
                                <div class="w-1.5 h-1.5 bg-white border-r border-b border-slate-200 shadow-xs rotate-45 -mt-[4px] z-0"></div>
                            </div>
                        `;

                        const customIcon = L.divIcon({
                            className: 'custom-leaflet-pin',
                            html: htmlContent,
                            iconSize: [90, 32],
                            iconAnchor: [45, 32]
                        });

                        const marker = L.marker([station.lat, station.lng], { icon: customIcon });
                        marker.on('click', () => setSelectedStation(station));
                        markerGroupRef.current.addLayer(marker);
                    });
                }
            }, [visibleMarkers, fuelVariant]);

            // Circle Radius Tracker for Local Search Mode
            useEffect(() => {
                if (searchMode === 'local' && mapRef.current) {
                    if (activeCircleOverlayRef.current) mapRef.current.removeLayer(activeCircleOverlayRef.current);
                    
                    const center = mapRef.current.getCenter();
                    activeCircleOverlayRef.current = L.circle(center, {
                        radius: radius * 1609.34, 
                        color: '#2563eb',
                        fillColor: '#2563eb',
                        fillOpacity: 0.04,
                        weight: 1.5,
                        dashArray: '3, 5'
                    }).addTo(mapRef.current);
                } else {
                    if (activeCircleOverlayRef.current && mapRef.current) {
                        mapRef.current.removeLayer(activeCircleOverlayRef.current);
                        activeCircleOverlayRef.current = null;
                    }
                }
            }, [radius, searchMode]);

            // Geolocation Auto-Detection
            const handleAutoDetectLocation = () => {
                if (!navigator.geolocation) {
                    alert("Geolocation is not supported by your browser software.");
                    return;
                }
                setIsLocating(true);
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const { latitude, longitude } = position.coords;
                        setLocalSearch(`${latitude.toFixed(4)}, ${longitude.toFixed(4)}`);
                        mapRef.current.setView([latitude, longitude], 13);
                        setTimeout(() => {
                            syncMarkersWithMapViewport();
                            setIsLocating(false);
                        }, 400);
                    },
                    (error) => {
                        setLocalSearch("Dunfermline, Fife");
                        mapRef.current.setView([56.0712, -3.4521], 13);
                        setTimeout(() => {
                            syncMarkersWithMapViewport();
                            setIsLocating(false);
                        }, 400);
                    },
                    { enableHighAccuracy: true, timeout: 6000 }
                );
            };

            const executeGeocodeLookup = async (textVal, fieldIdentifier) => {
                if (fieldIdentifier === 'start') setStartInput(textVal);
                if (fieldIdentifier === 'dest') setDestInput(textVal);
                if (fieldIdentifier === 'interim') setInterimInput(textVal);
                if (fieldIdentifier === 'local') setLocalSearch(textVal);

                if (textVal.trim().length < 3) {
                    setSuggestions([]);
                    return;
                }

                setActiveSuggestionField(fieldIdentifier);
                try {
                    const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(textVal)}&countrycodes=gb&limit=4`;
                    const res = await fetch(url, { headers: { 'Accept-Language': 'en' } });
                    const data = await res.json();
                    setSuggestions(data);
                } catch (err) {
                    console.error("Geocoding failed", err);
                }
            };

            const confirmSuggestionAssignment = (selectedItem, fieldIdentifier) => {
                const titleStr = selectedItem.display_name.split(',')[0] + ', ' + (selectedItem.display_name.split(',')[1] || '').trim();
                
                if (fieldIdentifier === 'start') setStartInput(titleStr);
                if (fieldIdentifier === 'dest') setDestInput(titleStr);
                if (fieldIdentifier === 'interim') setInterimInput(titleStr);
                if (fieldIdentifier === 'local') {
                    setLocalSearch(titleStr);
                    mapRef.current.setView([parseFloat(selectedItem.lat), parseFloat(selectedItem.lon)], 12);
                    setTimeout(syncMarkersWithMapViewport, 400);
                }

                setSuggestions([]);
                setActiveSuggestionField(null);
            };

            // OSRM Core Routing Builder Engine
            const computeNetworkRoadCorridor = async () => {
                if (!startInput || !destInput) return;
                routeGroupRef.current.clearLayers();

                try {
                    const locations = [startInput, showInterimField ? interimInput : '', destInput].filter(str => str && str.trim() !== '');
                    const coords = [];

                    for (let address of locations) {
                        const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}&countrycodes=gb&limit=1`;
                        const res = await fetch(url);
                        const dataset = await res.json();
                        if (dataset && dataset.length > 0) {
                            coords.push(`${dataset[0].lon},${dataset[0].lat}`);
                        }
                    }

                    if (coords.length < 2) return;

                    const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${coords.join(';')}?overview=full&geometries=geojson`;
                    const response = await fetch(osrmUrl);
                    const routePayload = await response.json();

                    if (routePayload.routes && routePayload.routes.length > 0) {
                        const geom = routePayload.routes[0].geometry;
                        const distanceMeters = routePayload.routes[0].distance;
                        const calculatedMiles = parseFloat((distanceMeters * 0.000621371).toFixed(1));
                        
                        setRouteDistanceMiles(calculatedMiles > 0 ? calculatedMiles : 16.4);

                        const leafletLatLngs = geom.coordinates.map(node => [node[1], node[0]]);
                        activeRouteCoordinatesRef.current = leafletLatLngs;

                        const line = L.polyline(leafletLatLngs, {
                            color: '#2563eb',
                            weight: 5,
                            opacity: 0.85
                        }).addTo(routeGroupRef.current);

                        mapRef.current.fitBounds(line.getBounds(), { padding: [40, 40] });
                        setTimeout(syncMarkersWithMapViewport, 400);
                    }
                } catch (error) {
                    console.error("OSRM routing setup corridor failure", error);
                }
            };

            const handleClearRouteAction = () => {
                setStartInput('');
                setDestInput('');
                setInterimInput('');
                setShowInterimField(false);
                activeRouteCoordinatesRef.current = null;
                routeGroupRef.current.clearLayers();
                setRouteDistanceMiles(0);
                syncMarkersWithMapViewport();
            };

            const toggleStarredStation = (id, e) => {
                if (e) e.stopPropagation();
                if (starredIds.includes(id)) {
                    setStarredIds(starredIds.filter(item => item !== id));
                } else {
                    setStarredIds([...starredIds, id]);
                }
            };

            const clearField = (field) => {
                if (field === 'start') setStartInput('');
                if (field === 'dest') setDestInput('');
                if (field === 'interim') setInterimInput('');
                if (field === 'local') setLocalSearch('');
                setSuggestions([]);
            };

            const currentActivePriceVariant = (station) => {
                if (fuelVariant.includes('E5')) return station.prices.e5;
                if (fuelVariant.includes('B7')) return station.prices.b7;
                return station.prices.e10;
            };

            const sortedCheapestSelection = [...visibleMarkers].sort((a, b) => currentActivePriceVariant(a) - currentActivePriceVariant(b));

            // Advanced Financial Dynamic Computations
            const calculateFinancialMetrics = () => {
                if (sortedCheapestSelection.length === 0 || !routeDistanceMiles) {
                    return { totalCostCheapest: "£0.00", totalCostExpensive: "£0.00", netSavings: "£0.00", fuelRequiredLitres: 0 };
                }

                const fuelPrices = sortedCheapestSelection.map(s => currentActivePriceVariant(s));
                const minPricePence = Math.min(...fuelPrices);
                const maxPricePence = Math.max(...fuelPrices);

                // Calculations: Gallons needed = Miles / MPG. Litres needed = Gallons * 4.54609
                const gallonsNeeded = routeDistanceMiles / (parseFloat(efficiency) || 45);
                const fuelRequiredLitres = gallonsNeeded * 4.54609;

                const costCheapestPence = fuelRequiredLitres * minPricePence;
                const costExpensivePence = fuelRequiredLitres * maxPricePence;
                const savingsPence = costExpensivePence - costCheapestPence;

                return {
                    totalCostCheapest: `£ ${(costCheapestPence / 100).toFixed(2)}`,
                    totalCostExpensive: `£ ${(costExpensivePence / 100).toFixed(2)}`,
                    netSavings: `£${(savingsPence / 100).toFixed(2)}`,
                    fuelRequiredLitres: fuelRequiredLitres.toFixed(1)
                };
            };

            const metrics = calculateFinancialMetrics();

            return (
                <div className="relative w-full h-full flex overflow-hidden bg-slate-50" onClick={() => setActiveHeaderDropdown(null)}>
                    
                    {/* Leaflet Dynamic View Map Layout Canvas */}
                    <div id="map"></div>

                    {/* Fixed Top Status Right Header Bar */}
                    <div className="absolute top-4 right-4 z-[2000] flex flex-col items-end gap-1">
                        <div className="bg-white/95 backdrop-blur-md px-4 py-2 rounded-xl shadow-lg border border-slate-200/80 flex items-center gap-5 text-xs font-semibold text-slate-700" onClick={(e) => e.stopPropagation()}>
                            <div className="flex items-center gap-1.5 text-emerald-600 font-bold uppercase tracking-wider">
                                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                System Live
                            </div>
                            <div className="w-px h-3 bg-slate-200"></div>
                            <button className="hover:text-blue-600 transition">Dashboard</button>
                            
                            {/* Saved Routes Tooltip Wrapper */}
                            <div className="relative">
                                <button 
                                    onClick={() => setActiveHeaderDropdown(activeHeaderDropdown === 'saved' ? null : 'saved')}
                                    className={`hover:text-blue-600 transition flex items-center gap-1.5 ${activeHeaderDropdown === 'saved' ? 'text-blue-600' : ''}`}
                                >
                                    Saved Routes 
                                    <span className="bg-blue-100 text-blue-600 font-extrabold px-1.5 py-0.5 rounded text-[10px]">{savedRoutes.length}</span>
                                </button>
                                
                                {activeHeaderDropdown === 'saved' && (
                                    <div className="absolute right-0 mt-2 w-64 bg-white rounded-xl shadow-xl border border-slate-100 p-2 flex flex-col gap-1 z-[3000]">
                                        <div className="p-2 text-[10px] font-bold text-slate-400 uppercase tracking-wider border-b border-slate-50">Stored Paths Pool</div>
                                        {savedRoutes.map(r => (
                                            <div key={r.id} className="p-2 hover:bg-slate-50 rounded-lg cursor-pointer transition">
                                                <div className="text-xs font-bold text-slate-800">{r.title}</div>
                                                <div className="text-[10px] text-slate-400 font-semibold">{r.info}</div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>

                            {/* Bookmark Forecourts Dropdown Toggle */}
                            <div className="relative">
                                <button 
                                    onClick={() => setActiveHeaderDropdown(activeHeaderDropdown === 'starred' ? null : 'starred')}
                                    className={`hover:text-blue-600 transition flex items-center gap-1.5 ${activeHeaderDropdown === 'starred' ? 'text-blue-600' : ''}`}
                                >
                                    Starred Forecourts
                                    <span className="bg-amber-100 text-amber-700 font-extrabold px-1.5 py-0.5 rounded text-[10px]">{starredIds.length}</span>
                                </button>

                                {activeHeaderDropdown === 'starred' && (
                                    <div className="absolute right-0 mt-2 w-64 bg-white rounded-xl shadow-xl border border-slate-100 p-2 flex flex-col gap-1 z-[3000]">
                                        <div className="p-2 text-[10px] font-bold text-slate-400 uppercase tracking-wider border-b border-slate-50">Monitored Fuel Forecourts</div>
                                        {REAL_TERRESTRIAL_STATIONS.filter(s => starredIds.includes(s.id)).map(f => (
                                            <div key={f.id} className="p-2 hover:bg-slate-50 rounded-lg cursor-pointer transition flex justify-between items-center">
                                                <div className="text-xs font-bold text-slate-800 truncate pr-2">{f.brand} - {f.address.split(',')[0]}</div>
                                                <span className="bg-emerald-50 text-emerald-600 font-bold text-[10px] px-1.5 py-0.5 rounded">{f.prices.e10}p</span>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* Left Panel Sidebar Deck Dashboard */}
                    <div className="absolute top-4 left-4 bottom-4 w-[410px] bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl z-[1000] flex flex-col overflow-visible border border-slate-200/60">
                        <div className="p-5 flex flex-col gap-4 flex-1 overflow-y-auto no-scrollbar">
                            
                            <div>
                                <h1 className="text-xl font-black text-slate-900 tracking-tight">Fuel Optimization</h1>
                                <p className="text-[9px] text-blue-600 font-bold tracking-widest uppercase mt-0.5">CORRIDOR TRACK COMPUTATIONAL PIPELINE ACTIVE</p>
                            </div>

                            {/* Search Tab Switch Mode Toggle */}
                            <div className="flex bg-slate-100 p-1 rounded-xl border border-slate-200/40 shrink-0">
                                <button onClick={() => { setSearchMode('local'); handleClearRouteAction(); }} className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${searchMode === 'local' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-400 hover:text-slate-600'}`}>📍 Local Area Map</button>
                                <button onClick={() => setSearchMode('route')} className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${searchMode === 'route' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-400 hover:text-slate-600'}`}>🏎️ Route Corridor</button>
                            </div>

                            {/* Local Area Search Form Module Options */}
                            {searchMode === 'local' && (
                                <div className="flex flex-col gap-2 relative z-[999]">
                                    <div className="relative">
                                        <label className="text-[10px] font-bold tracking-wider uppercase text-slate-400 block mb-1">Search Center Location</label>
                                        <div className="relative flex items-center">
                                            <input 
                                                type="text" value={localSearch} onChange={(e) => executeGeocodeLookup(e.target.value, 'local')} 
                                                className="w-full text-xs font-semibold border border-slate-200 rounded-xl pl-3.5 pr-10 py-3 focus:outline-none text-slate-800 bg-slate-50/50" 
                                                placeholder="e.g. Edinburgh, Scotland" 
                                            />
                                            {localSearch && <button onClick={() => clearField('local')} className="absolute right-3 text-slate-400 hover:text-slate-600 text-xs">✕</button>}
                                        </div>

                                        <div className="mt-1.5 flex justify-end">
                                            <button 
                                                type="button" onClick={handleAutoDetectLocation}
                                                className="text-[11px] font-bold text-blue-600 hover:text-blue-800 transition flex items-center gap-1 bg-blue-50/50 px-2 py-1 rounded border border-blue-100"
                                            >
                                                🎯 {isLocating ? 'Locating device grid...' : 'Detect Current Location'}
                                            </button>
                                        </div>

                                        {activeSuggestionField === 'local' && suggestions.length > 0 && (
                                            <div className="absolute left-0 right-0 bg-white border border-slate-200 mt-1 rounded-xl shadow-2xl z-[99999] max-h-44 overflow-y-auto">
                                                {suggestions.map((s, idx) => (
                                                    <div key={idx} onClick={() => confirmSuggestionAssignment(s, 'local')} className="p-2.5 text-xs hover:bg-slate-50 cursor-pointer border-b last:border-0 border-slate-100 text-slate-700 font-medium">{s.display_name}</div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}

                            {/* Route Corridor Input Panel - Style Overhauled to match Screenshot 2026-05-31 at 00.30.59 */}
                            {searchMode === 'route' && (
                                <div className="flex flex-col gap-1 relative z-[999] animate-in fade-in duration-200">
                                    <div className="bg-slate-50 border border-slate-200 rounded-xl p-3 flex flex-col gap-2 relative">
                                        
                                        {/* Start point address input field */}
                                        <div className="relative">
                                            <div className="absolute left-3 top-1/2 -translate-y-1/2 flex items-center gap-2">
                                                <span className="w-2 h-2 rounded-full bg-emerald-500 ring-4 ring-emerald-100"></span>
                                                <span className="text-[10px] font-black tracking-wider uppercase text-slate-400 border-r border-slate-200 pr-2">Start</span>
                                            </div>
                                            <input 
                                                type="text" value={startInput} onChange={(e) => executeGeocodeLookup(e.target.value, 'start')} 
                                                className="w-full text-xs font-bold bg-white border border-slate-200/80 rounded-lg pl-16 pr-8 py-2.5 text-slate-800 focus:outline-none focus:border-blue-400 transition"
                                                placeholder="Enter journey start point"
                                            />
                                            {startInput && <button onClick={() => clearField('start')} className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-xs">✕</button>}
                                            
                                            {activeSuggestionField === 'start' && suggestions.length > 0 && (
                                                <div className="absolute top-11 left-0 right-0 bg-white border border-slate-200 rounded-lg shadow-2xl z-[99999] max-h-36 overflow-y-auto">
                                                    {suggestions.map((s, idx) => (
                                                        <div key={idx} onClick={() => confirmSuggestionAssignment(s, 'start')} className="p-2 text-xs hover:bg-slate-50 cursor-pointer text-slate-700 border-b border-slate-50">{s.display_name}</div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>

                                        {/* Waypoint intermediate input block segment */}
                                        {showInterimField && (
                                            <div className="relative animate-in slide-in-from-top-1 duration-150">
                                                <div className="absolute left-3 top-1/2 -translate-y-1/2 flex items-center gap-2">
                                                    <span className="w-2 h-2 rounded-full bg-amber-500 ring-4 ring-amber-100"></span>
                                                    <span className="text-[10px] font-black tracking-wider uppercase text-slate-400 border-r border-slate-200 pr-2">Stop</span>
                                                </div>
                                                <input 
                                                    type="text" value={interimInput} onChange={(e) => executeGeocodeLookup(e.target.value, 'interim')} 
                                                    className="w-full text-xs font-bold bg-white border border-slate-200/80 rounded-lg pl-16 pr-8 py-2.5 text-slate-800 focus:outline-none focus:border-blue-400 transition"
                                                    placeholder="Enter waypoint destination"
                                                />
                                                <button onClick={() => { setShowInterimField(false); clearField('interim'); }} className="absolute right-2.5 top-1/2 -translate-y-1/2 text-rose-500 font-bold text-xs hover:text-rose-700">✕</button>
                                                
                                                {activeSuggestionField === 'interim' && suggestions.length > 0 && (
                                                    <div className="absolute top-11 left-0 right-0 bg-white border border-slate-200 rounded-lg shadow-2xl z-[99999] max-h-36 overflow-y-auto">
                                                        {suggestions.map((s, idx) => (
                                                            <div key={idx} onClick={() => confirmSuggestionAssignment(s, 'interim')} className="p-2 text-xs hover:bg-slate-50 cursor-pointer text-slate-700 border-b border-slate-50">{s.display_name}</div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        )}

                                        {/* Destination route location input */}
                                        <div className="relative">
                                            <div className="absolute left-3 top-1/2 -translate-y-1/2 flex items-center gap-2">
                                                <span className="w-2 h-2 rounded-full bg-blue-600 ring-4 ring-blue-100"></span>
                                                <span className="text-[10px] font-black tracking-wider uppercase text-slate-400 border-r border-slate-200 pr-2">Dest</span>
                                            </div>
                                            <input 
                                                type="text" value={destInput} onChange={(e) => executeGeocodeLookup(e.target.value, 'dest')} 
                                                className="w-full text-xs font-bold bg-white border border-slate-200/80 rounded-lg pl-16 pr-8 py-2.5 text-slate-800 focus:outline-none focus:border-blue-400 transition"
                                                placeholder="Enter final destination point"
                                            />
                                            {destInput && <button onClick={() => clearField('dest')} className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-xs">✕</button>}
                                            
                                            {activeSuggestionField === 'dest' && suggestions.length > 0 && (
                                                <div className="absolute top-11 left-0 right-0 bg-white border border-slate-200 rounded-lg shadow-2xl z-[99999] max-h-36 overflow-y-auto">
                                                    {suggestions.map((s, idx) => (
                                                        <div key={idx} onClick={() => confirmSuggestionAssignment(s, 'dest')} className="p-2 text-xs hover:bg-slate-50 cursor-pointer text-slate-700 border-b border-slate-50">{s.display_name}</div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>

                                        {/* Bottom Action utilities inside input row bar */}
                                        <div className="flex justify-between items-center mt-1 border-t border-slate-200/60 pt-2 bg-transparent">
                                            {!showInterimField && (
                                                <button type="button" onClick={() => setShowInterimField(true)} className="text-[10px] font-extrabold text-blue-600 hover:text-blue-800 transition flex items-center gap-1 bg-white border border-slate-200 px-2 py-1 rounded shadow-3xs">
                                                    ➕ Add Stop Waypoint
                                                </button>
                                            )}
                                            <button 
                                                type="button" 
                                                onClick={() => { const tmp = startInput; setStartInput(destInput); setDestInput(tmp); setTimeout(computeNetworkRoadCorridor, 100); }}
                                                className="text-[10px] font-extrabold text-slate-500 hover:text-slate-800 transition ml-auto flex items-center gap-1 bg-white border border-slate-200 px-2 py-1 rounded shadow-3xs"
                                            >
                                                🔄 Invert Addresses
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* Core Operational Parameter Selection Sliders Deck */}
                            <div className="flex flex-col gap-3 relative z-10 shrink-0">
                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="text-[10px] font-bold tracking-wider uppercase text-slate-400 block mb-1">Vehicle Efficiency (MPG)</label>
                                        <input type="number" value={efficiency} onChange={(e) => setEfficiency(e.target.value)} className="w-full text-xs font-bold border border-slate-200 rounded-xl px-3 py-2.5 text-slate-800 bg-slate-50/50 focus:outline-none" />
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold tracking-wider uppercase text-slate-400 block mb-1">Corridor Buffer Radius</label>
                                        <div className="flex items-center justify-between border border-slate-200 rounded-xl px-2.5 py-2 bg-slate-50/50">
                                            <input type="number" value={radius} onChange={(e) => setRadius(parseInt(e.target.value) || 0)} className="w-10 bg-transparent text-xs font-bold focus:outline-none text-slate-800" />
                                            <span className="text-[9px] font-extrabold text-blue-600 bg-blue-50 px-1.5 py-0.5 rounded">{radius} Mi</span>
                                        </div>
                                    </div>
                                </div>

                                {searchMode === 'local' && (
                                    <div>
                                        <div className="flex justify-between text-[10px] font-bold tracking-wider uppercase text-slate-400 mb-1">
                                            <span>Scan Scope Radius Mapping</span>
                                        </div>
                                        <input type="range" min="1" max="25" value={radius} onChange={(e) => setRadius(parseInt(e.target.value))} className="w-full h-1.5 bg-slate-100 rounded-lg appearance-none cursor-pointer custom-slider border border-slate-200" />
                                    </div>
                                )}

                                <div>
                                    <label className="text-[10px] font-bold tracking-wider uppercase text-slate-400 block mb-1">Fuel Formulation Variant</label>
                                    <select value={fuelVariant} onChange={(e) => setFuelVariant(e.target.value)} className="w-full text-xs font-bold border border-slate-200 rounded-xl px-3 py-2.5 bg-white text-slate-700 focus:outline-none">
                                        <option>Petrol Unleaded (E10)</option>
                                        <option>Super Unleaded (E5)</option>
                                        <option>Diesel (B7)</option>
                                    </select>
                                </div>
                            </div>

                            {/* Financial Summary Optimization Card - Overhauled to match Screenshot 2026-05-31 at 00.31.10 */}
                            {searchMode === 'route' && activeRouteCoordinatesRef.current && (
                                <div className="bg-slate-900 text-white rounded-xl p-4 flex flex-col gap-3 shrink-0 shadow-lg relative overflow-hidden animate-in fade-in zoom-in-95 duration-200">
                                    <div className="absolute top-0 right-0 p-6 text-slate-800 opacity-10 pointer-events-none select-none font-black text-6xl">£</div>
                                    
                                    <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                                        <div className="flex flex-col">
                                            <span className="text-[10px] font-bold tracking-wider uppercase text-slate-400">FINANCIAL CALCULATION MATRIX</span>
                                            <h3 className="text-sm font-black text-white flex items-center gap-1.5 mt-0.5">
                                                Route Trip Metrics 
                                                <span className="text-[10px] font-bold px-1.5 py-0.2 bg-blue-600/30 text-blue-400 border border-blue-500/20 rounded-md">
                                                    {routeDistanceMiles} mi
                                                </span>
                                            </h3>
                                        </div>
                                        <span className="text-[10px] bg-emerald-500 text-slate-900 font-extrabold px-2.5 py-1 rounded-full shadow-sm tracking-wide">
                                            SAVINGS: {metrics.netSavings}
                                        </span>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="flex flex-col gap-0.5">
                                            <span className="text-[9px] font-bold text-slate-400 uppercase tracking-wider">Cheapest Route Cost</span>
                                            <div className="text-xl font-black text-emerald-400 tracking-tight">{metrics.totalCostCheapest}</div>
                                            <p className="text-[9px] text-slate-500 font-medium">Optimal selection parameter</p>
                                        </div>

                                        <div className="flex flex-col gap-0.5">
                                            <span className="text-[9px] font-bold text-slate-400 uppercase tracking-wider">Most Expensive Trip</span>
                                            <div className="text-xl font-black text-rose-400 tracking-tight">{metrics.totalCostExpensive}</div>
                                            <p className="text-[9px] text-slate-500 font-medium">Standard baseline model</p>
                                        </div>
                                    </div>

                                    <div className="bg-slate-800/50 rounded-lg p-2 flex justify-between items-center text-[10px] text-slate-300 border border-slate-800/30">
                                        <span className="font-semibold">Calculated Fuel Consumption Volume:</span>
                                        <span className="font-black text-white bg-slate-800 px-2 py-0.5 rounded">{metrics.fuelRequiredLitres} Litres</span>
                                    </div>
                                </div>
                            )}

                            {/* Station Choices List Pool Feed Row Elements */}
                            <div className="flex-1 overflow-y-auto no-scrollbar min-h-[140px] flex flex-col gap-2 border-t border-slate-100 pt-3">
                                <span className="text-[10px] font-bold tracking-wider uppercase text-slate-400 block">
                                    🏆 Local Selection Choices ({visibleMarkers.length} identified)
                                </span>
                                {sortedCheapestSelection.length > 0 ? (
                                    sortedCheapestSelection.map((station, index) => (
                                        <div 
                                            key={station.id} 
                                            onClick={() => { mapRef.current.setView([station.lat, station.lng], 14); setSelectedStation(station); }} 
                                            className="bg-white border border-slate-100 p-3 rounded-xl flex justify-between items-center hover:border-blue-300 shadow-xs cursor-pointer transition"
                                        >
                                            <div className="flex items-center gap-2.5 min-w-0">
                                                <span className="text-xs font-bold text-amber-600 bg-amber-50 w-6 h-6 rounded flex items-center justify-center border border-amber-100 shrink-0">#{index + 1}</span>
                                                <div className="min-w-0">
                                                    <h4 className="text-xs font-black text-slate-800 truncate">{station.brand}</h4>
                                                    <p className="text-[9px] text-slate-400 font-semibold uppercase tracking-wide truncate max-w-[170px]">{station.address}</p>
                                                </div>
                                            </div>
                                            
                                            <div className="flex items-center gap-2 shrink-0">
                                                <span className="text-xs font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-100">{currentActivePriceVariant(station)}p</span>
                                                <button 
                                                    onClick={(e) => toggleStarredStation(station.id, e)}
                                                    className="text-sm p-1 text-slate-300 hover:text-amber-500 transition"
                                                >
                                                    {starredIds.includes(station.id) ? '⭐' : '☆'}
                                                </button>
                                            </div>
                                        </div>
                                    ))
                                ) : (
                                    <p className="text-[11px] text-slate-400 font-semibold bg-slate-50 rounded-xl p-4 text-center border border-dashed border-slate-200">
                                        No metrics localized. Reposition viewport map mesh or adjust scanning scopes.
                                    </p>
                                )}
                            </div>

                        </div>

                        {/* Sticky Action Footer Workspace Layout Panel Bar */}
                        <div className="p-3 bg-slate-50 border-t border-slate-100 flex items-center gap-2 shrink-0 rounded-b-2xl">
                            {searchMode === 'route' && activeRouteCoordinatesRef.current && (
                                <button onClick={handleClearRouteAction} className="px-3 py-3 bg-rose-50 border border-rose-200 text-rose-600 rounded-xl hover:bg-rose-100 font-bold text-xs transition active:scale-95">Clear</button>
                            )}
                            <button 
                                onClick={searchMode === 'route' ? computeNetworkRoadCorridor : syncMarkersWithMapViewport}
                                className="flex-1 py-3 bg-slate-900 hover:bg-slate-800 text-white rounded-xl font-bold text-xs tracking-wider uppercase transition active:scale-95 shadow-md text-center"
                            >
                                {searchMode === 'route' ? '🔎 Calculate Route Corridor' : '🔍 Scan Local Region'}
                            </button>
                        </div>
                    </div>

                    {/* Viewport Sync Button */}
                    <div className="absolute bottom-6 left-1/2 -translate-x-1/2 z-[1000]">
                        <button onClick={syncMarkersWithMapViewport} className="bg-slate-900 text-white border border-slate-800 px-5 py-2.5 rounded-full text-[11px] font-bold tracking-wider uppercase shadow-2xl hover:bg-slate-800 transition active:scale-95">🔄 Sync Viewport Area</button>
                    </div>

                    {/* Forecourt Inspector Dialog Overlay */}
                    {selectedStation && (
                        <div className="absolute bottom-6 right-6 z-[1000] bg-white rounded-2xl shadow-2xl p-5 w-80 border border-slate-200/80 flex flex-col gap-3.5 animate-in slide-in-from-bottom-4 duration-200">
                            <div className="flex justify-between items-start">
                                <div>
                                    <h3 className="text-base font-black text-slate-900 tracking-tight">{selectedStation.brand}</h3>
                                    <p className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">{selectedStation.address}</p>
                                </div>
                                <button onClick={() => setSelectedStation(null)} className="text-slate-400 hover:text-slate-600 font-bold text-xs p-1">✕</button>
                            </div>
                            
                            <div className="grid grid-cols-3 gap-2">
                                <div className="bg-emerald-50 text-emerald-800 border border-emerald-200/60 p-2 rounded-xl text-center">
                                    <p className="text-[9px] font-bold uppercase tracking-wide opacity-80">Unleaded</p>
                                    <p className="text-sm font-black mt-0.5">{selectedStation.prices.e10}p</p>
                                </div>
                                <div className="bg-blue-50 text-blue-800 border border-blue-200/60 p-2 rounded-xl text-center">
                                    <p className="text-[9px] font-bold uppercase tracking-wide opacity-80">Super E5</p>
                                    <p className="text-sm font-black mt-0.5">{selectedStation.prices.e5}p</p>
                                </div>
                                <div className="bg-amber-50 text-amber-800 border border-amber-200/60 p-2 rounded-xl text-center">
                                    <p className="text-[9px] font-bold uppercase tracking-wide opacity-80">Diesel B7</p>
                                    <p className="text-sm font-black mt-0.5">{selectedStation.prices.b7}p</p>
                                </div>
                            </div>

                            <div className="border-t border-slate-100 pt-2 flex justify-between items-center">
                                <button 
                                    onClick={(e) => toggleStarredStation(selectedStation.id, e)}
                                    className={`w-full py-2 rounded-xl text-xs font-bold border transition text-center flex items-center justify-center gap-1.5 ${starredIds.includes(selectedStation.id) ? 'bg-amber-50 border-amber-300 text-amber-700' : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'}`}
                                >
                                    ⭐ {starredIds.includes(selectedStation.id) ? 'Remove Star' : 'Star Forecourt'}
                                </button>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
