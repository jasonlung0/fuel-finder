<!DOCTYPE html>
<html lang="en-GB" class="h-full bg-slate-50/50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuel Route Planner Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet-geosearch@3.11.0/dist/geosearch.css" />
    <script src="https://unpkg.com/leaflet-geosearch@3.11.0/dist/bundle.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.1.0/turf.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        .leaflet-bar { border: none !important; box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1) !important; border-radius: 8px !important; overflow: hidden; }
        .leaflet-bar a { background-color: #ffffff !important; color: #0f172a !important; border-bottom: 1px solid #f1f5f9 !important; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="flex h-full w-full overflow-hidden text-slate-900 antialiased font-sans relative">

    <button onclick="toggleSidebar()" class="absolute top-4 left-4 z-[3000] bg-white hover:bg-slate-50 text-slate-900 border border-slate-200 h-9 w-9 rounded-md shadow-sm flex items-center justify-center font-medium transition-transform active:scale-95 focus:outline-none">
        <span id="toggleIcon" class="text-sm font-bold">←</span>
    </button>

    <div id="sidebar" class="fixed md:static inset-y-0 left-0 w-[380px] min-w-[380px] h-full bg-white border-r border-slate-200 flex flex-col z-[2500] p-5 pt-16 shadow-lg md:shadow-sm overflow-y-auto shrink-0 transition-transform duration-300 transform translate-x-0 [&.collapsed]:-translate-x-full md:[&.collapsed]:hidden">
        
        <div class="mb-5">
            <h2 class="text-lg font-semibold tracking-tight text-slate-900 flex items-center gap-2">
                <span class="text-xl">⛽</span> Fuel Route Planner Dashboard
            </h2>
            <p class="text-xs text-slate-500 mt-0.5">Find live-pricing fuel along your journey.</p>
        </div>
        
        <div class="p-1 bg-slate-100 rounded-lg flex gap-1 mb-5">
            <button class="tab-btn active flex-1 text-xs font-medium py-1.5 px-3 rounded-md transition-all text-slate-600 bg-transparent [&.active]:bg-white [&.active]:text-slate-950 [&.active]:shadow-sm" onclick="switchTab('local-tab')">
                📍 Local View
            </button>
            <button class="tab-btn flex-1 text-xs font-medium py-1.5 px-3 rounded-md transition-all text-slate-600 bg-transparent [&.active]:bg-white [&.active]:text-slate-950 [&.active]:shadow-sm" onclick="switchTab('route-tab')">
                🛣️ Route Planner
            </button>
        </div>

        <div class="space-y-4">
            
            <div id="local-tab" class="tab-content block [&:not(.active)]:hidden active space-y-4">
                <div class="relative">
                    <label class="block text-xs font-medium text-slate-500 mb-1.5">Search Location</label>
                    <input type="text" id="localSearchInput" placeholder="Search a town, city or postcode..." autocomplete="off" class="w-full bg-white border border-slate-200 rounded-md py-2 px-3 text-sm text-slate-900 shadow-sm placeholder:text-slate-400 focus:outline-none focus:ring-1 focus:ring-slate-950">
                    <div id="localSuggestions" class="suggestions-box absolute top-[62px] left-0 w-full bg-white border border-slate-200 z-[9999] hidden max-h-[150px] overflow-y-auto rounded-md shadow-md divide-y divide-slate-100"></div>
                </div>

                <div class="bg-slate-50 border border-slate-200 rounded-xl p-4">
                    <label class="flex justify-between items-center text-xs font-medium text-slate-700 mb-2">
                        <span>🎯 Nearest Stations</span>
                        <span class="bg-slate-200/80 text-slate-900 font-semibold px-2 py-0.5 rounded text-[10px]"><span id="localRadiusVal">5</span> Miles</span>
                    </label>
                    <input type="range" id="localRadiusSlider" min="1" max="10" value="5" step="1" class="w-full h-1 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-slate-900" oninput="updateLocalRadiusLabel(this.value)">
                </div>
            </div>

            <div id="route-tab" class="tab-content block [&:not(.active)]:hidden space-y-4">
                <div id="waypointContainer" class="space-y-2.5"></div>
                
                <button class="w-full text-xs font-medium py-2 px-4 rounded-md border border-dashed border-slate-300 text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-colors flex items-center justify-center gap-1.5" onclick="addNewWaypointField('Stop')">
                    <span>➕</span> Add Interim Stop
                </button>
                
                <div id="bufferRadiusContainer" class="bg-slate-50 border border-slate-200 rounded-xl p-4 hidden">
                    <label class="flex justify-between items-center text-xs font-medium text-slate-700 mb-2">
                        <span>🛡️ Corridor Buffer Range Boundary</span>
                        <span class="bg-slate-200/80 text-slate-900 font-semibold px-2 py-0.5 rounded text-[10px]"><span id="radiusVal">3</span> km</span>
                    </label>
                    <input type="range" id="bufferRadius" min="1" max="15" value="3" step="0.5" class="w-full h-1 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-slate-900" oninput="updateRadiusLabel(this.value)">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1.5">Vehicle Consumption Target (MPG)</label>
                    <input type="number" id="mpg" value="45" min="10" max="100" class="w-full bg-white border border-slate-200 rounded-md py-1.5 px-3 text-sm text-slate-900 shadow-sm focus:outline-none focus:ring-1 focus:ring-slate-950">
                </div>

                <button class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium text-sm py-2 px-4 rounded-md shadow transition-colors flex items-center justify-center gap-2" onclick="calculateJourney()">
                    🚀 Calculate Route Plan
                </button>
            </div>
        </div>

        <div class="mt-4">
            <label class="
