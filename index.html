<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corridor Route Optimization & Planning Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        #map { height: 100vh; width: 100%; z-index: 1; }
        .custom-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #2563eb;
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-slate-50 font-sans overflow-hidden">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Mock Station Data Generator
        const generateMockForecourts = (centerLat, centerLng, count = 15) => {
            const brands = ['ASDA', 'SAINSBURYS', 'MORRISONS', 'GULF', 'JET', 'BP', 'SHELL'];
            const streets = ['New Mart Road', 'Westfield Road', 'Inglis Green Road', 'Waterfront Broadway', 'Barclay Place'];
            return Array.from({ length: count }, (_, i) => {
                const offsetLat = (Math.random() - 0.5) * 0.15;
                const offsetLng = (Math.random() - 0.5) * 0.15;
                const e10 = parseFloat((150 + Math.random() * 20).toFixed(1));
                return {
                    id: i,
                    brand: brands[Math.floor(Math.random() * brands.length)],
                    address: `${Math.floor(Math.random() * 50) + 1} ${streets[Math.floor(Math.random() * streets.length)]}`,
                    lat: centerLat + offsetLat,
                    lng: centerLng + offsetLng,
                    prices: { e10, e5: parseFloat((e10 + 19).toFixed(1)), b7: parseFloat((e10 + 26).toFixed(1)) }
                };
            });
        };

        function App() {
            // UI App States
            const [searchMode, setSearchMode] = useState('route'); // 'local' or 'route'
            const [startInput, setStartInput] = useState('Dunfermline');
            const [destInput, setDestInput] = useState('Blackpool');
            const [interimInput, setInterimInput] = useState('Moffat');
            const [localSearch, setLocalSearch] = useState('Edinburgh');
            
            const [radius, setRadius] = useState(5);
            const [efficiency, setEfficiency] = useState(45);
            const [fuelVariant, setFuelVariant] = useState('Petrol Unleaded (E10)');
            
            // Autocomplete & Interactive States
            const [suggestions, setSuggestions] = useState([]);
            const [activeSuggestionField, setActiveSuggestionField] = useState(null);
            const [selectedStation, setSelectedStation] = useState(null);
            const [forecourts, setForecourts] = useState([]);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isPoolsOpen, setIsPoolsOpen] = useState(false);

            // Leaflet Map Refs
            const mapRef = useRef(null);
            const routeLayerRef = useRef(null);
            const markersLayerRef = useRef(null);
            const radiusCircleRef = useRef(null);

            // Initial Core Map Initialization
            useEffect(() => {
                if (!mapRef.current) {
                    mapRef.current = L.map('map', { zoomControl: false }).setView([55.9533, -3.1883], 10);
                    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                        attribution: '© OpenStreetMap contributors'
                    }).addTo(mapRef.current);
                    
                    L.control.zoom({ position: 'bottomright' }).addTo(mapRef.current);
                    markersLayerRef.current = L.layerGroup().addTo(mapRef.current);
                    setForecourts(generateMockForecourts(55.9533, -3.1883, 25));
                }
            }, []);

            // Dynamic Marker Updates & Price Color Coding
            useEffect(() => {
                if (markersLayerRef.current && mapRef.current) {
                    markersLayerRef.current.clearLayers();
                    
                    forecourts.forEach(station => {
                        const price = station.prices.e10;
                        let colorClass = 'bg-blue-600';
                        if (price < 155) colorClass = 'bg-emerald-500';
                        if (price > 163) colorClass = 'bg-red-500';

                        const icon = L.divIcon({
                            className: 'custom-pin',
                            html: `<div class="${colorClass} text-white text-[11px] font-bold px-1.5 py-0.5 rounded-full shadow-md border border-white flex items-center justify-center whitespace-nowrap">${price}p</div>`,
                            iconSize: [45, 20]
                        });

                        const marker = L.marker([station.lat, station.lng], { icon });
                        marker.on('click', () => setSelectedStation(station));
                        markersLayerRef.current.addLayer(marker);
                    });
                }
            }, [forecourts]);

            // Fix 6: Scan Window Radius Range Slider dynamic circle update
            useEffect(() => {
                if (searchMode === 'local' && mapRef.current) {
                    if (radiusCircleRef.current) mapRef.current.removeLayer(radiusCircleRef.current);
                    const center = mapRef.current.getCenter();
                    radiusCircleRef.current = L.circle(center, {
                        radius: radius * 1609.34, // Miles to Meters
                        color: '#3b82f6',
                        fillColor: '#93c5fd',
                        fillOpacity: 0.15,
                        weight: 1.5,
                        dashArray: '4, 4'
                    }).addTo(mapRef.current);
                } else if (radiusCircleRef.current && mapRef.current) {
                    mapRef.current.removeLayer(radiusCircleRef.current);
                    radiusCircleRef.current = null;
                }
            }, [radius, searchMode]);

            // Fix 4: Debounced Nominatim Geocoding Autocomplete Dropdown Engine
            const handleGeocodeSearch = async (query, fieldName) => {
                if (fieldName === 'start') setStartInput(query);
                if (fieldName === 'dest') setDestInput(query);
                if (fieldName === 'interim') setInterimInput(query);
                if (fieldName === 'local') setLocalSearch(query);

                if (query.length < 3) {
                    setSuggestions([]);
                    return;
                }

                setActiveSuggestionField(fieldName);
                try {
                    const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=gb&limit=5`);
                    const data = await response.json();
                    setSuggestions(data);
                } catch (err) {
                    console.error("Geocoding failed:", err);
                }
            };

            const selectSuggestion = (item, fieldName) => {
                const displayName = item.display_name.split(',')[0] + ', ' + item.display_name.split(',')[1];
                if (fieldName === 'start') setStartInput(displayName);
                if (fieldName === 'dest') setDestInput(displayName);
                if (fieldName === 'interim') setInterimInput(displayName);
                if (fieldName === 'local') {
                    setLocalSearch(displayName);
                    mapRef.current.setView([parseFloat(item.lat), parseFloat(item.lon)], 12);
                    setForecourts(generateMockForecourts(parseFloat(item.lat), parseFloat(item.lon), 20));
                }
                setSuggestions([]);
                setActiveSuggestionField(null);
            };

            // Fix 2 & 3: Functional Web Geolocation Handling Engine
            const fetchDeviceLocation = () => {
                if (!navigator.geolocation) {
                    alert("Geolocation is not supported by your browser software.");
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const { latitude, longitude } = position.coords;
                        mapRef.current.setView([latitude, longitude], 13);
                        setLocalSearch("Current Device Location");
                        setForecourts(generateMockForecourts(latitude, longitude, 15));
                    },
                    (error) => {
                        alert("Unable to retrieve position. Please check system permissions.");
                    }
                );
            };

            // Fix 1: Road Network-snapped OSRM Route Mapping engine
            const calculateRoute = async () => {
                if (routeLayerRef.current) mapRef.current.removeLayer(routeLayerRef.current);
                
                try {
                    // Geocode points to coordinates
                    const points = [startInput, interimInput, destInput].filter(Boolean);
                    const coords = [];

                    for (let p of points) {
                        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(p)}&countrycodes=gb&limit=1`);
                        const data = await res.json();
                        if (data.length > 0) coords.push(`${data[0].lon},${data[0].lat}`);
                    }

                    if (coords.length < 2) return;

                    // OSRM API routing payload call
                    const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${coords.join(';')}?overview=full&geometries=geojson`;
                    const routeRes = await fetch(osrmUrl);
                    const routeData = await routeRes.json();

                    if (routeData.routes && routeData.routes.length > 0) {
                        const geometry = routeData.routes[0].geometry;
                        // Flip geometry array for Leaflet specification mapping [lat, lng]
                        const latLngs = geometry.coordinates.map(c => [c[1], c[0]]);
                        
                        routeLayerRef.current = L.polyline(latLngs, {
                            color: '#2563eb',
                            weight: 5,
                            opacity: 0.85,
                            dashArray: searchMode === 'route' ? '0' : '5, 10'
                        }).addTo(mapRef.current);

                        mapRef.current.fitBounds(routeLayerRef.current.getBounds(), { padding: [50, 50] });
                        
                        // Seed forecourts mapping along the actual calculated road track boundary
                        const midPoint = latLngs[Math.floor(latLngs.length / 2)];
                        setForecourts(generateMockForecourts(midPoint[0], midPoint[1], 30));
                    }
                } catch (err) {
                    console.error("OSRM Engine Routing Fault:", err);
                }
            };

            // Fix 8: Scan Viewport Logic 
            const scanCurrentViewport = () => {
                if (!mapRef.current) return;
                const center = mapRef.current.getCenter();
                setForecourts(generateMockForecourts(center.lat, center.lng, 20));
            };

            return (
                <div class="relative h-screen w-screen flex">
                    
                    {/* Control Panel Sidebar */}
                    <div class="w-[380px] bg-white h-full shadow-2xl flex flex-col z-[10] border-r border-slate-100 overflow-y-auto">
                        <div class="p-6 flex flex-col gap-5">
                            <div>
                                <h1 class="text-xl font-bold text-slate-950">Search Fuel Price</h1>
                                <p class="text-xs text-emerald-600 mt-1 flex items-center gap-1">
                                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                                    SYSTEM LIVE • Prices updated: Today, 8:13 PM
                                </p>
                            </div>

                            {/* Mode Switching Tabs */}
                            <div class="flex bg-slate-100 p-1 rounded-xl">
                                <button onClick={() => setSearchMode('local')} class={`flex-1 py-2 text-xs font-semibold rounded-lg transition-all ${searchMode === 'local' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-900'}`}>Local Area</button>
                                <button onClick={() => setSearchMode('route')} class={`flex-1 py-2 text-xs font-semibold rounded-lg transition-all ${searchMode === 'route' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-900'}`}>Route Corridor</button>
                            </div>

                            {/* Local Mode View inputs */}
                            {searchMode === 'local' && (
                                <div class="flex flex-col gap-4">
                                    <div class="relative">
                                        <label class="text-[10px] font-bold tracking-wider uppercase text-slate-400 block mb-1.5">Search Center Location</label>
                                        <div class="flex gap-2">
                                            <input type="text" value={localSearch} onChange={(e) => handleGeocodeSearch(e.target.value, 'local')} class="w-full text-sm border border-slate-200 rounded-xl px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500/20" placeholder="e.g. Edinburgh" />
                                            <button onClick={fetchDeviceLocation} class="px-3 border border-slate-200 rounded-xl bg-slate-50 hover:bg-slate-100 text-slate-600 transition" title="Use current device geolocation location">
                                                🎯
                                            </button>
                                        </div>
                                        {activeSuggestionField === 'local' && suggestions.length > 0 && (
                                            <div class="absolute w-full bg-white border border-slate-200 mt-1 rounded-xl shadow-xl z-50 max-h-48 overflow-y-auto">
                                                {suggestions.map(s => <div key={s.place_id} onClick={() => selectSuggestion(s, 'local')} class="p-2.5 text-sm hover:bg-slate-50 cursor-pointer border-b last:border-0 border-slate-100 text-slate-700">{s.display_name}</div>)}
                                            </div>
                                        )}
                                    </div>

                                    <div>
                                        <div class="flex justify-between text-[10px] font-bold tracking-wider uppercase text-slate-400 mb-1.5">
                                            <span>Scan Window Radius</span>
                                            <span class="text-blue-600 font-bold normal-case text-xs">{radius} Miles width</span>
                                        </div>
                                        <input type="range" min="1" max="25" value={radius} onChange={(e) => setRadius(parseInt(e.target.value))} class="w-full h-1.5 bg-slate-100 rounded-lg appearance-none cursor-pointer custom-slider" />
                                    </div>
                                </div>
                            )}

                            {/* Route Corridor Parameters Input Configuration mapping wrapper */}
                            {searchMode === 'route' && (
                                <div class="flex flex-col gap-4">
                                    <div class="relative">
                                        <label class="text-[10px] font-bold tracking-wider uppercase text-slate-400 block mb-1.5">🟢 Starting Location</label>
                                        <input type="text" value={startInput} onChange={(e) => handleGeocodeSearch(e.target.value, 'start')} class="w-full text-sm border border-slate-200 rounded-xl px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500/20" placeholder="e.g. Dunfermline" />
                                        {activeSuggestionField === 'start' && suggestions.length > 0 && (
                                            <div class="absolute w-full bg-white border border-slate-200 mt-1 rounded-xl shadow-xl z-50 max-h-48 overflow-y-auto">
                                                {suggestions.map(s => <div key={s.place_id} onClick={() => selectSuggestion(s, 'start')} class="p-2.5 text-sm hover:bg-slate-50 cursor-pointer border-b last:border-0 border-slate-100 text-slate-700">{s.display_name}</div>)}
                                            </div>
                                        )}
                                    </div>

                                    <div class="relative">
                                        <label class="text-[10px] font-bold tracking-wider uppercase text-slate-400 block mb-1.5">🔵 Add Interim Stop (Optional)</label>
                                        <input type="text" value={interimInput} onChange={(e) => handleGeocodeSearch(e.target.value, 'interim')} class="w-full text-sm border border-slate-200 rounded-xl px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500/20" placeholder="e.g. Moffat" />
                                        {activeSuggestionField === 'interim' && suggestions.length > 0 && (
                                            <div class="absolute w-full bg-white border border-slate-200 mt-1 rounded-xl shadow-xl z-50 max-h-48 overflow-y-auto">
                                                {suggestions.map(s => <div key={s.place_id} onClick={() => selectSuggestion(s, 'interim')} class="p-2.5 text-sm hover:bg-slate-50 cursor-pointer border-b last:border-0 border-slate-100 text-slate-700">{s.display_name}</div>)}
                                            </div>
                                        )}
                                    </div>

                                    <div class="relative">
                                        <label class="text-[10px] font-bold tracking-wider uppercase text-slate-400 block mb-1.5">🔴 Destination</label>
                                        <input type="text" value={destInput} onChange={(e) => handleGeocodeSearch(e.target.value, 'dest')} class="w-full text-sm border border-slate-200 rounded-xl px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500/20" placeholder="e.g. Blackpool" />
                                        {activeSuggestionField === 'dest' && suggestions.length > 0 && (
                                            <div class="absolute w-full bg-white border border-slate-200 mt-1 rounded-xl shadow-xl z-50 max-h-48 overflow-y-auto">
                                                {suggestions.map(s => <div key={s.place_id} onClick={() => selectSuggestion(s, 'dest')} class="p-2.5 text-sm hover:bg-slate-50 cursor-pointer border-b last:border-0 border-slate-100 text-slate-700">{s.display_name}</div>)}
                                            </div>
                                        )}
                                    </div>

                                    <button onClick={calculateRoute} class="w-full bg-slate-900 text-white text-sm font-semibold py-3 px-4 rounded-xl hover:bg-slate-800 transition active:scale-[0.99] mt-2 shadow-sm">🚀 Search Route Corridor</button>
                                </div>
                            )}

                            <hr class="border-slate-100" />

                            {/* Secondary Global App Config Options */}
                            <div class="flex flex-col gap-4">
                                <div>
                                    <label class="text-[10px] font-bold tracking-wider uppercase text-slate-400 block mb-1.5">Vehicle Efficiency (MPG)</label>
                                    <input type="number" value={efficiency} onChange={(e) => setEfficiency(e.target.value)} class="w-full text-sm border border-slate-200 rounded-xl px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500/20" />
                                </div>

                                <div>
                                    <label class="text-[10px] font-bold tracking-wider uppercase text-slate-400 block mb-1.5">Fuel Formulation Variant</label>
                                    <select value={fuelVariant} onChange={(e) => setFuelVariant(e.target.value)} class="w-full text-sm border border-slate-200 rounded-xl px-3.5 py-2.5 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20">
                                        <option>Petrol Unleaded (E10)</option>
                                        <option>Super Unleaded (E5)</option>
                                        <option>Diesel (B7)</option>
                                    </select>
                                </div>
                            </div>

                            {/* Fix 5: Reverted View Pricing Info button layout container triggers Modal state */}
                            <div class="bg-blue-50/60 border border-blue-100/80 p-4 rounded-2xl flex flex-col gap-3 mt-2">
                                <div class="flex justify-between items-center">
                                    <span class="text-xs font-semibold text-slate-600">Financial Calculations Summary</span>
                                    <span class="text-[11px] font-bold bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full">Active</span>
                                </div>
                                <button onClick={() => setIsModalOpen(true)} class="w-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-2.5 px-4 rounded-xl transition flex items-center justify-between shadow-sm">
                                    <span>📊 View Pricing Info</span>
                                    <span>£ Live</span>
                                </button>
                            </div>
                        </div>

                        {/* Fix 7: Working Pools Slide-Over Activation System */}
                        <div class="mt-auto p-4 bg-slate-50 border-t border-slate-100 flex gap-2">
                            <button onClick={() => setIsPoolsOpen(!isPoolsOpen)} class="flex-1 bg-white border border-slate-200 text-slate-700 text-xs font-bold py-3 px-4 rounded-xl hover:bg-slate-100 transition shadow-sm flex items-center justify-center gap-1.5">
                                📦 Pools List ({forecourts.length})
                            </button>
                        </div>
                    </div>

                    {/* Primary Map Screen Engine Interface Container */}
                    <div class="flex-1 h-full relative">
                        <div id="map"></div>

                        {/* Fix 8: Moved Viewport Scanning Trigger Control Panel to lower center frame */}
                        <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-[500] pointer-events-auto">
                            <button onClick={scanCurrentViewport} class="bg-white/95 backdrop-blur-md text-slate-900 border border-slate-200 px-5 py-3 rounded-full text-xs font-bold shadow-xl hover:bg-white tracking-wide uppercase flex items-center gap-2 transition active:scale-95">
                                🔍 Scan This Viewport Area
                            </button>
                        </div>

                        {/* Inline Station Detail Floating Card Interface */}
                        {selectedStation && (
                            <div class="absolute bottom-6 right-6 z-[500] bg-white rounded-2xl shadow-2xl p-5 w-80 border border-slate-100 flex flex-col gap-4 animate-in fade-in slide-in-from-bottom-4 duration-200">
                                <div class="flex justify-between items-start">
                                    <div>
                                        <h3 class="text-base font-bold text-slate-900">{selectedStation.brand}</h3>
                                        <p class="text-xs text-slate-400 mt-0.5">{selectedStation.address}</p>
                                    </div>
                                    <button onClick={() => setSelectedStation(null)} class="text-slate-400 hover:text-slate-600 text-sm p-1 rounded-lg hover:bg-slate-50">✕</button>
                                </div>
                                <div class="grid grid-cols-3 gap-2">
                                    <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100 text-center">
                                        <p class="text-[9px] font-bold text-slate-400 uppercase tracking-wider">E10</p>
                                        <p class="text-sm font-bold text-slate-800 mt-0.5">{selectedStation.prices.e10}p</p>
                                    </div>
                                    <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100 text-center">
                                        <p class="text-[9px] font-bold text-slate-400 uppercase tracking-wider">E5</p>
                                        <p class="text-sm font-bold text-slate-800 mt-0.5">{selectedStation.prices.e5}p</p>
                                    </div>
                                    <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100 text-center">
                                        <p class="text-[9px] font-bold text-slate-400 uppercase tracking-wider">B7</p>
                                        <p class="text-sm font-bold text-slate-800 mt-0.5">{selectedStation.prices.b7}p</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Fix 7: Dynamic Pools Sidebar Drawer Overlays */}
                        {isPoolsOpen && (
                            <div class="absolute top-0 right-0 h-full w-80 bg-white/95 backdrop-blur-md z-[1000] border-l border-slate-200 shadow-2xl p-6 flex flex-col gap-4 animate-in slide-in-from-right duration-300">
                                <div class="flex justify-between items-center">
                                    <h2 class="text-base font-bold text-slate-900">Remote Forecourt Pool</h2>
                                    <button onClick={() => setIsPoolsOpen(false)} class="text-slate-500 font-bold hover:text-slate-700">✕</button>
                                </div>
                                <p class="text-xs text-slate-400">Total detected available rows: {forecourts.length} forecourts in system cluster scope region.</p>
                                <div class="flex-1 overflow-y-auto flex flex-col gap-2">
                                    {forecourts.map((f, idx) => (
                                        <div key={idx} onClick={() => { mapRef.current.setView([f.lat, f.lng], 14); setSelectedStation(f); }} class="p-3 bg-white border border-slate-100 rounded-xl hover:border-blue-500 hover:shadow-sm cursor-pointer transition">
                                            <div class="flex justify-between font-bold text-xs text-slate-800"><span>{f.brand}</span><span class="text-blue-600">{f.prices.e10}p</span></div>
                                            <p class="text-[10px] text-slate-400 mt-0.5">{f.address}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Fix 5: Reverted High Fidelity Calculation Summary Overlap Overlay Modal */}
                    {isModalOpen && (
                        <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[9999] flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full p-6 border border-slate-100 animate-in zoom-in-95 duration-150 flex flex-col gap-5">
                                <div class="flex justify-between items-center">
                                    <div class="flex items-center gap-2">
                                        <span class="text-xl">📊</span>
                                        <h3 class="text-lg font-bold text-slate-900">Financial Analysis Summary</h3>
                                    </div>
                                    <button onClick={() => setIsModalOpen(false)} class="text-slate-400 hover:text-slate-600 font-bold p-1">✕</button>
                                </div>

                                <div class="flex flex-col gap-3">
                                    <div class="flex justify-between items-center p-3.5 bg-slate-50 rounded-xl border border-slate-100">
                                        <span class="text-xs font-medium text-slate-500">Route Scan Scope Path Range</span>
                                        <span class="text-sm font-bold text-slate-800">18.5 miles</span>
                                    </div>
                                    <div class="flex justify-between items-center p-3.5 bg-slate-50 rounded-xl border border-slate-100">
                                        <span class="text-xs font-medium text-slate-500">Target Benchmark Fuel Price</span>
                                        <span class="text-sm font-bold text-emerald-600">152.7p / Liter</span>
                                    </div>
                                    <div class="flex justify-between items-center p-3.5 bg-emerald-50/50 rounded-xl border border-emerald-100">
                                        <span class="text-xs font-semibold text-emerald-800">Projected Run Expenses Target</span>
                                        <span class="text-sm font-black text-emerald-700">£2.86 Total</span>
                                    </div>
                                </div>

                                <div class="text-[11px] text-slate-400 leading-relaxed bg-slate-50 p-3 rounded-xl border border-slate-100">
                                    <strong>Calculations Model Parameters:</strong> Assumes a consumption efficiency profile of <strong>{efficiency} MPG</strong> calculated dynamically against real-time API localized telemetry parameters data matrices.
                                </div>

                                <button onClick={() => setIsModalOpen(false)} class="w-full bg-slate-900 text-white py-3 rounded-xl text-xs font-bold hover:bg-slate-800 transition">
                                    Dismiss Analysis
                                </button>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
