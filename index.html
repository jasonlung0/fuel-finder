<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UK Fuel Price Finder</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style>
        /* Custom styling to match your exact map marker design */
        .fuel-marker-bubble {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 50px;
            color: white;
            font-weight: 600;
            font-family: ui-sans-serif, system-ui, sans-serif;
            font-size: 13px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.25);
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            white-space: nowrap;
            transition: transform 0.2s ease;
        }
        .fuel-marker-bubble:hover {
            transform: scale(1.08);
            z-index: 1000 !important;
        }
        .logo-container {
            width: 18px;
            height: 18px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }
        .logo-container img {
            width: 85%;
            height: 85%;
            object-fit: contain;
        }
        /* Dynamic pricing colors matching your layout */
        .bg-fuel-blue { background-color: #3b82f6; }
        .bg-fuel-green { background-color: #10b981; }
        .bg-fuel-red { background-color: #ef4444; }
        
        /* Map wrapper adjustments */
        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans overflow-hidden">

    <div class="flex h-screen w-screen">
        
        <aside class="w-96 bg-white border-r border-slate-200 flex flex-col justify-between p-6 z-10 shadow-lg shrink-0 overflow-y-auto">
            <div class="space-y-6">
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-slate-900">Search Fuel Price</h1>
                    <p class="text-xs text-slate-400 mt-0.5">Live parameters lookup control</p>
                </div>

                <div class="grid grid-cols-2 gap-2 bg-slate-100 p-1 rounded-lg text-sm font-medium">
                    <button class="bg-white text-slate-800 py-1.5 px-3 rounded-md shadow-sm border border-slate-200/50 flex items-center justify-center gap-1.5">
                        📍 Local Area
                    </button>
                    <button class="text-slate-500 hover:text-slate-800 py-1.5 px-3 flex items-center justify-center gap-1.5 transition">
                        🚖 Route Corridor
                    </button>
                </div>

                <div class="space-y-1.5">
                    <label class="text-xs font-bold tracking-wider text-slate-400 uppercase">Search Area Location</label>
                    <input type="text" placeholder="Enter town, city or postcode..." 
                           class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition" />
                </div>

                <div class="space-y-3 bg-slate-50 p-4 rounded-xl border border-slate-100">
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-bold text-slate-600 flex items-center gap-1">🎯 Scan Window Radius</span>
                        <span class="text-xs font-bold bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full" id="radius-val">5 Miles</span>
                    </div>
                    <input type="range" min="1" max="30" value="5" id="radius-slider" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-slate-800" />
                </div>

                <div class="space-y-1.5">
                    <label class="text-xs font-bold tracking-wider text-slate-400 uppercase">Fuel Formulation Variant</label>
                    <select id="fuel-type" class="w-full border border-slate-200 bg-white rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition">
                        <option value="E10">Petrol Unleaded (E10)</option>
                        <option value="E5">Super Unleaded (E5)</option>
                        <option value="B7">Diesel (B7)</option>
                    </select>
                </div>

                <label class="flex items-center gap-2 text-sm text-slate-600 cursor-pointer select-none">
                    <input type="checkbox" class="w-4 h-4 rounded text-blue-600 border-slate-300 focus:ring-blue-500" />
                    <span>Traditional Pumps Only</span>
                </label>

                <div class="space-y-1.5">
                    <label class="text-xs font-bold tracking-wider text-slate-400 uppercase">Basemap Overlay Canvas</label>
                    <select class="w-full border border-slate-200 bg-white rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition">
                        <option>Standard Light Canvas</option>
                        <option>Dark Mode Canvas</option>
                    </select>
                </div>
            </div>

            <div class="pt-4 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400">
                <button onclick="loadFuelStationMarkers()" class="flex items-center gap-1 hover:text-slate-700 transition font-medium cursor-pointer">
                    🔄 Refresh Data
                </button>
                <span id="station-counter">Forecourts displayed: 0 rows.</span>
            </div>
        </aside>

        <main class="flex-1 relative">
            
            <div class="absolute top-4 left-1/2 -translate-x-1/2 z-[1000]">
                <button onclick="loadFuelStationMarkers()" class="bg-white hover:bg-slate-50 border border-slate-200 px-4 py-2 rounded-full shadow-md font-medium text-sm flex items-center gap-1.5 transition cursor-pointer text-slate-700">
                    🔍 Scan This Viewport Area
                </button>
            </div>

            <div id="map"></div>
        </main>

    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        // 1. Initialize Map Instance Layer Coordinates (Default to Central Scotland / Edinburgh / Glasgow pipeline)
        const map = L.map('map').setView([55.92, -4.05], 10);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // UI Radius Slider Text Dynamic Sync
        const slider = document.getElementById('radius-slider');
        const sliderVal = document.getElementById('radius-val');
        slider.addEventListener('input', (e) => {
            sliderVal.textContent = `${e.target.value} Miles`;
        });

        // Fuel Type selector change dynamic repaint handler
        document.getElementById('fuel-type').addEventListener('change', () => {
            if(window.cachedStationsPool) renderMarkersToCanvas(window.cachedStationsPool);
        });

        // 2. Clearbit Mapping Dictionary Asset Configuration
        const BRAND_ICON_MAP = {
            'shell': 'https://logo.clearbit.com/shell.co.uk',
            'bp': 'https://logo.clearbit.com/bp.com',
            'esso': 'https://logo.clearbit.com/esso.co.uk',
            'tesco': 'https://logo.clearbit.com/tesco.com',
            'asda': 'https://logo.clearbit.com/asda.com',
            'sainsbury': 'https://logo.clearbit.com/sainsburys.co.uk',
            'morrison': 'https://logo.clearbit.com/morrisons.com',
            'texaco': 'https://logo.clearbit.com/texaco.com',
            'jet': 'https://logo.clearbit.com/jetlocal.co.uk',
            'gulf': 'https://logo.clearbit.com/gulfretail.co.uk',
            'murco': 'https://logo.clearbit.com/murco.co.uk',
            'applegreen': 'https://logo.clearbit.com/applegreenstores.com'
        };

        // 3. Robust High-Tolerance Brand Normalizer Matching Strategy
        function getCorrectBrandLogo(rawBrandName) {
            if (!rawBrandName) return 'https://img.icons8.com/color/48/gas-station.png';
            
            const name = rawBrandName.toLowerCase().trim();

            if (name.includes('shell'))      return BRAND_ICON_MAP['shell'];
            if (name.includes('bp') || name.includes('british petroleum')) return BRAND_ICON_MAP['bp'];
            if (name.includes('esso'))       return BRAND_ICON_MAP['esso'];
            if (name.includes('tesco'))      return BRAND_ICON_MAP['tesco'];
            if (name.includes('asda'))       return BRAND_ICON_MAP['asda'];
            if (name.includes('sainsbury'))  return BRAND_ICON_MAP['sainsbury'];
            if (name.includes('morrison'))   return BRAND_ICON_MAP['morrison'];
            if (name.includes('texaco'))     return BRAND_ICON_MAP['texaco'];
            if (name.includes('jet'))        return BRAND_ICON_MAP['jet'];
            if (name.includes('gulf'))       return BRAND_ICON_MAP['gulf'];
            if (name.includes('murco'))      return BRAND_ICON_MAP['murco'];
            if (name.includes('apple'))      return BRAND_ICON_MAP['applegreen'];

            // Generic fallback icon if no rules apply
            return 'https://img.icons8.com/color/48/gas-station.png';
        }

        // Layer group tracking allocation array instance
        let markerLayerGroup = L.layerGroup().addTo(map);

        // 4. Async Data Stream Delivery Request Pipeline 
        async function loadFuelStationMarkers() {
            try {
                const endpoint = 'https://fuel-cron-scraper.jasonlung0.workers.dev/';
                console.log(`Connecting to secure endpoint framework: ${endpoint}`);
                
                const response = await fetch(endpoint);
                if (!response.ok) throw new Error(`HTTP network error status context returned: ${response.status}`);
                
                const stations = await response.json();
                console.log(`Success! Array parsed. Loaded entries count: ${stations.length}`);
                
                // Store pool globally to support instant dynamic filter transformations
                window.cachedStationsPool = stations;
                renderMarkersToCanvas(stations);

            } catch (error) {
                console.error("Critical execution handler trap caught script failure:", error);
                alert("Data loading pipeline timed out or failed to parse objects stream: " + error.message);
            }
        }

        // 5. DOM Marker Renderer & Color Coding Layer
        function renderMarkersToCanvas(stations) {
            // Drop old pins off current map layout instance viewports
            markerLayerGroup.clearLayers();
            
            const targetedFuelVariant = document.getElementById('fuel-type').value;
            let addedCount = 0;

            // Extract values to compute dynamic price color thresholds (Green/Blue/Red profiling)
            const activePricesList = stations
                .map(s => parseFloat(s[targetedFuelVariant]))
                .filter(p => !isNaN(p) && p > 0);

            const minPrice = Math.min(...activePricesList) || 150;
            const maxPrice = Math.max(...activePricesList) || 170;
            const priceSpreadRange = maxPrice - minPrice;

            stations.forEach(station => {
                const lat = parseFloat(station.latitude || station.lat);
                const lon = parseFloat(station.longitude || station.lng);
                const priceValueRaw = station[targetedFuelVariant];

                // Skip entries missing positional telemetry arrays or pricing fields
                if (isNaN(lat) || isNaN(lon) || !priceValueRaw) return;

                const numericPrice = parseFloat(priceValueRaw);
                
                // Pick badge class wrapper color dynamically depending on regional relative competitive tiers
                let priceColorTierClass = 'bg-fuel-blue';
                if (priceSpreadRange > 0) {
                    const relativePercentile = (numericPrice - minPrice) / priceSpreadRange;
                    if (relativePercentile <= 0.25) {
                        priceColorTierClass = 'bg-fuel-green'; // Exceptionally competitive local price choice
                    } else if (relativePercentile >= 0.75) {
                        priceColorTierClass = 'bg-fuel-red'; // Premium pricing margin profiles
                    }
                }

                // Call the updated brand normalizer to retrieve the accurate asset URL
                const structuredLogoAssetUrl = getCorrectBrandLogo(station.brand_name);

                // Construct UI markup string payload targeting Leaflet engine
                const customMarkerHtmlString = `
                    <div class="fuel-marker-bubble ${priceColorTierClass}">
                        <div class="logo-container">
                            <img src="${structuredLogoAssetUrl}" alt="${station.brand_name || 'Station'}" />
                        </div>
                        <span>${numericPrice.toFixed(1)}p</span>
                    </div>
                `;

                // Generate and inject DOM standard elements custom HTML layouts directly to canvas layer instances
                const leafletCustomIcon = L.divIcon({
                    html: customMarkerHtmlString,
                    className: 'custom-leaflet-div-icon-reset', // Wipe default styling blockages
                    iconSize: [75, 28],
                    iconAnchor: [37, 14]
                });

                const popupDescriptionLayout = `
                    <div class="p-1 font-sans text-xs space-y-1">
                        <div class="font-bold text-sm text-slate-800">${station.brand_name || 'Independent Vendor'}</div>
                        <div class="text-slate-500">${station.address || 'UK Highway Network'}</div>
                        <div class="pt-1.5 border-t border-slate-100 grid grid-cols-2 gap-x-4 gap-y-0.5 text-slate-600 font-medium">
                            <div>Petrol (E10): <span class="font-bold text-slate-900">${station.E10 ? station.E10 + 'p' : 'N/A'}</span></div>
                            <div>Super (E5): <span class="font-bold text-slate-900">${station.E5 ? station.E5 + 'p' : 'N/A'}</span></div>
                            <div>Diesel (B7): <span class="font-bold text-slate-900">${station.B7 ? station.B7 + 'p' : 'N/A'}</span></div>
                        </div>
                    </div>
                `;

                L.marker([lat, lon], { icon: leafletCustomIcon })
                    .bindPopup(popupDescriptionLayout)
                    .addTo(markerLayerGroup);

                addedCount++;
            });

            // Update footer metrics panel interface view counter configurations
            document.getElementById('station-counter').textContent = `Forecourts displayed: ${addedCount} rows.`;
        }

        // Automatic run sequence invocation upon document window launch loading states completion
        window.addEventListener('DOMContentLoaded', loadFuelStationMarkers);
    </script>
</body>
</html>
