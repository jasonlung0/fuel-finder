<!DOCTYPE html>
<html lang="en" class="h-full w-full antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>UK Fuel Price Finder & Route Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="h-full w-full overflow-hidden bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-50 transition-colors duration-300 select-none">

    <!-- Map Container -->
    <div id="map" class="absolute inset-0 w-full h-full z-0"></div>

    <!-- Floating Scan Area Button (Komoot Style Pill) -->
    <button id="btn-scan-bounds" onclick="executeContextualAreaScanPipeline(event)" class="absolute bottom-[130px] md:bottom-12 z-[4000] left-1/2 -translate-x-1/2 hidden bg-zinc-900/95 dark:bg-zinc-100/95 backdrop-blur-md px-6 py-3 rounded-full text-[13px] font-black text-white dark:text-zinc-900 shadow-2xl border border-transparent transition-all transform hover:scale-105 active:scale-95 flex items-center gap-2 focus:outline-none tracking-wide">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        Scan this area
    </button>

    <!-- Mobile Top Pill Navigation -->
    <div class="lg:hidden fixed top-20 left-1/2 -translate-x-1/2 z-[4600] bg-white/90 dark:bg-zinc-900/90 backdrop-blur-xl border border-zinc-200/80 dark:border-zinc-800/80 p-1.5 rounded-full shadow-xl flex gap-1 items-center transition-all h-12">
        <button onclick="setActiveMobileSheet('search')" id="btn-mob-search" class="h-full text-xs font-black tracking-wide px-5 rounded-full bg-emerald-600 text-white transition-all shadow-md focus:outline-none">
            Stations
        </button>
        <button onclick="setActiveMobileSheet('telemetry')" id="btn-mob-telemetry" class="h-full text-xs font-bold tracking-wide px-5 rounded-full text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 transition-all focus:outline-none">
            Telemetry
        </button>
    </div>

    <!-- Minimalist Floating Header -->
    <header class="fixed top-0 left-0 right-0 lg:top-4 lg:left-4 lg:right-auto lg:w-[380px] lg:rounded-3xl h-16 lg:h-auto bg-white/90 dark:bg-zinc-950/90 backdrop-blur-xl border-b lg:border border-zinc-200/60 dark:border-zinc-800/60 z-[5000] flex items-center justify-between px-4 lg:p-4 shadow-sm lg:shadow-2xl transition-all duration-200">
        <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.reload();">
            <div class="bg-emerald-500 text-white p-2 rounded-2xl shadow-lg shadow-emerald-500/30">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            </div>
            <div>
                <h1 class="text-sm font-black text-zinc-900 dark:text-white leading-none tracking-tight">FuelFinder UK</h1>
                <span id="live-timestamp-label" class="text-[9px] font-bold text-emerald-600 dark:text-emerald-500 mt-1 block tracking-wider uppercase">Live Network</span>
            </div>
        </div>

        <div class="hidden lg:flex flex-1 mx-4 bg-zinc-100/80 dark:bg-zinc-900/80 p-1 rounded-2xl border border-zinc-200/50 dark:border-zinc-800/50">
            <button id="toggle-view-stations" onclick="setActiveMobileSheet('search')" class="flex-1 py-1.5 text-[11px] font-black tracking-wide rounded-xl bg-white dark:bg-zinc-800 text-zinc-900 dark:text-zinc-50 shadow-sm transition-all duration-200 focus:outline-none">
                Local
            </button>
            <button id="toggle-view-telemetry" onclick="setActiveMobileSheet('telemetry')" class="flex-1 py-1.5 text-[11px] font-bold tracking-wide text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-200 transition-all duration-200 focus:outline-none">
                Data
            </button>
        </div>

        <div class="flex items-center gap-2">
            <button onclick="window.toggleSystemColorModeTheme(event)" class="w-10 h-10 flex items-center justify-center bg-zinc-50 dark:bg-zinc-900 border border-zinc-200/80 dark:border-zinc-800 rounded-full text-zinc-600 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-all shadow-sm focus:outline-none">
                <svg id="theme-icon-sun" class="w-4 h-4 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                <svg id="theme-icon-moon" class="w-4 h-4 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
            </button>

            <div class="relative">
                <button onclick="window.toggleStarredDropdownDashboardPanel(event)" class="h-10 px-3 bg-zinc-50 dark:bg-zinc-900 border border-zinc-200/80 dark:border-zinc-800 rounded-full text-[11px] font-black flex items-center gap-1.5 focus:outline-none hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-all shadow-sm">
                    <span class="text-amber-500 text-sm">★</span>
                    <span id="saved-items-count-badge" class="bg-zinc-900 dark:bg-white text-white dark:text-zinc-900 font-black text-[10px] px-2 py-0.5 rounded-full tabular-nums">0</span>
                </button>
                
                <div id="starred-dropdown-panel" class="hidden absolute top-14 right-0 lg:left-0 bg-white dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 w-[calc(100vw-24px)] sm:w-80 rounded-3xl shadow-2xl p-3 z-[6000] flex flex-col max-h-[70vh]">
                    <div class="flex bg-zinc-100 dark:bg-zinc-900 p-1 rounded-2xl mb-3">
                        <button id="dir-tab-stations" onclick="switchDirectoryTabContext('stations')" class="flex-1 py-2 rounded-xl text-[11px] font-black bg-white dark:bg-zinc-800 text-zinc-900 dark:text-white shadow-sm focus:outline-none">Stations</button>
                        <button id="dir-tab-routes" onclick="switchDirectoryTabContext('routes')" class="flex-1 py-2 rounded-xl text-[11px] font-bold text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-white focus:outline-none transition">Routes</button>
                    </div>
                    <div id="starred-list-items-container" class="max-h-64 overflow-y-auto custom-scrollbar flex flex-col gap-1 pr-1"></div>
                </div>
            </div>
        </div>
    </header>

    <!-- Primary Sidebar (Left / Floating Komoot Style) -->
    <aside id="primary-control-sidebar" class="mobile-bottom-drawer mobile-active-sheet lg:absolute lg:top-[120px] lg:left-4 z-[2000] w-full lg:w-[380px] h-[85dvh] lg:h-auto lg:max-h-[calc(100vh-140px)] bg-white/95 dark:bg-zinc-950/95 backdrop-blur-2xl border border-zinc-200/80 dark:border-zinc-800/80 rounded-t-[2rem] lg:rounded-[2rem] shadow-2xl flex flex-col transition-all duration-400 pt-1 lg:pt-6 lg:transform-none">
        
        <div id="sidebar-drag-handle" class="w-full h-10 flex items-center justify-center shrink-0 lg:hidden cursor-grab active:cursor-grabbing rounded-t-[2rem] pt-2">
            <div class="w-14 h-1.5 bg-zinc-300 dark:bg-zinc-700 rounded-full"></div>
        </div>
        
        <div class="px-6 pb-4 shrink-0 border-b border-zinc-100 dark:border-zinc-900/60 mb-4 flex flex-col gap-4">
            <div>
                <label class="text-[10px] font-black uppercase tracking-widest text-zinc-400 dark:text-zinc-500 block mb-2">Fuel Type</label>
                <div class="relative">
                    <select id="fuelType" class="w-full appearance-none bg-zinc-100 dark:bg-zinc-900 border border-zinc-200/50 dark:border-zinc-800 rounded-2xl text-[13px] font-black px-4 py-3.5 pr-10 text-zinc-900 dark:text-white focus:ring-2 focus:ring-emerald-500 outline-none transition-all cursor-pointer shadow-inner">
                        <option value="E10">Petrol Unleaded (E10)</option>
                        <option value="E5">Super Unleaded (E5)</option>
                        <option value="B7">Diesel (B7)</option>
                        <option value="PremiumDiesel">Premium Diesel</option>
                        <option value="electric">EV Chargers ⚡</option>
                    </select>
                    <input type="hidden" id="filterUnleaded" value="false" />
                    <div class="absolute inset-y-0 right-0 flex items-center px-4 pointer-events-none text-zinc-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/></svg>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 bg-zinc-100/80 dark:bg-zinc-900/80 p-1.5 rounded-2xl gap-1">
                <button onclick="switchWorkflowTabContext('local')" id="tab-btn-local" class="py-2.5 rounded-xl text-xs font-black transition cursor-pointer flex items-center justify-center bg-white dark:bg-zinc-800 text-zinc-900 dark:text-white shadow-sm focus:outline-none">Search Area</button>
                <button onclick="switchWorkflowTabContext('route')" id="tab-btn-route" class="py-2.5 rounded-xl text-xs font-bold transition cursor-pointer flex items-center justify-center text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-white focus:outline-none">Plan Route</button>
            </div>
            
            <input type="hidden" id="fuel-type" value="E10" /> 
        </div>

        <div class="flex-1 overflow-y-auto px-6 pb-6 space-y-6 custom-scrollbar relative">
            <div id="panel-tab-local" class="space-y-6 block">
                <div class="space-y-3 relative">
                    <label class="text-[10px] font-black tracking-widest text-zinc-500 dark:text-zinc-400 uppercase">Search Anchor</label>
                    <div class="flex gap-2">
                        <div class="relative flex-1">
                            <input id="location-input" type="text" placeholder="City, town..." class="w-full bg-zinc-50 dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-2xl pl-4 pr-10 py-3.5 text-[13px] text-zinc-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-emerald-600 placeholder-zinc-400 font-bold shadow-sm" />
                            <button onclick="triggerManualDeviceLocationSearch(event)" class="absolute right-3 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-emerald-600 transition active:scale-90 flex items-center justify-center p-1 focus:outline-none" title="Use current location">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" /></svg>
                            </button>
                        </div>
                        <button onclick="executeAddressGeocodeLookup()" class="bg-zinc-900 dark:bg-white text-white dark:text-zinc-900 text-xs font-black px-5 rounded-2xl transition cursor-pointer active:scale-95 shadow-lg focus:outline-none">Go</button>
                    </div>
                    <div id="location-suggestions" class="absolute left-0 right-0 top-full mt-2 bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-2xl shadow-2xl hidden max-h-48 overflow-y-auto z-[2500] p-1.5 text-xs font-semibold"></div>
                </div>
                
                <div class="space-y-3 bg-zinc-50/50 dark:bg-zinc-900/40 p-4 rounded-[1.5rem] border border-zinc-200/60 dark:border-zinc-800/60">
                    <div class="flex justify-between items-center text-[10px] font-black tracking-widest text-zinc-500 uppercase">
                        <span>Search Radius</span>
                        <span id="radius-val" class="text-emerald-600 dark:text-emerald-400 font-black tabular-nums">5 Miles</span>
                    </div>
                    <input id="radius-slider" type="range" min="1" max="30" value="5" class="w-full h-2 bg-zinc-200 dark:bg-zinc-800 rounded-full appearance-none cursor-pointer accent-emerald-600 my-2 focus:outline-none" />
                </div>
            </div>

            <div id="panel-tab-route" class="space-y-6 hidden">
                <div class="relative flex flex-col gap-4 pl-3 pr-1 ml-2">
                    <div class="absolute left-[17px] top-[24px] bottom-[24px] w-px border-l-2 border-dashed border-zinc-300 dark:border-zinc-700"></div>

                    <button onclick="swapRouteEndpoints(event)" class="absolute -left-[5px] top-[30px] z-50 w-7 h-7 rounded-full bg-white dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 text-zinc-600 dark:text-zinc-300 hover:text-zinc-900 hover:scale-110 active:scale-90 transition-all shadow-md flex items-center justify-center cursor-pointer focus:outline-none">
                        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/></svg>
                    </button>

                    <div class="relative flex items-center w-full gap-4">
                        <div class="w-6 flex justify-center z-10 shrink-0"><div class="w-4 h-4 rounded-full bg-emerald-500 shadow-sm outline outline-4 outline-white dark:outline-zinc-950"></div></div>
                        <div class="space-y-1.5 relative flex-1">
                            <label class="text-[10px] font-black tracking-widest text-zinc-500 uppercase block">Start Location</label>
                            <input id="route-start" type="text" placeholder="Origin point..." class="w-full bg-zinc-50 dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-2xl px-4 py-3 text-[13px] font-bold focus:outline-none focus:ring-2 focus:ring-emerald-600 shadow-inner" />
                            <div id="start-suggestions" class="absolute left-0 right-0 top-full mt-2 bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-2xl shadow-2xl hidden max-h-32 overflow-y-auto z-[2500] p-1.5 text-xs font-semibold"></div>
                        </div>
                    </div>

                    <div class="relative flex flex-col w-full pl-10">
                        <div class="flex justify-between items-center mb-2">
                            <label class="text-[10px] font-black tracking-widest text-zinc-500 uppercase">Stops</label>
                            <button onclick="addWaypointFieldInputRow()" class="text-[10px] font-black text-emerald-600 hover:text-emerald-500 cursor-pointer focus:outline-none">+ Add Stop</button>
                        </div>
                        <div id="dynamic-waypoints-container" class="space-y-3"></div>
                    </div>

                    <div class="relative flex items-center w-full gap-4">
                        <div class="w-6 flex justify-center z-10 shrink-0"><div class="w-4 h-4 rounded-full bg-rose-500 shadow-sm outline outline-4 outline-white dark:outline-zinc-950"></div></div>
                        <div class="space-y-1.5 relative flex-1">
                            <label class="text-[10px] font-black tracking-widest text-zinc-500 uppercase block">End Location</label>
                            <input id="route-end" type="text" placeholder="Destination point..." class="w-full bg-zinc-50 dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-2xl px-4 py-3 text-[13px] font-bold focus:outline-none focus:ring-2 focus:ring-emerald-600 shadow-inner" />
                            <div id="end-suggestions" class="absolute left-0 right-0 top-full mt-2 bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-2xl shadow-2xl hidden max-h-32 overflow-y-auto z-[2500] p-1.5 text-xs font-semibold"></div>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3 bg-zinc-50/50 dark:bg-zinc-900/40 p-4 rounded-[1.5rem] border border-zinc-200/60 dark:border-zinc-800/60">
                    <div class="space-y-2">
                        <label id="mpg-label" class="text-[10px] font-black tracking-widest text-zinc-500 uppercase block">Efficiency (MPG)</label>
                        <input id="vehicle-mpg" type="number" value="45" class="w-full bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-xl px-3 py-2 text-[13px] font-black text-center focus:outline-none focus:ring-2 focus:ring-emerald-600 tabular-nums shadow-sm" />
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-black tracking-widest text-zinc-500 uppercase flex justify-between">Detour <span id="route-radius-val" class="text-emerald-600 font-black tabular-nums">2 Mi</span></label>
                        <input id="route-radius-slider" type="range" min="0.5" max="10" step="0.5" value="2" class="w-full h-2 bg-zinc-200 dark:bg-zinc-800 rounded-full appearance-none cursor-pointer accent-emerald-600 mt-3 focus:outline-none" />
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-2 pt-2">
                    <button onclick="executeRouteGenerationPipeline()" class="bg-zinc-900 dark:bg-white text-white dark:text-zinc-900 text-[13px] font-black py-3.5 rounded-2xl active:scale-95 shadow-xl col-span-1 focus:outline-none transition-transform">Route</button>
                    <button onclick="saveActiveRouteCorridor()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-[13px] font-black py-3.5 rounded-2xl active:scale-95 shadow-xl col-span-1 focus:outline-none transition-transform">Save</button>
                    <button onclick="clearRoute()" class="bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 text-zinc-700 dark:text-zinc-300 text-[13px] font-bold py-3.5 rounded-2xl active:scale-95 border border-zinc-200 dark:border-zinc-700 col-span-1 focus:outline-none transition-all">Clear</button>
                </div>
            </div>

            <div id="cheapest-ranking-block" class="hidden space-y-4 pt-4 border-t border-zinc-200/60 dark:border-zinc-800/60">
                <div class="flex items-center gap-1.5">
                    <span class="text-sm">🏆</span>
                    <h3 id="ranking-block-title" class="text-[11px] font-black tracking-widest text-zinc-500 uppercase">Optimal Nearby</h3>
                </div>
                <div id="cheapest-cards-stack" class="space-y-3 tabular-nums"></div>
            </div>
        </div>
    </aside>

    <!-- Secondary Sidebar (Right / Telemetry / Floating Komoot Style) -->
    <aside id="secondary-control-sidebar" class="mobile-bottom-drawer md:absolute md:top-[120px] md:right-4 z-[1900] w-full lg:w-[380px] h-[85dvh] lg:h-auto lg:max-h-[calc(100vh-140px)] bg-white/95 dark:bg-zinc-950/95 backdrop-blur-2xl border border-zinc-200/80 dark:border-zinc-800/80 rounded-t-[2rem] lg:rounded-[2rem] shadow-2xl flex flex-col transition-all duration-400 pt-1 lg:pt-6 lg:transform-none desktop-collapsed-right hidden lg:flex">
        
        <div id="right-sidebar-drag-handle" class="w-full h-10 flex items-center justify-center shrink-0 lg:hidden cursor-grab active:cursor-grabbing rounded-t-[2rem] pt-2">
            <div class="w-14 h-1.5 bg-zinc-300 dark:bg-zinc-700 rounded-full"></div>
        </div>

        <div class="flex-1 overflow-y-auto custom-scrollbar flex flex-col p-6 space-y-6">
            <div id="traffic-dashboard-wrapper" class="space-y-5 pb-4">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <span class="flex h-2.5 w-2.5 relative">
                          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                          <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                        </span>
                        <h3 class="text-[11px] font-black text-zinc-900 dark:text-white tracking-widest uppercase">Live Telemetry</h3>
                        <span id="dash-header-speed-badge" class="ml-2 px-1.5 py-0.5 rounded flex items-center justify-center text-[9px] font-black tracking-wider border uppercase transition-colors duration-300 bg-zinc-100 text-zinc-600 border-zinc-200 dark:bg-zinc-900 dark:text-zinc-400 dark:border-zinc-800 tabular-nums">-- MPH</span>
                    </div>
                    <span id="traffic-status-badge" class="px-2 py-1 rounded text-[9px] font-black tracking-wider border uppercase bg-zinc-500/10 text-zinc-500 border-zinc-500/20">WAITING</span>
                </div>

                <div class="grid grid-cols-4 gap-2 p-3 bg-zinc-50/80 dark:bg-zinc-900/80 rounded-[1.25rem] border border-zinc-200/60 dark:border-zinc-800/60 text-center shadow-inner">
                    <div>
                        <span class="block text-[8px] font-black text-zinc-500 uppercase tracking-widest mb-1">Dist.</span>
                        <span id="dash-metric-distance" class="text-[13px] font-black text-zinc-900 dark:text-white block tabular-nums">--</span>
                    </div>
                    <div>
                        <span class="block text-[8px] font-black text-zinc-500 uppercase tracking-widest mb-1">Time</span>
                        <span id="dash-metric-time" class="text-[13px] font-black text-zinc-900 dark:text-white block tabular-nums">--</span>
                    </div>
                    <div>
                        <span class="block text-[8px] font-black text-zinc-500 uppercase tracking-widest mb-1" id="energy-label">Fuel</span>
                        <span id="dash-metric-litres" class="text-[13px] font-black text-zinc-900 dark:text-white block tabular-nums">--</span>
                    </div>
                    <div>
                        <span id="telemetry-cost-label" class="block text-[8px] font-black text-emerald-600 uppercase tracking-widest mb-1">Price</span>
                        <span id="summary-cost" class="text-[13px] font-black text-emerald-600 block tabular-nums">--</span>
                    </div>
                </div>
                
                <div id="dash-metric-delay-ticker" class="w-full overflow-hidden h-8 relative bg-zinc-100 dark:bg-zinc-800/80 rounded-xl px-3 flex items-center border border-zinc-200/50 dark:border-zinc-700/50">
                    <div class="absolute inset-0 flex items-center px-3 text-[11px] font-bold text-zinc-600 dark:text-zinc-400 truncate tracking-tight">Awaiting route data...</div>
                </div>

                <div id="route-alerts-container" class="flex flex-col gap-3 pt-2 hidden"></div>
            </div>
        </div>
    </aside>

    <!-- NEW OUTSIDE WIDGET: Smart Refuel Independent Floating Container -->
    <div id="smart-refuel-floating-widget" class="fixed bottom-4 lg:bottom-8 lg:left-[420px] lg:w-[360px] w-[calc(100%-2rem)] mx-4 lg:mx-0 z-[4500] bg-white/95 dark:bg-zinc-950/95 backdrop-blur-2xl border border-zinc-200/80 dark:border-zinc-800/80 rounded-[2rem] shadow-2xl p-5 transition-transform duration-300">
        <div id="smart-refuel-wrapper" class="space-y-4">
            <div class="flex items-center justify-between select-none">
                <div class="flex items-center gap-2">
                    <span class="text-emerald-500 text-sm">✨</span>
                    <h3 class="text-[11px] font-black uppercase tracking-widest text-zinc-900 dark:text-zinc-100">Smart Refuel Planner</h3>
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label id="label-current-fuel" class="text-[9px] font-black uppercase tracking-widest text-zinc-500 block mb-1.5">Current Level</label>
                    <div class="relative">
                        <select id="refuel-current-level" onchange="calculateOptimalRefuelStrategy()" class="w-full bg-zinc-50 dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-xl px-3 py-2.5 text-[12px] font-bold text-zinc-900 dark:text-zinc-100 focus:border-emerald-500 focus:outline-none appearance-none cursor-pointer shadow-sm">
                            <option value="10">10%</option>
                            <option value="20">20%</option>
                            <option value="25" selected>25%</option>
                            <option value="30">30%</option>
                            <option value="40">40%</option>
                            <option value="50">50%</option>
                            <option value="75">75%</option>
                        </select>
                        <div class="absolute inset-y-0 right-3 flex items-center pointer-events-none text-zinc-400 text-[10px]">▼</div>
                    </div>
                </div>
                <div>
                    <label id="label-capacity" class="text-[9px] font-black uppercase tracking-widest text-zinc-500 block mb-1.5">Tank Capacity</label>
                    <div class="relative">
                        <select id="refuel-tank-size" onchange="calculateOptimalRefuelStrategy()" class="w-full bg-zinc-50 dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-xl px-3 py-2.5 text-[12px] font-bold text-zinc-900 dark:text-zinc-100 focus:border-emerald-500 focus:outline-none appearance-none cursor-pointer shadow-sm">
                            <option value="45">45 L</option>
                            <option value="55" selected>55 L</option>
                            <option value="70">70 L</option>
                        </select>
                        <div class="absolute inset-y-0 right-3 flex items-center pointer-events-none text-zinc-400 text-[10px]">▼</div>
                    </div>
                </div>
            </div>

            <div>
                <label id="label-safety-buffer" class="text-[9px] font-black uppercase tracking-widest text-zinc-500 block mb-1.5">Safety Buffer Target</label>
                <div class="relative">
                    <select id="refuel-safety-buffer" onchange="calculateOptimalRefuelStrategy()" class="w-full bg-zinc-50 dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-xl px-3 py-2.5 text-[12px] font-bold text-zinc-900 dark:text-zinc-100 focus:border-emerald-500 focus:outline-none appearance-none cursor-pointer shadow-sm">
                        <option value="10">10 Miles</option>
                        <option value="20">20 Miles</option>
                        <option value="30" selected>30 Miles</option>
                        <option value="50">50 Miles</option>
                    </select>
                    <div class="absolute inset-y-0 right-3 flex items-center pointer-events-none text-zinc-400 text-[10px]">▼</div>
                </div>
            </div>
            
            <div id="smart-refuel-savings-block" class="hidden"></div>
            <div id="refuel-timeline-output" class="pt-2"></div>
        </div>
    </div>

    <!-- Global Detail Sheet (Bottom Sheet / Floating Panel) -->
    <div id="global-detail-sheet" class="hidden mobile-bottom-drawer md:absolute bg-white/95 dark:bg-zinc-950/95 backdrop-blur-3xl border border-zinc-200/80 dark:border-zinc-800/80 shadow-2xl p-6 flex flex-col gap-5 md:w-[360px] md:top-[120px] md:bottom-auto md:left-auto md:right-4 z-[6000] md:rounded-[2rem] transition-all duration-400 pb-[calc(24px+env(safe-area-inset-bottom,16px))] md:pb-6">
        <div id="detail-sheet-drag-handle" class="w-full h-12 flex items-center justify-center shrink-0 md:hidden cursor-grab active:cursor-grabbing -mt-6 -mx-6 rounded-t-[2rem]">
            <div class="w-14 h-1.5 bg-zinc-300 dark:bg-zinc-700 rounded-full"></div>
        </div>

        <div class="flex items-start justify-between gap-4 relative">
            <div class="min-w-0 flex-1">
                <h2 id="sheet-station-name" class="text-lg font-black text-zinc-900 dark:text-white tracking-tight uppercase leading-none truncate">Station Hub</h2>
                <p id="sheet-station-brand" class="text-xs font-bold text-zinc-500 dark:text-zinc-400 mt-2 leading-normal truncate">Information Available</p>
                <div id="sheet-ev-details-container" class="hidden"></div>
            </div>
            <div class="flex items-center gap-2 shrink-0">
                <button id="sheet-star-btn" onclick="toggleCurrentStationStar(event)" class="p-2 border rounded-full shadow-sm transition cursor-pointer flex items-center justify-center w-10 h-10 active:scale-90 focus:outline-none text-zinc-400 hover:text-amber-500 border-zinc-200/80 dark:border-zinc-800/80 bg-zinc-50 dark:bg-zinc-900">☆</button>
                <button onclick="closeForecourtDetailSheet(event)" class="p-2 bg-zinc-100 dark:bg-zinc-900 hover:bg-zinc-200 border border-zinc-200/80 dark:border-zinc-800/80 rounded-full text-zinc-500 hover:text-zinc-900 active:scale-90 transition cursor-pointer flex items-center justify-center w-10 h-10 focus:outline-none">✕</button>
            </div>
        </div>

        <div id="sheet-prices-grid" class="grid grid-cols-2 gap-3 tabular-nums">
            <div id="card-wrap-e10" class="border border-zinc-200/80 dark:border-zinc-800/80 bg-zinc-50 dark:bg-zinc-900 p-3 rounded-2xl text-center transition-all duration-200 shadow-sm">
                <span class="text-[9px] font-black uppercase tracking-widest block opacity-75 text-zinc-500">Unleaded E10</span>
                <span id="sheet-price-e10" class="text-sm font-black block mt-1 text-zinc-900 dark:text-white">N/A</span>
            </div>
            <div id="card-wrap-e5" class="border border-zinc-200/80 dark:border-zinc-800/80 bg-zinc-50 dark:bg-zinc-900 p-3 rounded-2xl text-center transition-all duration-200 shadow-sm">
                <span class="text-[9px] font-black uppercase tracking-widest block opacity-75 text-zinc-500">Super E5</span>
                <span id="sheet-price-e5" class="text-sm font-black block mt-1 text-zinc-900 dark:text-white">N/A</span>
            </div>
            <div id="card-wrap-b7" class="border border-zinc-200/80 dark:border-zinc-800/80 bg-zinc-50 dark:bg-zinc-900 p-3 rounded-2xl text-center transition-all duration-200 shadow-sm">
                <span class="text-[9px] font-black uppercase tracking-widest block opacity-75 text-zinc-500">Diesel B7</span>
                <span id="sheet-price-b7" class="text-sm font-black block mt-1 text-zinc-900 dark:text-white">N/A</span>
            </div>
            <div id="card-wrap-premiumdiesel" class="border border-zinc-200/80 dark:border-zinc-800/80 bg-zinc-50 dark:bg-zinc-900 p-3 rounded-2xl text-center transition-all duration-200 shadow-sm">
                <span class="text-[9px] font-black uppercase tracking-widest block opacity-75 text-zinc-500">Prem. Diesel</span>
                <span id="sheet-price-premiumdiesel" class="text-sm font-black block mt-1 text-zinc-900 dark:text-white">N/A</span>
            </div>
        </div>

        <div class="bg-zinc-100 dark:bg-zinc-900 rounded-2xl p-4 border border-zinc-200/80 dark:border-zinc-800/80 flex items-center justify-between text-xs font-bold text-zinc-600 dark:text-zinc-400 transition-colors mt-2 shadow-inner">
            <span class="flex items-center gap-2">🧭 Navigation</span>
            <button onclick="triggerExternalMappingVectorRoute(event)" class="bg-zinc-900 dark:bg-white text-white dark:text-zinc-900 px-4 py-2 rounded-xl font-black tracking-tight hover:scale-105 transition-transform active:scale-95 cursor-pointer focus:outline-none shadow-md">Open Maps ↗</button>
        </div>
    </div>

    <script src="uiapp.js" defer></script>
</body>
</html>
