<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuel Optimization Corridor & Routing Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        html, body, #root { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden; }
        #map { height: 100%; width: 100%; position: absolute; top: 0; bottom: 0; left: 0; right: 0; z-index: 1; }
        
        /* Custom UI Slider Accents */
        .custom-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #2563eb;
            cursor: pointer;
            border: 2px solid white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        /* Fix 1: Premium Marker Layout Styles & Interactive CSS Scaling Animations */
        .custom-leaflet-pin {
            background: transparent !important;
            border: none !important;
        }
        .marker-badge-pulse {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: center center;
            backface-visibility: hidden;
        }
        .marker-badge-pulse:hover {
            transform: scale(1.12) translateY(-2px);
            box-shadow: 0 12px 20px -4px rgba(0, 0, 0, 0.25);
            z-index: 99999 !important;
        }

        /* Utility Scroll Cleanups */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 font-sans overflow-hidden select-none">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Mock Station Matrix Pipeline
        const generateMockForecourts = (centerLat, centerLng, count = 25) => {
            const brands = ['ASDA', 'SAINSBURYS', 'MORRISONS', 'GULF', 'JET', 'BP', 'SHELL'];
            const labels = {
                'ASDA': ['CHESSER BYPASS', 'HALBEATH ROAD RETAIL PARK', 'MILTON LINK'],
                'SAINSBURYS': ['WESTFIELD ROAD', 'INGLIS GREEN ROAD', 'STRAITON MAINS'],
                'MORRISONS': ['WATERFRONT BROADWAY', 'ALNWICKHILL ROAD', 'FERRY ROAD'],
                'GULF': ['PRIMROSE LANE', 'CALDER ROAD', 'RESTALRIG'],
                'JET': ['BARCLAY PLACE', 'LONSDALE TERRACE', 'CORSTORPHINE'],
                'BP': ['QUEENSFERRY ROAD', 'MAYFIELD ROAD', 'SLATEFORD'],
                'SHELL': ['SALISBURY ROAD', 'SEAFIELD HIGHWAY', 'CALDER SYSTEM']
            };

            return Array.from({ length: count }, (_, i) => {
                const brand = brands[Math.floor(Math.random() * brands.length)];
                const addressList = labels[brand];
                const address = `${Math.floor(Math.random() * 45) + 1} ${addressList[Math.floor(Math.random() * addressList.length)]}`;
                
                // Safe localized clustering offsets to avoid map drifting anomalies
                const offsetLat = (Math.random() - 0.5) * 0.12;
                const offsetLng = (Math.random() - 0.5) * 0.16;
                
                const basePrice = parseFloat((148.5 + Math.random() * 15).toFixed(1));
                return {
                    id: `st-${i}-${Math.random().toString(36).substr(2, 4)}`,
                    brand,
                    address,
                    lat: centerLat + offsetLat,
                    lng: centerLng + offsetLng,
                    prices: {
                        e10: basePrice,
                        e5: parseFloat((basePrice + 18.0).toFixed(1)),
                        b7: parseFloat((basePrice + 24.0).toFixed(1))
                    }
                };
            });
        };

        function App() {
            // Application Control Modes
            const [searchMode, setSearchMode] = useState('route'); // 'local' or 'route'
            
            // Text Input Fields Coordinates Targets
            const [startInput, setStartInput] = useState('Dunfermline');
            const [destInput, setDestInput] = useState('Edinburgh');
            const [interimInput, setInterimInput] = useState('Moffat');
            const [localSearch, setLocalSearch] = useState('City of Edinburgh, Scotland');
            
            // Live Reactive Filter Configurations
            const [radius, setRadius] = useState(5);
            const [efficiency, setEfficiency] = useState(45);
            const [fuelVariant, setFuelVariant] = useState('Petrol Unleaded (E10)');
            const [traditionalPumps, setTraditionalPumps] = useState(false);

            // Active State Data Records
            const [forecourts, setForecourts] = useState([]);
            const [selectedStation, setSelectedStation] = useState(null);
            const [suggestions, setSuggestions] = useState([]);
            const [activeSuggestionField, setActiveSuggestionField] = useState(null);
            
            // Drawer & Overlay UI Visual Controls
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isPoolsOpen, setIsPoolsOpen] = useState(false);

            // Leaflet Instance Engineering References
            const mapRef = useRef(null);
            const routeGroupRef = useRef(null);
            const markerGroupRef = useRef(null);
            const activeCircleOverlayRef = useRef(null);

            // Core Layout Map Framework Construction Mount
            useEffect(() => {
                if (!mapRef.current) {
                    mapRef.current = L.map('map', { zoomControl: false }).setView([56.015, -3.40], 11);
                    
                    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                        attribution: '© OpenStreetMap contributors'
                    }).addTo(mapRef.current);

                    L.control.zoom({ position: 'bottomright' }).addTo(mapRef.current);

                    markerGroupRef.current = L.layerGroup().addTo(mapRef.current);
                    routeGroupRef.current = L.layerGroup().addTo(mapRef.current);

                    // Seed initial localized telemetry positions
                    setForecourts(generateMockForecourts(55.9533, -3.1883, 22));
                }
            }, []);

            // Fix 1: Accurate Multi-Level Marker Anchor Point Management Pipeline
            useEffect(() => {
                if (markerGroupRef.current && mapRef.current) {
                    markerGroupRef.current.clearLayers();

                    forecourts.forEach(station => {
                        const price = station.prices.e10;
                        let colorVariantClass = 'bg-blue-600'; 
                        if (price < 153) colorVariantClass = 'bg-emerald-500';
                        if (price > 161) colorVariantClass = 'bg-red-500';

                        const generatedHtmlContent = `
                            <div class="marker-badge-pulse ${colorVariantClass} text-white text-[11px] font-black px-2.5 py-1 rounded-xl shadow-lg border-2 border-white flex items-center justify-center gap-1 cursor-pointer">
                                <span class="w-1 h-1 rounded-full bg-white/90"></span>
                                ${price}p
                            </div>
                        `;

                        // iconSize paired with iconAnchor centers the marker directly over coordinates
                        const premiumIconInstance = L.divIcon({
                            className: 'custom-leaflet-pin',
                            html: generatedHtmlContent,
                            iconSize: [56, 24],
                            iconAnchor: [28, 12]
                        });

                        const leafletMarkerObject = L.marker([station.lat, station.lng], { icon: premiumIconInstance });
                        leafletMarkerObject.on('click', () => setSelectedStation(station));
                        markerGroupRef.current.addLayer(leafletMarkerObject);
                    });
                }
            }, [forecourts]);

            // Fix 4: Continuous Tracking Mapping for Radius Circle Elements
            useEffect(() => {
                if (searchMode === 'local' && mapRef.current) {
                    if (activeCircleOverlayRef.current) {
                        mapRef.current.removeLayer(activeCircleOverlayRef.current);
                    }
                    const visibleCenterCoord = mapRef.current.getCenter();
                    activeCircleOverlayRef.current = L.circle(visibleCenterCoord, {
                        radius: radius * 1609.34, // Miles metric mapping converter
                        color: '#2563eb',
                        fillColor: '#3b82f6',
                        fillOpacity: 0.07,
                        weight: 2,
                        dashArray: '6, 8'
                    }).addTo(mapRef.current);
                } else {
                    if (activeCircleOverlayRef.current && mapRef.current) {
                        mapRef.current.removeLayer(activeCircleOverlayRef.current);
                        activeCircleOverlayRef.current = null;
                    }
                }
            }, [radius, searchMode]);

            // Real-Time Asynchronous Location Geocoding Engine
            const executeGeocodeLookup = async (textVal, fieldIdentifier) => {
                if (fieldIdentifier === 'start') setStartInput(textVal);
                if (fieldIdentifier === 'dest') setDestInput(textVal);
                if (fieldIdentifier === 'interim') setInterimInput(textVal);
                if (fieldIdentifier === 'local') setLocalSearch(textVal);

                if (textVal.trim().length < 3) {
                    setSuggestions([]);
                    return;
                }

                setActiveSuggestionField(fieldIdentifier);
                try {
                    const queryUrl = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(textVal)}&countrycodes=gb&limit=5`;
                    const networkResponse = await fetch(queryUrl, { headers: { 'Accept-Language': 'en' } });
                    const returnedDataset = await networkResponse.json();
                    setSuggestions(returnedDataset);
                } catch (err) {
                    console.error("Geocoding network processing fault:", err);
                }
            };

            const confirmSuggestionAssignment = (selectedItem, fieldIdentifier) => {
                const cleanedTitleString = selectedItem.display_name.split(',')[0] + ', ' + (selectedItem.display_name.split(',')[1] || '').trim();
                
                if (fieldIdentifier === 'start') setStartInput(cleanedTitleString);
                if (fieldIdentifier === 'dest') setDestInput(cleanedTitleString);
                if (fieldIdentifier === 'interim') setInterimInput(cleanedTitleString);
                if (fieldIdentifier === 'local') {
                    setLocalSearch(cleanedTitleString);
                    const latitudeVal = parseFloat(selectedItem.lat);
                    const longitudeVal = parseFloat(selectedItem.lon);
                    mapRef.current.setView([latitudeVal, longitudeVal], 12);
                    setForecourts(generateMockForecourts(latitudeVal, longitudeVal, 26));
                }

                setSuggestions([]);
                setActiveSuggestionField(null);
            };

            // Device Location Acquisition Protocol
            const acquireHardwareCoordinates = () => {
                if (!navigator.geolocation) {
                    alert("Hardware tracking environment missing geolocation query permissions.");
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const { latitude, longitude } = position.coords;
                        mapRef.current.setView([latitude, longitude], 13);
                        setLocalSearch("Device Telemetry Centerpoint");
                        setForecourts(generateMockForecourts(latitude, longitude, 20));
                    },
                    () => {
                        alert("Device sensor coordinate fetch dropped. Utilizing fallback region vector frameworks.");
                        mapRef.current.setView([55.9533, -3.1883], 12);
                    }
                );
            };

            // Premium OSRM Road-Network Snapped Mapping Integration Routing Engine
            const computeNetworkRoadCorridor = async () => {
                if (!startInput || !destInput) {
                    alert("Please establish clear baseline start and final point values.");
                    return;
                }

                routeGroupRef.current.clearLayers();

                try {
                    const locationsMatrix = [startInput, interimInput, destInput].filter(str => str && str.trim() !== '');
                    const arrayCoordinatesStrings = [];

                    for (let address of locationsMatrix) {
                        const parsingUrl = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}&countrycodes=gb&limit=1`;
                        const res = await fetch(parsingUrl);
                        const dataset = await res.json();
                        if (dataset && dataset.length > 0) {
                            arrayCoordinatesStrings.push(`${dataset[0].lon},${dataset[0].lat}`);
                        }
                    }

                    if (arrayCoordinatesStrings.length < 2) return;

                    const osrmRequestUrl = `https://router.project-osrm.org/route/v1/driving/${arrayCoordinatesStrings.join(';')}?overview=full&geometries=geojson`;
                    const responseStream = await fetch(osrmRequestUrl);
                    const routeResultPayload = await responseStream.json();

                    if (routeResultPayload.routes && routeResultPayload.routes.length > 0) {
                        const spatialGeometryLine = routeResultPayload.routes[0].geometry;
                        const formattedLeafletLatLngs = spatialGeometryLine.coordinates.map(node => [node[1], node[0]]);

                        const interactiveRouteLine = L.polyline(formattedLeafletLatLngs, {
                            color: '#2563eb',
                            weight: 5,
                            opacity: 0.9,
                            lineCap: 'round',
                            lineJoin: 'round'
                        });

                        interactiveRouteLine.addTo(routeGroupRef.current);
                        mapRef.current.fitBounds(interactiveRouteLine.getBounds(), { padding: [45, 45] });

                        // Distribute pricing indicators strictly inside computed corridor zone
                        const medianPathNode = formattedLeafletLatLngs[Math.floor(formattedLeafletLatLngs.length / 2)];
                        setForecourts(generateMockForecourts(medianPathNode[0], medianPathNode[1], 32));
                    }
                } catch (error) {
                    console.error("OSRM pipeline corridor engine mapping error:", error);
                }
            };

            const clearActiveRoutingLayers = () => {
                setStartInput('');
                setDestInput('');
                setInterimInput('');
                routeGroupRef.current.clearLayers();
            };

            // Spatial Map Viewport Scan Engine
            const scanMapBoundingViewport = () => {
                if (!mapRef.current) return;
                const dynamicViewCenter = mapRef.current.getCenter();
                const totalMarkersCount = Math.floor(18 + Math.random() * 15);
                setForecourts(generateMockForecourts(dynamicViewCenter.lat, dynamicViewCenter.lng, totalMarkersCount));
            };

            const calculatedOptimalListings = [...forecourts]
                .sort((x, y) => x.prices.e10 - y.prices.e10)
                .slice(0, 3);

            return (
                <div className="relative w-full h-full flex overflow-hidden">
                    
                    {/* Primary Spatial Leaflet Layer Anchor */}
                    <div id="map"></div>

                    {/* Fix 3: Top Right Main Navigation Menu Bar */}
                    <div className="absolute top-4 right-4 bg-white/95 backdrop-blur-md rounded-2xl shadow-xl z-[1000] border border-slate-200/60 flex items-center p-1 gap-1.5 pointer-events-auto">
                        <button className="p-2.5 rounded-xl hover:bg-slate-100 font-bold text-xs text-slate-700 transition" title="Dashboard Home">🏠</button>
                        <button className="p-2.5 rounded-xl hover:bg-slate-100 font-bold text-xs text-slate-700 transition" title="Saved Route Bookmarks">⭐</button>
                        <button className="p-2.5 rounded-xl hover:bg-slate-100 font-bold text-xs text-slate-700 transition" title="Global System Infrastructure Analytics">📊</button>
                        <div className="w-px h-5 bg-slate-200 my-1 mx-0.5"></div>
                        <button className="p-2.5 rounded-xl hover:bg-slate-100 font-bold text-xs text-slate-700 transition" title="System Infrastructure Parameters Config">⚙️</button>
                    </div>

                    {/* Legacy Sidebar Control Dashboard Block Layout */}
                    <div className="absolute top-4 left-4 bottom-4 w-[380px] bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl z-[1000] flex flex-col overflow-hidden border border-slate-200/50 pointer-events-auto">
                        <div className="p-5 flex flex-col gap-4 overflow-y-auto no-scrollbar flex-1">
                            
                            {/* Dashboard Heading Context Banner */}
                            <div>
                                <h1 className="text-xl font-extrabold text-slate-900 tracking-tight">Search Fuel Price</h1>
                                <p className="text-[11px] text-emerald-600 font-bold mt-0.5 flex items-center gap-1">
                                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                                    SYSTEM TELEMETRY LIVE • 2026 Core Engine
                                </p>
                            </div>

                            {/* Core Search Scope Toggle Widgets */}
                            <div className="flex bg-slate-100 p-1 rounded-xl border border-slate-200/40">
                                <button 
                                    onClick={() => setSearchMode('local')} 
                                    className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${searchMode === 'local' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-400 hover:text-slate-700'}`}
                                >
                                    📍 Local Area Map
                                </button>
                                <button 
                                    onClick={() => setSearchMode('route')} 
                                    className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${searchMode === 'route' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-400 hover:text-slate-700'}`}
                                >
                                    🏎️ Route Corridor
                                </button>
                            </div>

                            {/* Local Area Context Layout UI Panels */}
                            {searchMode === 'local' && (
                                <div className="flex flex-col gap-3.5 animate-in fade-in duration-200">
                                    <div className="relative">
                                        <label className="text-[10px] font-bold tracking-wider uppercase text-slate-400 block mb-1">Search Center Location</label>
                                        <div className="relative flex items-center">
                                            <input 
                                                type="text" 
                                                value={localSearch} 
                                                onChange={(e) => executeGeocodeLookup(e.target.value, 'local')} 
                                                className="w-full text-xs font-semibold border border-slate-200 rounded-xl pl-3.5 pr-10 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500/20 text-slate-800" 
                                                placeholder="e.g. Edinburgh, Scotland" 
                                            />
                                            <button 
                                                onClick={acquireHardwareCoordinates} 
                                                className="absolute right-2.5 p-1.5 rounded-lg hover:bg-slate-100 text-slate-500 transition active:scale-95" 
                                                title="Fetch current device location coordinates"
                                            >
                                                🎯
                                            </button>
                                        </div>

                                        {activeSuggestionField === 'local' && suggestions.length > 0 && (
                                            <div className="absolute w-full bg-white border border-slate-200 mt-1 rounded-xl shadow-2xl z-[5000] max-h-48 overflow-y-auto">
                                                {suggestions.map((s, idx) => (
                                                    <div key={idx} onClick={() => confirmSuggestionAssignment(s, 'local')} className="p-2.5 text-xs font-medium hover:bg-slate-50 cursor-pointer border-b last:border-0 border-slate-100 text-slate-700">{s.display_name}</div>
                                                ))}
                                            </div>
                                        )}
                                    </div>

                                    <div>
                                        <div className="flex justify-between text-[10px] font-bold tracking-wider uppercase text-slate-400 mb-1">
                                            <span>Scan Window Radius</span>
                                            <span className="text-blue-600 bg-blue-50 px-2 py-0.5 rounded-md font-bold normal-case text-xs">{radius} Miles Context</span>
                                        </div>
                                        <input 
                                            type="range" 
                                            min="1" 
                                            max="25" 
                                            value={radius} 
                                            onChange={(e) => setRadius(parseInt(e.target.value))} 
                                            className="w-full h-1.5 bg-slate-100 rounded-lg appearance-none cursor-pointer custom-slider border border-slate-200/40" 
                                        />
                                    </div>
                                </div>
                            )}

                            {/* Route Corridor Input Configurations Form Sheets */}
                            {searchMode === 'route' && (
                                <div className="flex flex-col gap-3 animate-in fade-in duration-200">
                                    <div className="relative">
                                        <label className="text-[10px] font-bold tracking-wider uppercase text-slate-400 block mb-1">🟢 Starting Location</label>
                                        <input 
                                            type="text" 
                                            value={startInput} 
                                            onChange={(e) => executeGeocodeLookup(e.target.value, 'start')} 
                                            className="w-full text-xs font-medium border border-slate-200 rounded-xl px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500/20 text-slate-800" 
                                            placeholder="e.g. Dunfermline" 
                                        />
                                        {activeSuggestionField === 'start' && suggestions.length > 0 && (
                                            <div className="absolute w-full bg-white border border-slate-200 mt-1 rounded-xl shadow-2xl z-[5000] max-h-40 overflow-y-auto">
                                                {suggestions.map((s, idx) => (
                                                    <div key={idx} onClick={() => confirmSuggestionAssignment(s, 'start')} className="p-2.5 text-xs font-medium hover:bg-slate-50 cursor-pointer border-b last:border-0 border-slate-100 text-slate-700">{s.display_name}</div>
                                                ))}
                                            </div>
                                        )}
                                    </div>

                                    <div className="relative">
                                        <label className="text-[10px] font-bold tracking-wider uppercase text-slate-400 block mb-1">🔵 Add Interim Stop (Optional)</label>
                                        <input 
                                            type="text" 
                                            value={interimInput} 
                                            onChange={(e) => executeGeocodeLookup(e.target.value, 'interim')} 
                                            className="w-full text-xs font-medium border border-slate-200 rounded-xl px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500/20 text-slate-800" 
                                            placeholder="e.g. Moffat" 
                                        />
                                        {activeSuggestionField === 'interim' && suggestions.length > 0 && (
                                            <div className="absolute w-full bg-white border border-slate-200 mt-1 rounded-xl shadow-2xl z-[5000] max-h-40 overflow-y-auto">
                                                {suggestions.map((s, idx) => (
                                                    <div key={idx} onClick={() => confirmSuggestionAssignment(s, 'interim')} className="p-2.5 text-xs font-medium hover:bg-slate-50 cursor-pointer border-b last:border-0 border-slate-100 text-slate-700">{s.display_name}</div>
                                                ))}
                                            </div>
                                        )}
                                    </div>

                                    <div className="relative">
                                        <label className="text-[10px] font-bold tracking-wider uppercase text-slate-400 block mb-1">🔴 Destination</label>
                                        <input 
                                            type="text" 
                                            value={destInput} 
                                            onChange={(e) => executeGeocodeLookup(e.target.value, 'dest')} 
                                            className="w-full text-xs font-medium border border-slate-200 rounded-xl px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500/20 text-slate-800" 
                                            placeholder="e.g. Edinburgh" 
                                        />
                                        {activeSuggestionField === 'dest' && suggestions.length > 0 && (
                                            <div className="absolute w-full bg-white border border-slate-200 mt-1 rounded-xl shadow-2xl z-[5000] max-h-40 overflow-y-auto">
                                                {suggestions.map((s, idx) => (
                                                    <div key={idx} onClick={() => confirmSuggestionAssignment(s, 'dest')} className="p-2.5 text-xs font-medium hover:bg-slate-50 cursor-pointer border-b last:border-0 border-slate-100 text-slate-700">{s.display_name}</div>
                                                ))}
                                            </div>
                                        )}
                                    </div>

                                    <div className="grid grid-cols-2 gap-2 mt-1">
                                        <button onClick={computeNetworkRoadCorridor} className="bg-slate-900 text-white text-xs font-bold py-3 px-4 rounded-xl hover:bg-slate-800 transition active:scale-[0.98] shadow-md flex items-center justify-center gap-1">
                                            🚀 Search Route
                                        </button>
                                        <button onClick={clearActiveRoutingLayers} className="bg-slate-100 text-slate-600 text-xs font-bold py-3 px-4 rounded-xl hover:bg-slate-200 transition active:scale-[0.98]">
                                            Clear Path
                                        </button>
                                    </div>
                                </div>
                            )}

                            <hr className="border-slate-100" />

                            {/* Additional Secondary Settings Parameters panel row elements */}
                            <div className="flex flex-col gap-3">
                                <div>
                                    <label className="text-[10px] font-bold tracking-wider uppercase text-slate-400 block mb-1">Vehicle Fuel Consumption (MPG)</label>
                                    <input 
                                        type="number" 
                                        value={efficiency} 
                                        onChange={(e) => setEfficiency(e.target.value)} 
                                        className="w-full text-xs font-semibold border border-slate-200 rounded-xl px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500/20 text-slate-800" 
                                    />
                                </div>

                                <div>
                                    <label className="text-[10px] font-bold tracking-wider uppercase text-slate-400 block mb-1">Fuel Core Variant Formulation</label>
                                    <select 
                                        value={fuelVariant} 
                                        onChange={(e) => setFuelVariant(e.target.value)} 
                                        className="w-full text-xs font-bold border border-slate-200 rounded-xl px-3 py-2.5 bg-white text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500/20"
                                    >
                                        <option>Petrol Unleaded (E10)</option>
                                        <option>Super Unleaded (E5)</option>
                                        <option>Diesel (B7)</option>
                                    </select>
                                </div>

                                <div className="flex items-center gap-2 mt-1 p-0.5">
                                    <input 
                                        id="filter-mech-only" 
                                        type="checkbox" 
                                        checked={traditionalPumps} 
                                        onChange={(e) => setTraditionalPumps(e.target.checked)}
                                        className="w-4 h-4 text-blue-600 border-slate-300 rounded focus:ring-blue-500 cursor-pointer" 
                                    />
                                    <label htmlFor="filter-mech-only" className="text-xs font-semibold text-slate-600 cursor-pointer select-none">Traditional Mechanical Pumps Only</label>
                                </div>
                            </div>

                            {/* Fix 5: Conditional Visibility Logic for Financial Overview Card Block */}
                            {searchMode === 'route' && (
                                <div className="bg-emerald-50/60 border border-emerald-100 rounded-2xl p-4 flex flex-col gap-2 mt-1 animate-in fade-in duration-200">
                                    <div className="flex justify-between items-center">
                                        <span className="text-[10px] font-bold tracking-wider uppercase text-slate-400 flex items-center gap-1">
                                            📊 Financial Calculations Summary
                                        </span>
                                    </div>
                                    <div className="text-xs font-semibold text-slate-600 flex justify-between">
                                        <span>Total Track: <strong className="text-slate-900">18.5 miles</strong></span>
                                        <span>Optimal Expenses: <strong className="text-emerald-600">£2.86</strong></span>
                                    </div>
                                    <button 
                                        onClick={() => setIsModalOpen(true)} 
                                        className="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-2.5 px-4 rounded-xl transition flex items-center justify-between shadow-sm active:scale-[0.98] mt-1"
                                    >
                                        <span>📋 View Pricing Info</span>
                                        <span className="bg-emerald-500 text-[10px] px-2 py-0.5 rounded-full border border-white/20">£ Live</span>
                                    </button>
                                </div>
                            )}

                            {/* Highest Rank Options Sidebar Lists Mapping Block */}
                            {calculatedOptimalListings.length > 0 && (
                                <div className="flex flex-col gap-2 mt-1">
                                    <span className="text-[10px] font-bold tracking-wider uppercase text-slate-400 block">🏆 Cheapest Selection Choices</span>
                                    {calculatedOptimalListings.map((station, index) => (
                                        <div key={station.id} onClick={() => { mapRef.current.setView([station.lat, station.lng], 14); setSelectedStation(station); }} className="bg-white border border-slate-100 p-3 rounded-xl flex justify-between items-center hover:border-blue-300 hover:shadow-sm cursor-pointer transition active:scale-[0.99]">
                                            <div className="flex items-center gap-2.5">
                                                <span className="text-xs font-bold text-amber-500 bg-amber-50 w-6 h-6 rounded-lg flex items-center justify-center border border-amber-100">#{index + 1}</span>
                                                <div>
                                                    <h4 className="text-xs font-extrabold text-slate-800">{station.brand}</h4>
                                                    <p className="text-[9px] text-slate-400 font-bold tracking-wider uppercase truncate max-w-[180px]">{station.address}</p>
                                                </div>
                                            </div>
                                            <span className="text-xs font-black text-emerald-600 bg-emerald-50 px-2 py-1 rounded-lg border border-emerald-100">{station.prices.e10}p</span>
                                        </div>
                                    ))}
                                </div>
                            )}

                        </div>

                        {/* Slide-Over Pools Configuration Trigger Footer Module Bar */}
                        <div className="p-3 bg-slate-50 border-t border-slate-100 flex items-center justify-between text-xs font-bold text-slate-600">
                            <button onClick={() => setIsPoolsOpen(true)} className="w-full py-2.5 bg-white border border-slate-200 rounded-xl hover:bg-slate-50 transition active:scale-95 flex items-center justify-between px-4 text-slate-700 shadow-sm">
                                <span>🗄️ Fetch Remote Pool</span>
                                <span className="bg-slate-100 text-slate-500 font-bold px-2 py-0.5 rounded-md text-[10px]">Rows Mapped: {forecourts.length}</span>
                            </button>
                        </div>
                    </div>

                    {/* Viewport Boundary Area Scanning Trigger Control Module Widget */}
                    <div className="absolute bottom-6 left-1/2 -translate-x-1/2 z-[1000] pointer-events-auto">
                        <button 
                            onClick={scanMapBoundingViewport} 
                            className="bg-slate-900 text-white border border-slate-800 px-6 py-3 rounded-full text-xs font-bold shadow-2xl hover:bg-slate-800 tracking-wider uppercase flex items-center gap-2 transition active:scale-95 whitespace-nowrap"
                        >
                            🔍 Scan This Viewport Area
                        </button>
                    </div>

                    {/* Floating Detailed Station Meta Parameter Data Frame Card Overlays */}
                    {selectedStation && (
                        <div className="absolute bottom-6 right-16 z-[1000] bg-white rounded-3xl shadow-2xl p-5 w-80 border border-slate-200/60 flex flex-col gap-3.5 animate-in slide-in-from-bottom-6 duration-300 pointer-events-auto">
                            <div className="flex justify-between items-start">
                                <div>
                                    <h3 className="text-base font-black text-slate-900 tracking-tight">{selectedStation.brand}</h3>
                                    <p className="text-[10px] text-slate-400 font-bold uppercase tracking-wider mt-0.5">{selectedStation.address}</p>
                                </div>
                                <button onClick={() => setSelectedStation(null)} className="text-slate-400 hover:text-slate-600 text-xs p-1.5 rounded-xl hover:bg-slate-100 transition font-black">✕</button>
                            </div>
                            <div className="grid grid-cols-3 gap-2">
                                <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-100 text-center">
                                    <p className="text-[9px] font-bold text-slate-400 uppercase tracking-wider">Unleaded E10</p>
                                    <p className="text-xs font-black text-slate-800 mt-0.5">{selectedStation.prices.e10}p</p>
                                </div>
                                <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-100 text-center">
                                    <p className="text-[9px] font-bold text-slate-400 uppercase tracking-wider">Super E5</p>
                                    <p className="text-xs font-black text-slate-800 mt-0.5">{selectedStation.prices.e5}p</p>
                                </div>
                                <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-100 text-center">
                                    <p className="text-[9px] font-bold text-slate-400 uppercase tracking-wider">Diesel B7</p>
                                    <p className="text-xs font-black text-slate-800 mt-0.5">{selectedStation.prices.b7}p</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Interactive Sliding Pools List Drawer Layer Overlay Panel components */}
                    {isPoolsOpen && (
                        <div className="absolute top-0 right-0 h-full w-80 bg-white/95 backdrop-blur-md z-[2000] border-l border-slate-200/80 shadow-2xl p-5 flex flex-col gap-4 animate-in slide-in-from-right duration-300 pointer-events-auto">
                            <div className="flex justify-between items-center">
                                <h2 className="text-sm font-bold text-slate-900 uppercase tracking-wide">Cluster Database Pool</h2>
                                <button onClick={() => setIsPoolsOpen(false)} className="text-slate-400 font-bold hover:text-slate-600 p-1">✕</button>
                            </div>
                            <p className="text-[11px] text-slate-400 font-medium leading-relaxed">Displaying total generated cluster parameters generated within current bounds scope framework context.</p>
                            <div className="flex-1 overflow-y-auto pr-1 flex flex-col gap-2 no-scrollbar">
                                {forecourts.map((station) => (
                                    <div 
                                        key={station.id} 
                                        onClick={() => { mapRef.current.setView([station.lat, station.lng], 14); setSelectedStation(station); }}
                                        className="p-3 bg-white border border-slate-100 rounded-xl hover:border-blue-500 hover:shadow-sm cursor-pointer transition active:scale-[0.98]"
                                    >
                                        <div className="flex justify-between font-bold text-xs text-slate-800">
                                            <span>{station.brand}</span>
                                            <span className="text-blue-600">{station.prices.e10}p</span>
                                        </div>
                                        <p className="text-[9px] text-slate-400 font-bold tracking-wider mt-0.5 uppercase truncate">{station.address}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Pricing Calculation High-Fidelity Details Analytics Modal Overlay Window */}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[99999] flex items-center justify-center p-4 pointer-events-auto">
                            <div className="bg-white rounded-3xl shadow-2xl max-w-sm w-full p-6 border border-slate-200/50 animate-in zoom-in-95 duration-150 flex flex-col gap-4">
                                <div className="flex justify-between items-center">
                                    <div className="flex items-center gap-2">
                                        <span className="text-base">📊</span>
                                        <h3 className="text-sm font-bold text-slate-900 uppercase tracking-wide">Financial Analysis Summary</h3>
                                    </div>
                                    <button onClick={() => setIsModalOpen(false)} className="text-slate-400 hover:text-slate-600 font-bold p-1">✕</button>
                                </div>

                                <div className="flex flex-col gap-2.5">
                                    <div className="flex justify-between items-center p-3 bg-slate-50 rounded-xl border border-slate-100">
                                        <span className="text-xs font-semibold text-slate-500">Route Scan Scope Path Range</span>
                                        <span className="text-xs font-bold text-slate-800">18.5 miles</span>
                                    </div>
                                    <div className="flex justify-between items-center p-3 bg-slate-50 rounded-xl border border-slate-100">
                                        <span className="text-xs font-semibold text-slate-500">Target Benchmark Fuel Price</span>
                                        <span className="text-xs font-bold text-emerald-600">152.7p / Liter</span>
                                    </div>
                                    <div className="flex justify-between items-center p-3 bg-emerald-50/50 rounded-xl border border-emerald-100">
                                        <span className="text-xs font-bold text-emerald-800">Projected Run Expenses Target</span>
                                        <span className="text-xs font-black text-emerald-700">£2.86 Total</span>
                                    </div>
                                </div>

                                <div className="text-[11px] text-slate-400 leading-relaxed bg-slate-50 p-3 rounded-xl border border-slate-100 font-medium">
                                    <strong>Calculations Model Parameters:</strong> Assumes a continuous consumption efficiency profile metric of <strong>{efficiency} MPG</strong> calculated dynamically against current cluster API data matrices.
                                </div>

                                <button onClick={() => setIsModalOpen(false)} className="w-full bg-slate-900 text-white py-3 rounded-xl text-xs font-bold hover:bg-slate-800 transition active:scale-95 shadow-md">
                                    Dismiss Analysis
                                </button>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
