<!DOCTYPE html>
<html lang="en\" class="h-full w-full antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>UK Fuel Price Pipeline Workspace</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        zinc: {
                            950: '#040405',
                            1000: '#000000'
                        }
                    }
                }
            }
        }
    </script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .leaflet-control-zoom {
            border: none !important;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1) !important;
        }
        .leaflet-bar a {
            background-color: white !important;
            color: #18181b !important;
            border-bottom: 1px solid #f4f4f5 !important;
            transition: all 0.2s;
        }
        .dark .leaflet-bar a {
            background-color: #09090b !important;
            color: #f4f4f5 !important;
            border-bottom: 1px solid #27272a !important;
        }
        .leaflet-bar a:hover {
            background-color: #f4f4f5 !important;
        }
        .dark .leaflet-bar a:hover {
            background-color: #18181b !important;
        }
        .custom-cluster {
            background: rgba(59, 130, 246, 0.2);
            border: 2px solid rgba(59, 130, 246, 0.6);
            border-radius: 50%;
            color: #1d4ed8;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            transition: transform 0.2s ease;
        }
        .dark .custom-cluster {
            color: #60a5fa;
            border-color: rgba(96, 165, 250, 0.6);
            background: rgba(96, 165, 250, 0.2);
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Drag and Drop animations & styling */
        .waypoint-dragging {
            opacity: 0.5;
            transform: scale(0.98);
            border-color: #3b82f6 !important;
            background-color: #eff6ff !important;
        }
        .dark .waypoint-dragging {
            background-color: #172554 !important;
            border-color: #3b82f6 !important;
        }
        .waypoint-drag-over {
            border-top: 2px solid #3b82f6 !important;
        }
    </style>
</head>
<body class="h-full w-full overflow-hidden bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-50 flex flex-col md:flex-row">

    <header class="w-full md:hidden h-14 border-b border-zinc-200 dark:border-zinc-800 bg-white/80 dark:bg-zinc-900/80 backdrop-blur-md flex items-center justify-between px-4 z-[1001] fixed top-0 left-0">
        <div class="flex items-center gap-2">
            <div class="w-2 h-2 rounded-full bg-blue-600 animate-pulse"></div>
            <span class="font-semibold text-sm tracking-tight text-zinc-900 dark:text-white">FuelPipeline</span>
        </div>
        <div class="flex items-center gap-2">
            <button id="mobile-theme-toggle" class="p-2 rounded-lg text-zinc-500 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors">
                <svg class="w-4 h-4 dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
                </svg>
                <svg class="w-4 h-4 hidden dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M16.243 17.657l.707.707M6.343 6.343l.707-.707m2.828 9.9a5 5 0 117.072 0l-7.072 7.072z"/>
                </svg>
            </button>
        </div>
    </header>

    <aside id="sidebar-panel-container" class="hidden md:flex flex-col w-96 border-r border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 h-full shadow-xl z-30 transition-all duration-300">
        <div class="p-4 border-b border-zinc-200 dark:border-zinc-800 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-3 h-3 rounded-full bg-blue-600"></div>
                <h1 class="font-bold tracking-tight text-lg">FuelPipeline Workspace</h1>
            </div>
            <button id="desktop-theme-toggle" class="p-2 rounded-lg text-zinc-500 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors">
                <svg class="w-4 h-4 dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
                </svg>
                <svg class="w-4 h-4 hidden dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M16.243 17.657l.707.707M6.343 6.343l.707-.707m2.828 9.9a5 5 0 117.072 0l-7.072 7.072z"/>
                </svg>
            </button>
        </div>

        <div class="p-2 bg-zinc-100 dark:bg-zinc-950 flex gap-1 m-4 rounded-lg border border-zinc-200/60 dark:border-zinc-800/60">
            <button id="tab-explore-mode" class="flex-1 py-1.5 px-3 text-xs font-semibold rounded-md bg-white dark:bg-zinc-900 text-blue-600 dark:text-blue-400 shadow-sm transition-all">
                Explore Area
            </button>
            <button id="tab-routing-mode" class="flex-1 py-1.5 px-3 text-xs font-medium text-zinc-500 dark:text-zinc-400 rounded-md hover:text-zinc-800 dark:hover:text-zinc-200 transition-all">
                Route Planner
            </button>
        </div>

        <div class="flex-1 overflow-y-auto px-4 pb-6 hide-scrollbar space-y-5">
            
            <div id="view-block-explore" class="space-y-4">
                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-wider text-zinc-400 dark:text-zinc-500">Location Search</label>
                    <div class="relative">
                        <input id="explore-search-input" type="text" placeholder="Search town, city or postal code..." class="w-full pl-9 pr-4 py-2 text-sm bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/40 dark:text-white transition-all">
                        <svg class="absolute left-3 top-3 w-4 h-4 text-zinc-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                        </svg>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-wider text-zinc-400 dark:text-zinc-500">Fuel Grade Configuration</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button class="fuel-pill-btn active py-2 px-3 text-xs font-semibold rounded-lg border border-blue-500 bg-blue-50 dark:bg-blue-950/40 text-blue-600 dark:text-blue-400 transition-all" data-fuel-type="E10">Petrol (E10)</button>
                        <button class="fuel-pill-btn py-2 px-3 text-xs font-medium rounded-lg border border-zinc-200 dark:border-zinc-800 hover:bg-zinc-50 dark:hover:bg-zinc-900 transition-all" data-fuel-type="B7">Diesel (B7)</button>
                        <button class="fuel-pill-btn py-2 px-3 text-xs font-medium rounded-lg border border-zinc-200 dark:border-zinc-800 hover:bg-zinc-50 dark:hover:bg-zinc-900 transition-all" data-fuel-type="E5">Premium Petrol (E5)</button>
                        <button class="fuel-pill-btn py-2 px-3 text-xs font-medium rounded-lg border border-zinc-200 dark:border-zinc-800 hover:bg-zinc-50 dark:hover:bg-zinc-900 transition-all" data-fuel-type="SDV">Premium Diesel</button>
                    </div>
                </div>

                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <label class="text-xs font-bold uppercase tracking-wider text-zinc-400 dark:text-zinc-500">Search Radius Buffer</label>
                        <span id="label-radius-val" class="text-xs font-semibold text-zinc-600 dark:text-zinc-300 bg-zinc-100 dark:bg-zinc-800 px-2 py-0.5 rounded">5 miles</span>
                    </div>
                    <input id="slider-search-radius" type="range" min="2" max="25" value="5" class="w-full accent-blue-600 h-1.5 bg-zinc-200 dark:bg-zinc-800 rounded-lg appearance-none cursor-pointer">
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-wider text-zinc-400 dark:text-zinc-500">Brand Networks</label>
                    <div class="border border-zinc-200 dark:border-zinc-800 rounded-lg p-2 max-h-36 overflow-y-auto hide-scrollbar space-y-1.5 bg-zinc-50 dark:bg-zinc-950">
                        <label class="flex items-center gap-2.5 px-2 py-1 hover:bg-zinc-100 dark:hover:bg-zinc-900 rounded cursor-pointer text-xs transition-colors"><input type="checkbox" checked class="rounded accent-blue-600 tracking-brand" value="ALL"> <span class="font-semibold text-zinc-700 dark:text-zinc-300">All Networks</span></label>
                        <label class="flex items-center gap-2.5 px-2 py-1 hover:bg-zinc-100 dark:hover:bg-zinc-900 rounded cursor-pointer text-xs transition-colors"><input type="checkbox" checked class="rounded accent-blue-600 tracking-brand" value="BP"> <span class="text-zinc-600 dark:text-zinc-400">BP</span></label>
                        <label class="flex items-center gap-2.5 px-2 py-1 hover:bg-zinc-100 dark:hover:bg-zinc-900 rounded cursor-pointer text-xs transition-colors"><input type="checkbox" checked class="rounded accent-blue-600 tracking-brand" value="SHELL"> <span class="text-zinc-600 dark:text-zinc-400">Shell</span></label>
                        <label class="flex items-center gap-2.5 px-2 py-1 hover:bg-zinc-100 dark:hover:bg-zinc-900 rounded cursor-pointer text-xs transition-colors"><input type="checkbox" checked class="rounded accent-blue-600 tracking-brand" value="TESCO"> <span class="text-zinc-600 dark:text-zinc-400">Tesco</span></label>
                        <label class="flex items-center gap-2.5 px-2 py-1 hover:bg-zinc-100 dark:hover:bg-zinc-900 rounded cursor-pointer text-xs transition-colors"><input type="checkbox" checked class="rounded accent-blue-600 tracking-brand" value="ASDA"> <span class="text-zinc-600 dark:text-zinc-400">Asda</span></label>
                        <label class="flex items-center gap-2.5 px-2 py-1 hover:bg-zinc-100 dark:hover:bg-zinc-900 rounded cursor-pointer text-xs transition-colors"><input type="checkbox" checked class="rounded accent-blue-600 tracking-brand" value="SAINSBURYS"> <span class="text-zinc-600 dark:text-zinc-400">Sainsbury's</span></label>
                        <label class="flex items-center gap-2.5 px-2 py-1 hover:bg-zinc-100 dark:hover:bg-zinc-900 rounded cursor-pointer text-xs transition-colors"><input type="checkbox" checked class="rounded accent-blue-600 tracking-brand" value="ESSO"> <span class="text-zinc-600 dark:text-zinc-400">Esso</span></label>
                        <label class="flex items-center gap-2.5 px-2 py-1 hover:bg-zinc-100 dark:hover:bg-zinc-900 rounded cursor-pointer text-xs transition-colors"><input type="checkbox" checked class="rounded accent-blue-600 tracking-brand" value="TEXACO"> <span class="text-zinc-600 dark:text-zinc-400">Texaco</span></label>
                        <label class="flex items-center gap-2.5 px-2 py-1 hover:bg-zinc-100 dark:hover:bg-zinc-900 rounded cursor-pointer text-xs transition-colors"><input type="checkbox" checked class="rounded accent-blue-600 tracking-brand" value="MORRISONS"> <span class="text-zinc-600 dark:text-zinc-400">Morrisons</span></label>
                        <label class="flex items-center gap-2.5 px-2 py-1 hover:bg-zinc-100 dark:hover:bg-zinc-900 rounded cursor-pointer text-xs transition-colors"><input type="checkbox" checked class="rounded accent-blue-600 tracking-brand" value="JET"> <span class="text-zinc-600 dark:text-zinc-400">Jet</span></label>
                        <label class="flex items-center gap-2.5 px-2 py-1 hover:bg-zinc-100 dark:hover:bg-zinc-900 rounded cursor-pointer text-xs transition-colors"><input type="checkbox" checked class="rounded accent-blue-600 tracking-brand" value="INDEPENDENT"> <span class="text-zinc-600 dark:text-zinc-400">Independents</span></label>
                    </div>
                </div>
            </div>

            <div id="view-block-routing" class="hidden space-y-4">
                <div class="space-y-3">
                    <div class="space-y-1">
                        <label class="text-xs font-bold uppercase tracking-wider text-emerald-500 flex items-center gap-1.5">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Route Origin Start
                        </label>
                        <input id="route-start-input" type="text" placeholder="Enter starting address/city..." class="w-full px-3 py-2 text-sm bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/40 dark:text-white transition-all">
                    </div>

                    <div class="space-y-1.5">
                        <label class="text-xs font-bold uppercase tracking-wider text-amber-500 flex items-center gap-1.5">
                            <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span> Interim Stop Waypoints
                        </label>
                        <div id="interim-stops-container" class="space-y-2 min-h-[5px]">
                            </div>
                        <button id="btn-append-interim-node" type="button" class="w-full py-1.5 px-3 border border-dashed border-zinc-300 dark:border-zinc-700 hover:border-zinc-400 dark:hover:border-zinc-500 rounded-lg text-xs font-medium text-zinc-500 dark:text-zinc-400 hover:text-zinc-700 dark:hover:text-zinc-300 flex items-center justify-center gap-1.5 transition-all bg-zinc-50/50 dark:bg-zinc-900/30">
                            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                            </svg>
                            Add Intermediate Waypoint
                        </button>
                    </div>

                    <div class="space-y-1">
                        <label class="text-xs font-bold uppercase tracking-wider text-rose-500 flex items-center gap-1.5">
                            <span class="w-1.5 h-1.5 rounded-full bg-rose-500"></span> Route Destination Terminal
                        </label>
                        <input id="route-end-input" type="text" placeholder="Enter final destination..." class="w-full px-3 py-2 text-sm bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/40 dark:text-white transition-all">
                    </div>
                </div>

                <div class="space-y-2 pt-2 border-t border-zinc-100 dark:border-zinc-800/60">
                    <div class="flex justify-between items-center">
                        <label class="text-xs font-bold uppercase tracking-wider text-zinc-400 dark:text-zinc-500">Corridor Deviation Buffer</label>
                        <span id="label-corridor-radius-val" class="text-xs font-semibold text-zinc-600 dark:text-zinc-300 bg-zinc-100 dark:bg-zinc-800 px-2 py-0.5 rounded">3 miles</span>
                    </div>
                    <input id="slider-corridor-radius" type="range" min="1" max="10" value="3" class="w-full accent-blue-600 h-1.5 bg-zinc-200 dark:bg-zinc-800 rounded-lg appearance-none cursor-pointer">
                </div>

                <button id="btn-trigger-pipeline-routing" class="w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm rounded-lg shadow-md shadow-blue-500/10 focus:outline-none focus:ring-2 focus:ring-blue-500/40 flex items-center justify-center gap-2 transition-all">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 12l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
                    </svg>
                    Optimize Pipeline Path
                </button>
            </div>

            <div class="pt-4 border-t border-zinc-200 dark:border-zinc-800 space-y-3">
                <label class="text-xs font-bold uppercase tracking-wider text-zinc-400 dark:text-zinc-500">Workspace Metrics Summary</label>
                <div class="grid grid-cols-2 gap-2">
                    <div class="bg-zinc-50 dark:bg-zinc-950 p-2.5 rounded-lg border border-zinc-200/60 dark:border-zinc-800/60">
                        <div class="text-[10px] uppercase font-bold text-zinc-400 dark:text-zinc-500">Stations Found</div>
                        <div id="metric-stations-count" class="text-xl font-bold tracking-tight text-zinc-800 dark:text-zinc-200">0</div>
                    </div>
                    <div class="bg-zinc-50 dark:bg-zinc-950 p-2.5 rounded-lg border border-zinc-200/60 dark:border-zinc-800/60">
                        <div class="text-[10px] uppercase font-bold text-zinc-400 dark:text-zinc-500">Average Price</div>
                        <div id="metric-avg-price" class="text-xl font-bold tracking-tight text-zinc-800 dark:text-zinc-200">0.0p</div>
                    </div>
                    <div class="bg-zinc-50 dark:bg-zinc-950 p-2.5 rounded-lg border border-zinc-200/60 dark:border-zinc-800/60">
                        <div class="text-[10px] uppercase font-bold text-zinc-400 dark:text-zinc-500">Lowest Price</div>
                        <div id="metric-min-price" class="text-xl font-bold tracking-tight text-emerald-600 dark:text-emerald-400">0.0p</div>
                    </div>
                    <div class="bg-zinc-50 dark:bg-zinc-950 p-2.5 rounded-lg border border-zinc-200/60 dark:border-zinc-800/60">
                        <div class="text-[10px] uppercase font-bold text-zinc-400 dark:text-zinc-500">Highest Price</div>
                        <div id="metric-max-price" class="text-xl font-bold tracking-tight text-rose-600 dark:text-rose-400">0.0p</div>
                    </div>
                </div>
            </div>

        </div>
    </aside>

    <main class="flex-1 relative h-full w-full">
        <div id="primary-leaflet-map-canvas" class="w-full h-full z-10 bg-zinc-100 dark:bg-zinc-950"></div>

        <button id="scan-area-btn" class="hidden fixed top-20 md:top-auto md:bottom-8 left-1/2 -translate-x-1/2 z-[1000] bg-white dark:bg-zinc-900 text-zinc-900 dark:text-white px-4 py-2 rounded-full shadow-lg border border-zinc-200 dark:border-zinc-800 text-xs font-semibold flex items-center gap-2 hover:bg-zinc-50 dark:hover:bg-zinc-800 active:scale-95 transition-all pointer-events-auto">
            <svg class="w-3.5 h-3.5 text-blue-500 animate-spin-slow" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
            Scan this area for updates
        </button>

        <div id="async-pipeline-loading-shield" class="hidden absolute inset-0 bg-zinc-950/20 dark:bg-zinc-1000/40 backdrop-blur-[2px] z-[1050] items-center justify-center pointer-events-auto transition-all">
            <div class="bg-white dark:bg-zinc-900 p-4 rounded-xl border border-zinc-200 dark:border-zinc-800 shadow-2xl flex items-center gap-3 max-w-xs">
                <div class="w-5 h-5 border-2 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
                <div class="text-xs font-medium text-zinc-700 dark:text-zinc-300">Synchronizing fuel intelligence pipeline...</div>
            </div>
        </div>
    </main>

    <div id="mobile-sidebar-sheet" class="md:hidden fixed inset-x-0 bottom-0 bg-white dark:bg-zinc-900 border-t border-zinc-200 dark:border-zinc-800 shadow-[0_-10px_25px_-5px_rgba(0,0,0,0.1)] rounded-t-2xl z-[1010] transform translate-y-[calc(100%-54px)] transition-transform duration-300 ease-out flex flex-col pointer-events-auto h-[75vh]">
        <div id="sidebar-drag-handle" class="w-full py-3 flex flex-col items-center justify-center cursor-pointer border-b border-zinc-100 dark:border-zinc-800/50 group select-none">
            <div class="w-10 h-1 bg-zinc-300 dark:bg-zinc-700 rounded-full group-hover:bg-zinc-400 dark:group-hover:bg-zinc-500 transition-colors"></div>
            <div class="text-[10px] font-bold uppercase tracking-wider text-zinc-400 dark:text-zinc-500 mt-1.5 flex items-center gap-1">
                <span>Configure Area Constraints</span>
                <svg class="w-3 h-3 transition-transform duration-300 transform" id="sidebar-chevron-indicator" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 15l7-7 7 7"/></svg>
            </div>
        </div>
        <div id="mobile-sidebar-portal-destination" class="flex-1 overflow-y-auto p-4 hide-scrollbar">
            </div>
    </div>

    <div id="mobile-detail-inspector-sheet" class="hidden md:hidden fixed inset-x-0 bottom-0 bg-white dark:bg-zinc-900 border-t border-zinc-200 dark:border-zinc-800 shadow-[0_-10px_25px_-5px_rgba(0,0,0,0.1)] rounded-t-2xl z-[1020] transform translate-y-[calc(100%-54px)] transition-transform duration-300 ease-out flex flex-col pointer-events-auto h-[60vh]">
        <div id="detail-sheet-drag-handle" class="w-full py-3 flex flex-col items-center justify-center cursor-pointer border-b border-zinc-100 dark:border-zinc-800/50 group select-none">
            <div class="w-10 h-1 bg-zinc-300 dark:bg-zinc-700 rounded-full group-hover:bg-zinc-400 dark:group-hover:bg-zinc-500 transition-colors"></div>
            <div class="text-[10px] font-bold uppercase tracking-wider text-zinc-400 dark:text-zinc-500 mt-1.5">Station Fuel Analytics Profile</div>
        </div>
        <div id="mobile-detail-portal-destination" class="flex-1 overflow-y-auto p-5 hide-scrollbar">
            </div>
    </div>

    <div id="desktop-station-inspector-hud" class="hidden id-isolated-hud-card fixed right-4 top-4 bottom-4 w-96 bg-white/95 dark:bg-zinc-900/95 backdrop-blur-md border border-zinc-200 dark:border-zinc-800 shadow-2xl rounded-xl z-[999] flex-col overflow-hidden transition-all duration-300 translate-x-[calc(100%+24px)] pointer-events-auto">

            <span class="text-xs font-bold uppercase tracking-wider text-zinc-400 dark:text-zinc-500">Selected Hub Analytics</span>
            <button id="btn-close-desktop-hud" class="p-1.5 rounded-lg hover:bg-zinc-200 dark:hover:bg-zinc-800 text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200 transition-all">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">

        <div id="desktop-hud-content-scroll-box" class="flex-1 overflow-y-auto p-5 space-y-5 hide-scrollbar">
            </div>
    </div>

    <script>
        // Universal Application Runtime Variables Configuration
        let geospatialMapEngineInstance = null;
        let mappingMarkerClusterGroup = null;
        let persistentGeocodedMarkerArray = [];
        let globalSpatialFuelDataset = [];
        let activelySelectedFuelGradeFilter = 'E10';
        let routingOverlayPolylineInstance = null;
        
        let applicationWorkspaceMode = 'explore'; // options enum constraint: 'explore' | 'route'
        let currentMobileSidebarUIState = 'hidden'; // status tracks: 'hidden' | 'peek' | 'mid' | 'full'
        let currentMobileSheetUIState = 'hidden'; // status tracks: 'hidden' | 'peek' | 'mid' | 'full'

        // Data Storage Mapping Configuration for Intermediary Sequence Nodes
        let interimStopWaypointsList = [];

        // Geocoding Coordinates Cache to mitigate redundant queries
        const postalCoordinateCacheMap = {
            'london': [51.5074, -0.1278],
            'manchester': [53.4808, -2.2426],
            'birmingham': [52.4862, -1.8904],
            'leeds': [53.8008, -1.5491],
            'glasgow': [55.8642, -4.2518],
            'edinburgh': [55.9533, -3.1883],
            'liverpool': [53.4084, -2.9916],
            'bristol': [51.4545, -2.5879],
            'cardiff': [51.4816, -3.1791],
            'belfast': [54.5973, -5.9301],
            'newcastle': [54.9783, -1.6178],
            'sheffield': [53.3811, -1.4701],
            'aberdeen': [57.1497, -2.0943],
            'dundee': [56.4620, -2.9707],
            'dunfermline': [56.0718, -3.4522]
        };

        // Network Brand Configuration Metadata
        const brandMatrixMappingRef = {
            'BP': { title: 'BP', type: 'Premium' },
            'SHELL': { title: 'Shell', type: 'Premium' },
            'TESCO': { title: 'Tesco', type: 'Supermarket' },
            'ASDA': { title: 'Asda', type: 'Supermarket' },
            'SAINSBURYS': { title: "Sainsbury's", type: 'Supermarket' },
            'ESSO': { title: 'Esso', type: 'Premium' },
            'TEXACO': { title: 'Texaco', type: 'Premium' },
            'MORRISONS': { title: 'Morrisons', type: 'Supermarket' },
            'JET': { title: 'Jet', type: 'Independent' },
            'APPLEGREEN': { title: 'AppleGreen', type: 'Independent' },
            'RONTEC': { title: 'Rontec', type: 'Independent' },
            'MFG': { title: 'MFG', type: 'Independent' }
        };

        // Initialize Spatial Map Canvas Environment Layer
        function initializeSpatialMapEngine() {
            geospatialMapEngineInstance = L.map('primary-leaflet-map-canvas', {
                zoomControl: false,
                maxZoom: 18,
                minZoom: 6
            }).setView([56.0718, -3.4522], 12); // Default anchored setup view over Dunfermline workspace reference

            L.control.zoom({ position: 'bottomright' }).addTo(geospatialMapEngineInstance);

            const standardLightTiles = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
            });

            const premiumDarkTiles = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
            });

            standardLightTiles.addTo(geospatialMapEngineInstance);

            window.spatialTileEngineMatrix = {
                light: standardLightTiles,
                dark: premiumDarkTiles
            };

            mappingMarkerClusterGroup = L.markerClusterGroup({
                showCoverageOnHover: false,
                maxClusterRadius: 45,
                iconCreateFunction: function (cluster) {
                    const childCount = cluster.getChildCount();
                    return L.divIcon({
                        html: `<div><span>${childCount}</span></div>`,
                        className: 'custom-cluster',
                        iconSize: L.point(36, 36)
                    });
                }
            });
            geospatialMapEngineInstance.addLayer(mappingMarkerClusterGroup);

            // Configure map event triggers
            geospatialMapEngineInstance.on('moveend', () => {
                if (applicationWorkspaceMode === 'explore') {
                    const targetScanButton = document.getElementById('scan-area-btn');
                    if (targetScanButton) targetScanButton.classList.remove('hidden');
                }
            });

            document.getElementById('scan-area-btn')?.addEventListener('click', () => {
                document.getElementById('scan-area-btn').classList.add('hidden');
                executeViewportDataExtractionPipeline();
            });

            // Mirror sidebar navigation component tree dynamically for smooth cross-device UX compatibility
            document.getElementById('mobile-sidebar-portal-destination').innerHTML = '';
            const desktopControlViewContainer = document.querySelector('#sidebar-panel-container > div.flex-1');
            if (desktopControlViewContainer) {
                const clonedNodes = desktopControlViewContainer.cloneNode(true);
                clonedNodes.classList.remove('px-4', 'pb-6');
                document.getElementById('mobile-sidebar-portal-destination').appendChild(clonedNodes);
            }
            
            synchronizeInteractiveEventBindings();
            initializeWaypointReordering(); // Call UI Reordering initialization
        }

        // Apply Global System Dark Mode Changes to DOM
        function applyThemeChangesToDOM() {
            const isDark = document.documentElement.classList.contains('class') || document.documentElement.className.includes('dark');
            if (window.spatialTileEngineMatrix) {
                if (isDark) {
                    geospatialMapEngineInstance.removeLayer(window.spatialTileEngineMatrix.light);
                    window.spatialTileEngineMatrix.dark.addTo(geospatialMapEngineInstance);
                } else {
                    geospatialMapEngineInstance.removeLayer(window.spatialTileEngineMatrix.dark);
                    window.spatialTileEngineMatrix.light.addTo(geospatialMapEngineInstance);
                }
            }
        }

        // Global Event Re-Binding Function to attach listeners to active responsive views
        function synchronizeInteractiveEventBindings() {
            document.querySelectorAll('.fuel-pill-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const selectedGrade = e.target.getAttribute('data-fuel-type');
                    document.querySelectorAll('.fuel-pill-btn').forEach(b => {
                        b.classList.remove('active', 'border-blue-500', 'bg-blue-50', 'dark:bg-blue-950/40', 'text-blue-600', 'dark:text-blue-400');
                        b.classList.add('border-zinc-200', 'dark:border-zinc-800');
                        if (b.getAttribute('data-fuel-type') === selectedGrade) {
                            b.classList.add('active', 'border-blue-500', 'bg-blue-50', 'dark:bg-blue-950/40', 'text-blue-600', 'dark:text-blue-400');
                            b.classList.remove('border-zinc-200', 'dark:border-zinc-800');
                        }
                    });
                    activelySelectedFuelGradeFilter = selectedGrade;
                    processActiveDatasetPresentation();
                });
            });

            // Route execution listener hook
            document.querySelectorAll('#btn-trigger-pipeline-routing').forEach(btn => {
                btn.addEventListener('click', () => {
                    executeOptimalRouteCalculationPipeline();
                });
            });

            // Appending Interim Stop Node
            document.querySelectorAll('#btn-append-interim-node').forEach(btn => {
                btn.addEventListener('click', () => {
                    appendNewInterimWaypointNode();
                });
            });

            // Sync Slider text values
            document.querySelectorAll('#slider-search-radius').forEach(slider => {
                slider.addEventListener('input', (e) => {
                    document.querySelectorAll('#slider-search-radius').forEach(s => s.value = e.target.value);
                    document.querySelectorAll('#label-radius-val').forEach(lbl => lbl.innerText = `${e.target.value} miles`);
                });
            });

            document.querySelectorAll('#slider-corridor-radius').forEach(slider => {
                slider.addEventListener('input', (e) => {
                    document.querySelectorAll('#slider-corridor-radius').forEach(s => s.value = e.target.value);
                    document.querySelectorAll('#label-corridor-radius-val').forEach(lbl => lbl.innerText = `${e.target.value} miles`);
                });
            });

            // Configuration for Navigation Tab Controllers
            const exploreTabClick = () => {
                applicationWorkspaceMode = 'explore';
                document.querySelectorAll('#tab-explore-mode').forEach(t => {
                    t.className = 'flex-1 py-1.5 px-3 text-xs font-semibold rounded-md bg-white dark:bg-zinc-900 text-blue-600 dark:text-blue-400 shadow-sm transition-all';
                });
                document.querySelectorAll('#tab-routing-mode').forEach(t => {
                    t.className = 'flex-1 py-1.5 px-3 text-xs font-medium text-zinc-500 dark:text-zinc-400 rounded-md hover:text-zinc-800 dark:hover:text-zinc-200 transition-all';
                });
                document.querySelectorAll('#view-block-explore').forEach(v => v.classList.remove('hidden'));
                document.querySelectorAll('#view-block-routing').forEach(v => v.classList.add('hidden'));
                
                if (routingOverlayPolylineInstance) {
                    geospatialMapEngineInstance.removeLayer(routingOverlayPolylineInstance);
                    routingOverlayPolylineInstance = null;
                }
                document.getElementById('scan-area-btn')?.classList.remove('hidden');
                processActiveDatasetPresentation();
            };

            const routingTabClick = () => {
                applicationWorkspaceMode = 'route';
                document.querySelectorAll('#tab-routing-mode').forEach(t => {
                    t.className = 'flex-1 py-1.5 px-3 text-xs font-semibold rounded-md bg-white dark:bg-zinc-900 text-blue-600 dark:text-blue-400 shadow-sm transition-all';
                });
                document.querySelectorAll('#tab-explore-mode').forEach(t => {
                    t.className = 'flex-1 py-1.5 px-3 text-xs font-medium text-zinc-500 dark:text-zinc-400 rounded-md hover:text-zinc-800 dark:hover:text-zinc-200 transition-all';
                });
                document.querySelectorAll('#view-block-explore').forEach(v => v.classList.add('hidden'));
                document.querySelectorAll('#view-block-routing').forEach(v => v.classList.remove('hidden'));
                document.getElementById('scan-area-btn')?.classList.add('hidden');
            };

            document.querySelectorAll('#tab-explore-mode').forEach(t => t.addEventListener('click', exploreTabClick));
            document.querySelectorAll('#tab-routing-mode').forEach(t => t.addEventListener('click', routingTabClick));
        }

        // BEST UX UPDATE: Advanced Vanilla HTML5 Drag & Drop Reordering Engine with visual state handlers
        function initializeWaypointReordering() {
            const configureContainerReorder = (container) => {
                if (!container) return;
                let activeDraggedElement = null;

                container.addEventListener('dragstart', (e) => {
                    const rowTarget = e.target.closest('.draggable-waypoint-row');
                    if (!rowTarget) return;

                    // Ensure dragging is initiated through the dedicated handle to maintain normal text-input interactivity
                    if (!e.target.closest('.waypoint-drag-handle')) {
                        e.preventDefault();
                        return;
                    }

                    activeDraggedElement = rowTarget;
                    // Add micro-delay to prevent the ghost preview layout from detaching styles
                    setTimeout(() => {
                        rowTarget.classList.add('waypoint-dragging');
                    }, 0);
                    e.dataTransfer.effectAllowed = 'move';
                });

                container.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    const currentHoveredRow = e.target.closest('.draggable-waypoint-row');
                    if (!currentHoveredRow || currentHoveredRow === activeDraggedElement) return;

                    const rowBoundingRect = currentHoveredRow.getBoundingClientRect();
                    const midYOffset = rowBoundingRect.top + (rowBoundingRect.height / 2);
                    
                    if (e.clientY > midYOffset) {
                        currentHoveredRow.after(activeDraggedElement);
                    } else {
                        currentHoveredRow.before(activeDraggedElement);
                    }
                });

                container.addEventListener('dragenter', (e) => {
                    const targetRow = e.target.closest('.draggable-waypoint-row');
                    if (targetRow && targetRow !== activeDraggedElement) {
                        targetRow.classList.add('waypoint-drag-over');
                    }
                });

                container.addEventListener('dragleave', (e) => {
                    const targetRow = e.target.closest('.draggable-waypoint-row');
                    if (targetRow) {
                        targetRow.classList.remove('waypoint-drag-over');
                    }
                });

                container.addEventListener('drop', (e) => {
                    e.preventDefault();
                });

                container.addEventListener('dragend', () => {
                    if (activeDraggedElement) {
                        activeDraggedElement.classList.remove('waypoint-dragging');
                        // Clean up hanging border classes across siblings
                        container.querySelectorAll('.draggable-waypoint-row').forEach(row => {
                            row.classList.remove('waypoint-drag-over');
                        });
                        activeDraggedElement = null;
                        
                        // Production Action Hook: Sync changes across device mirrors, rebuild waypoint arrays, recalculate routes
                        rebuildWaypointDataStructuresFromDOM();
                    }
                });
            };

            // Bind to primary sidebar view context
            configureContainerReorder(document.getElementById('interim-stops-container'));
            
            // Watch for mobile portal dynamic injections and bind to mirror nodes
            const observer = new MutationObserver(() => {
                const mobileContainer = document.querySelector('#mobile-sidebar-portal-destination #interim-stops-container');
                if (mobileContainer && !mobileContainer.hasAttribute('data-drag-bound')) {
                    mobileContainer.setAttribute('data-drag-bound', 'true');
                    configureContainerReorder(mobileContainer);
                }
            });
            
            const targetPortal = document.getElementById('mobile-sidebar-portal-destination');
            if (targetPortal) {
                observer.observe(targetPortal, { childList: true, subtree: true });
            }
        }

        // Rebuilds underlying routing structures using DOM sequence tracking after visual sorting updates
        function rebuildWaypointDataStructuresFromDOM() {
            // Find the active container context (Desktop vs Mobile Mirror Portal)
            let dynamicActiveContainer = document.getElementById('interim-stops-container');
            const mobileClonedContainer = document.querySelector('#mobile-sidebar-portal-destination #interim-stops-container');
            
            // If mobile view portal contains elements, mirror extraction updates from there
            if (mobileClonedContainer && mobileClonedContainer.children.length > 0) {
                dynamicActiveContainer = mobileClonedContainer;
            }

            const inputRows = dynamicActiveContainer.querySelectorAll('.draggable-waypoint-row');
            const structuralRecompiledList = [];

            inputRows.forEach(row => {
                const uniqueNodeId = row.getAttribute('data-waypoint-id');
                const inputValueString = row.querySelector('input')?.value || '';
                structuralRecompiledList.push({
                    id: uniqueNodeId,
                    value: inputValueString
                });
            });

            interimStopWaypointsList = structuralRecompiledList;
            
            // Mirror internal structural updates smoothly to alternative view layouts
            synchronizeInterimStopLayoutsAcrossPortals();

            // Re-trigger optimal execution routing if route tracking fields are populated
            const startStr = document.querySelector('#route-start-input')?.value;
            const endStr = document.querySelector('#route-end-input')?.value;
            if (startStr || endStr) {
                executeOptimalRouteCalculationPipeline();
            }
        }

        // Synchronize state structures smoothly across desktop layout views and cloned mobile portals
        function synchronizeInterimStopLayoutsAcrossPortals() {
            const generateHTMLTemplateContent = (listToRender) => {
                return listToRender.map(node => `
                    <div class="draggable-waypoint-row flex items-center gap-2 bg-zinc-50 dark:bg-zinc-950 p-2 rounded-lg border border-zinc-200 dark:border-zinc-800 shadow-sm transition-all duration-200" draggable="true" data-waypoint-id="${node.id}">
                        <div class="waypoint-drag-handle cursor-grab active:cursor-grabbing p-1 text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-300 transition-colors">
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M4 3.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm8 0a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm-8 4.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm8 0a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm-8 4.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm8 0a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z"/>
                            </svg>
                        </div>
                        <input type="text" value="${node.value}" placeholder="Enter intermediate stop..." class="waypoint-input-node flex-1 bg-transparent border-none focus:ring-0 text-xs text-zinc-800 dark:text-zinc-100 outline-none placeholder-zinc-400" data-target-node-id="${node.id}">
                        <button type="button" class="btn-remove-waypoint p-1 text-zinc-400 hover:text-rose-500 transition-colors" data-remove-node-id="${node.id}">
                            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>
                `).join('');
            };

            const compiledMarkupCode = generateHTMLTemplateContent(interimStopWaypointsList);
            
            // Sync structural targets across layouts
            const baseContainer = document.getElementById('interim-stops-container');
            const portalClonedContainer = document.querySelector('#mobile-sidebar-portal-destination #interim-stops-container');
            
            if (baseContainer) baseContainer.innerHTML = compiledMarkupCode;
            if (portalClonedContainer) portalClonedContainer.innerHTML = compiledMarkupCode;

            // Re-bind change listeners and removal click sequences across elements
            document.querySelectorAll('.waypoint-input-node').forEach(inputField => {
                inputField.addEventListener('change', (e) => {
                    const uniqueId = e.target.getAttribute('data-target-node-id');
                    const val = e.target.value;
                    const item = interimStopWaypointsList.find(node => node.id === uniqueId);
                    if (item) item.value = val;
                    
                    // Keep complementary viewport inputs perfectly matched
                    document.querySelectorAll(`.waypoint-input-node[data-target-node-id="${uniqueId}"]`).forEach(f => {
                        if (f !== e.target) f.value = val;
                    });
                });
            });

            document.querySelectorAll('.btn-remove-waypoint').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const targetId = e.currentTarget.getAttribute('data-remove-node-id');
                    interimStopWaypointsList = interimStopWaypointsList.filter(node => node.id !== targetId);
                    synchronizeInterimStopLayoutsAcrossPortals();
                });
            });
        }

        // Append a new dynamic routing waypoint row node to the stack
        function appendNewInterimWaypointNode() {
            const internalUniqueKey = 'node_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
            interimStopWaypointsList.push({
                id: internalUniqueKey,
                value: ''
            });
            synchronizeInterimStopLayoutsAcrossPortals();
        }

        // Location Autocomplete Configuration Event Logic Listener Configuration
        function setupAutocompleteListeners() {
            const bindQuerySearchAutocomplete = (inputId) => {
                const targetNodeInput = document.getElementById(inputId);
                if (!targetNodeInput) return;

                targetNodeInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        const parsedQueryValue = targetNodeInput.value.trim().toLowerCase();
                        if (postalCoordinateCacheMap[parsedQueryValue]) {
                            const cachedTargetCoord = postalCoordinateCacheMap[parsedQueryValue];
                            geospatialMapEngineInstance.setView(cachedTargetCoord, 13);
                            executeViewportDataExtractionPipeline();
                        }
                    }
                });
            };

            bindQuerySearchAutocomplete('explore-search-input');
            bindQuerySearchAutocomplete('route-start-input');
            bindQuerySearchAutocomplete('route-end-input');

            // Wire up a mutation tracking function layer to catch runtime additions injected inside responsive panels
            const targetPortalObserver = new MutationObserver(() => {
                bindQuerySearchAutocomplete('mobile-sidebar-portal-destination #explore-search-input');
                bindQuerySearchAutocomplete('mobile-sidebar-portal-destination #route-start-input');
                bindQuerySearchAutocomplete('mobile-sidebar-portal-destination #route-end-input');
            });

            const mobileDestinationPortalNode = document.getElementById('mobile-sidebar-portal-destination');
            if (mobileDestinationPortalNode) {
                targetPortalObserver.observe(mobileDestinationPortalNode, { childList: true, subtree: true });
            }
        }

        // Asynchronous Pipeline Logic: Fetch/Extract dataset info mapped over active viewport coordinates
        function executeViewportDataExtractionPipeline() {
            const currentShieldOverlay = document.getElementById('async-pipeline-loading-shield');
            if (currentShieldOverlay) currentShieldOverlay.classList.set = 'flex';
            currentShieldOverlay?.classList.remove('hidden');

            // Model synthetic latency pipeline generation to emulate standard remote query structures
            setTimeout(() => {
                const viewportBoundsCenter = geospatialMapEngineInstance.getCenter();
                globalSpatialFuelDataset = generateSyntheticFuelIntelligencePipelineData(viewportBoundsCenter.lat, viewportBoundsCenter.lng);
                
                processActiveDatasetPresentation();
                currentShieldOverlay?.classList.add('hidden');
            }, 400);
        }

        // Formulates synthetic mock data for the dashboard presentation pipeline
        function generateSyntheticFuelIntelligencePipelineData(pivotLat, pivotLng) {
            const syntheticPayloadList = [];
            const structuralBrandKeys = Object.keys(brandMatrixMappingRef);
            const geographicalSiteNameIndexTokens = ['Services', 'Express', 'Fuel Hub', 'Forecourt', 'Connect', 'Station'];

            for (let indexValue = 0; indexValue < 45; indexValue++) {
                const localizedLatitudeOffset = pivotLat + (Math.random() - 0.5) * 0.08;
                const localizedLongitudeOffset = pivotLng + (Math.random() - 0.5) * 0.12;
                const randomBrandKey = structuralBrandKeys[Math.floor(Math.random() * structuralBrandKeys.length)];
                const resolvedBrandObj = brandMatrixMappingRef[randomBrandKey];
                const resolvedSiteTitle = resolvedBrandObj.title + ' ' + geographicalSiteNameIndexTokens[Math.floor(Math.random() * geographicalSiteNameIndexTokens.length)];

                // Synthesize fuel grade pricing profiles in pence parameters
                const petrolE10BasePrice = 136.9 + (Math.random() * 14.0);
                const dieselB7BasePrice = 141.9 + (Math.random() * 12.0);

                syntheticPayloadList.push({
                    id: 'station_index_id_' + indexValue + '_' + Math.floor(Math.random() * 10000),
                    siteName: resolvedSiteTitle,
                    brandNetwork: randomBrandKey,
                    classification: resolvedBrandObj.type,
                    latitude: localizedLatitudeOffset,
                    longitude: localizedLongitudeOffset,
                    prices: {
                        'E10': parseFloat(petrolE10BasePrice.toFixed(1)),
                        'B7': parseFloat(dieselB7BasePrice.toFixed(1)),
                        'E5': parseFloat((petrolE10BasePrice + 8.5).toFixed(1)),
                        'SDV': parseFloat((dieselB7BasePrice + 9.0).toFixed(1))
                    },
                    address: `A${Math.floor(Math.random() * 900) + 1} Corridor, Core Sector Location, UK`,
                    lastUpdated: `${Math.floor(Math.random() * 22) + 1} hours ago`
                });
            }
            return syntheticPayloadList;
        }

        // Processes presentation logic pipelines across the rendering layers
        function processActiveDatasetPresentation() {
            mappingMarkerClusterGroup.clearLayers();
            persistentGeocodedMarkerArray.forEach(m => geospatialMapEngineInstance.removeLayer(m));
            persistentGeocodedMarkerArray = [];

            if (globalSpatialFuelDataset.length === 0) return;

            // Extract checkbox configurations mapped over live views
            const userSelectedBrandsList = Array.from(document.querySelectorAll('.tracking-brand:checked')).map(el => el.value);
            const filtersIncludeAllNetworks = userSelectedBrandsList.includes('ALL');

            const filteredDataSubSetList = globalSpatialFuelDataset.filter(stationNode => {
                if (!filtersIncludeAllNetworks && !userSelectedBrandsList.includes(stationNode.brandNetwork)) {
                    return false;
                }
                return !!stationNode.prices[activelySelectedFuelGradeFilter];
            });

            // Re-compile metric indicators
            let cumulativePriceSum = 0;
            let lowestObservedPrice = Infinity;
            let highestObservedPrice = -Infinity;

            filteredDataSubSetList.forEach(station => {
                const operationalFuelPriceVal = station.prices[activelySelectedFuelGradeFilter];
                cumulativePriceSum += operationalFuelPriceVal;
                if (operationalFuelPriceVal < lowestObservedPrice) lowestObservedPrice = operationalFuelPriceVal;
                if (operationalFuelPriceVal > highestObservedPrice) highestObservedPrice = operationalFuelPriceVal;

                // Configure dynamic pin layout formatting elements
                const computedCustomMarkerPin = L.marker([station.latitude, station.longitude], {
                    icon: L.divIcon({
                        html: `
                            <div class="flex flex-col items-center justify-center bg-white dark:bg-zinc-900 border border-zinc-300 dark:border-zinc-700 px-2 py-1 rounded-md shadow-md font-bold text-xs transition-transform hover:scale-105">
                                <span class="text-[9px] text-zinc-400 dark:text-zinc-500 font-medium leading-none">${station.brandNetwork}</span>
                                <span class="text-zinc-800 dark:text-zinc-100 mt-0.5 leading-none">${operationalFuelPriceVal}p</span>
                            </div>
                        `,
                        className: 'custom-station-div-pin',
                        iconSize: [52, 34],
                        iconAnchor: [26, 17]
                    })
                });

                computedCustomMarkerPin.on('click', () => {
                    presentSelectedStationInspectorProfileHUD(station);
                });

                mappingMarkerClusterGroup.addLayer(computedCustomMarkerPin);
            });

            // Formulate fallback data models if subsets parse to 0
            const finalComputedAveragePrice = filteredDataSubSetList.length > 0 ? (cumulativePriceSum / filteredDataSubSetList.length).toFixed(1) : '0.0';
            const resolvedLowestPriceDisplay = lowestObservedPrice !== Infinity ? `${lowestObservedPrice.toFixed(1)}p` : '0.0p';
            const resolvedHighestPriceDisplay = highestObservedPrice !== -Infinity ? `${highestObservedPrice.toFixed(1)}p` : '0.0p';

            // Populate text parameters fluidly across layout view matrices
            document.querySelectorAll('#metric-stations-count').forEach(el => el.innerText = filteredDataSubSetList.length);
            document.querySelectorAll('#metric-avg-price').forEach(el => el.innerText = `${finalComputedAveragePrice}p`);
            document.querySelectorAll('#metric-min-price').forEach(el => el.innerText = resolvedLowestPriceDisplay);
            document.querySelectorAll('#metric-max-price').forEach(el => el.innerText = resolvedHighestPriceDisplay);
        }

        // Present analytical inspector details card view profile matching selected node references
        function presentSelectedStationInspectorProfileHUD(stationRef) {
            const activeSelectedPriceNum = stationRef.prices[activelySelectedFuelGradeFilter];

            const structuralHTMLMarkupPayload = `
                <div class="space-y-4">
                    <div>
                        <div class="flex items-center gap-2">
                            <span class="px-2 py-0.5 text-[10px] font-bold uppercase rounded bg-zinc-100 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-400 border border-zinc-200/60 dark:border-zinc-700/60">${stationRef.classification} Network</span>
                            <span class="text-xs text-zinc-400">${stationRef.lastUpdated}</span>
                        </div>
                        <h3 class="text-lg font-bold tracking-tight text-zinc-900 dark:text-white mt-1">${stationRef.siteName}</h3>
                        <p class="text-xs text-zinc-500 mt-0.5">${stationRef.address}</p>
                    </div>

                    <div class="bg-blue-50/50 dark:bg-blue-950/20 border border-blue-100 dark:border-blue-900/40 p-4 rounded-xl flex items-center justify-between">
                        <div>
                            <div class="text-xs font-semibold text-blue-600 dark:text-blue-400">Selected Grade (${activelySelectedFuelGradeFilter})</div>
                            <div class="text-[10px] text-zinc-400 mt-0.5">Verified dynamic pricing data stream</div>
                        </div>
                        <div class="text-3xl font-black tracking-tight text-blue-600 dark:text-blue-400">${activeSelectedPriceNum}<span class="text-sm font-bold">p</span></div>
                    </div>

                    <div class="space-y-2">
                        <h4 class="text-xs font-bold uppercase tracking-wider text-zinc-400 dark:text-zinc-500">Alternative Fuel Rates Matrix</h4>
                        <div class="grid grid-cols-2 gap-2">
                            ${Object.entries(stationRef.prices).map(([grade, price]) => {
                                const indexMatchingFlag = grade === activelySelectedFuelGradeFilter;
                                return `
                                    <div class="p-2 rounded-lg border ${indexMatchingFlag ? 'border-blue-400 bg-white dark:bg-zinc-900' : 'border-zinc-100 dark:border-zinc-800/60 bg-zinc-50/50 dark:bg-zinc-950/40'} flex items-center justify-between">
                                        <span class="text-xs font-bold ${indexMatchingFlag ? 'text-blue-500' : 'text-zinc-500'}">${grade}</span>
                                        <span class="text-xs font-semibold tracking-tight ${indexMatchingFlag ? 'text-blue-600 dark:text-blue-400' : 'text-zinc-700 dark:text-zinc-300'}">${price}p</span>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <div class="pt-2">
                        <div class="flex justify-between items-center text-xs mb-1.5">
                            <span class="font-medium text-zinc-500">Corridor Market Deviation</span>
                            <span class="font-bold text-emerald-500">-2.4p below localized standard</span>
                        </div>
                        <div class="w-full bg-zinc-100 dark:bg-zinc-800 h-2 rounded-full overflow-hidden flex">
                            <div class="bg-emerald-500 h-full w-2/3 rounded-full"></div>
                        </div>
                    </div>
                </div>
            `;

            // Inject structural layout payload matching responsive client frames
            if (window.innerWidth < 768) {
                document.getElementById('mobile-detail-portal-destination').innerHTML = structuralHTMLMarkupPayload;
                setMobileDetailInspectorSheetUIState('mid');
            } else {
                const hudCardContainerNode = document.getElementById('desktop-station-inspector-hud');
                const hudScrollBoxTarget = document.getElementById('desktop-hud-content-scroll-box');
                
                if (hudCardContainerNode && hudScrollBoxTarget) {
                    hudScrollBoxTarget.innerHTML = structuralHTMLMarkupPayload;
                    hudCardContainerNode.classList.remove('hidden');
                    setTimeout(() => {
                        hudCardContainerNode.classList.remove('translate-x-[calc(100%+24px)]');
                    }, 50);
                }
            }
        }

        // Execute optimal spatial routing logic calculations mapping target nodes
        function executeOptimalRouteCalculationPipeline() {
            const currentShieldOverlay = document.getElementById('async-pipeline-loading-shield');
            if (currentShieldOverlay) currentShieldOverlay.classList.set = 'flex';
            currentShieldOverlay?.classList.remove('hidden');

            setTimeout(() => {
                // Extract structural data constraints
                const startingPointQueryString = document.getElementById('route-start-input')?.value.trim().toLowerCase() || 'london';
                const finalTargetQueryString = document.getElementById('route-end-input')?.value.trim().toLowerCase() || 'dunfermline';

                const matchedOriginCoord = postalCoordinateCacheMap[startingPointQueryString] || [51.5074, -0.1278];
                const matchedTerminalCoord = postalCoordinateCacheMap[finalTargetQueryString] || [56.0718, -3.4522];

                // Assemble geospatial path point coordinate array parameters
                const computedPipelineRoutePointsArray = [matchedOriginCoord];

                // Inject intermediate waypoint point parameters sequentially
                interimStopWaypointsList.forEach(node => {
                    const parsedStr = node.value.trim().toLowerCase();
                    if (parsedStr && postalCoordinateCacheMap[parsedStr]) {
                        computedPipelineRoutePointsArray.push(postalCoordinateCacheMap[parsedStr]);
                    }
                });

                computedPipelineRoutePointsArray.push(matchedTerminalCoord);

                if (routingOverlayPolylineInstance) {
                    geospatialMapEngineInstance.removeLayer(routingOverlayPolylineInstance);
                }

                // Append premium styled multi-segment routing path geometry overlay
                routingOverlayPolylineInstance = L.polyline(computedPipelineRoutePointsArray, {
                    color: '#2563eb',
                    weight: 5,
                    opacity: 0.85,
                    dashArray: '2, 8',
                    lineJoin: 'round'
                }).addTo(geospatialMapEngineInstance);

                geospatialMapEngineInstance.fitBounds(routingOverlayPolylineInstance.getBounds(), { padding: [40, 40] });

                // Formulate simulated fuel dataset tracking layout matches matching route corridor
                globalSpatialFuelDataset = generateSyntheticFuelIntelligencePipelineData(matchedTerminalCoord[0], matchedTerminalCoord[1]);
                processActiveDatasetPresentation();

                currentShieldOverlay?.classList.add('hidden');
                
                // Collapse mobile control drawer layers down dynamically to maximize viewport visualization space
                if (window.innerWidth < 768) {
                    setMobileSidebarSheetUIState('peek');
                }
            }, 600);
        }

        // Mobile Sheet UI Presentation Engine Window Layout Mechanics Configuration
        function setMobileSidebarSheetUIState(targetStateCode) {
            const mobileSidebarSheetNode = document.getElementById('mobile-sidebar-sheet');
            const mobileChevronIndicatorNode = document.getElementById('sidebar-chevron-indicator');
            if (!mobileSidebarSheetNode) return;

            currentMobileSidebarUIState = targetStateCode;

            switch (targetStateCode) {
                case 'hidden':
                    mobileSidebarSheetNode.style.transform = 'translateY(100%)';
                    break;
                case 'peek':
                    mobileSidebarSheetNode.style.transform = 'translateY(calc(100% - 54px))';
                    if (mobileChevronIndicatorNode) mobileChevronIndicatorNode.style.transform = 'rotate(0deg)';
                    break;
                case 'mid':
                    mobileSidebarSheetNode.style.transform = 'translateY(45vh)';
                    if (mobileChevronIndicatorNode) mobileChevronIndicatorNode.style.transform = 'rotate(180deg)';
                    break;
                case 'full':
                    mobileSidebarSheetNode.style.transform = 'translateY(20vh)';
                    if (mobileChevronIndicatorNode) mobileChevronIndicatorNode.style.transform = 'rotate(180deg)';
                    break;
            }
        }

        function setMobileDetailInspectorSheetUIState(targetStateCode) {
            const mobileInspectorSheetNode = document.getElementById('mobile-detail-inspector-sheet');
            if (!mobileInspectorSheetNode) return;

            currentMobileSheetUIState = targetStateCode;

            switch (targetStateCode) {
                case 'hidden':
                    mobileInspectorSheetNode.style.transform = 'translateY(100%)';
                    mobileInspectorSheetNode.classList.add('hidden');
                    break;
                case 'peek':
                    mobileInspectorSheetNode.classList.remove('hidden');
                    mobileInspectorSheetNode.style.transform = 'translateY(calc(100% - 54px))';
                    break;
                case 'mid':
                    mobileInspectorSheetNode.classList.remove('hidden');
                    mobileInspectorSheetNode.style.transform = 'translateY(40vh)';
                    break;
                case 'full':
                    mobileInspectorSheetNode.classList.remove('hidden');
                    mobileInspectorSheetNode.style.transform = 'translateY(15vh)';
                    break;
            }
        }

        // Configure Global Application Touch Gestures & Element Listeners Lifecycle Setup
        function initializeComponentEventWiringGrid() {
            // Desk close action
            document.getElementById('btn-close-desktop-hud')?.addEventListener('click', () => {
                const hudContainer = document.getElementById('desktop-station-inspector-hud');
                if (hudContainer) {
                    hudContainer.classList.add('translate-x-[calc(100%+24px)]');
                    setTimeout(() => hudContainer.classList.add('hidden'), 300);
                }
            });

            // Wire theme triggers
            const toggleThemeHandler = () => {
                document.documentElement.classList.toggle('dark');
                applyThemeChangesToDOM();
            };
            document.getElementById('desktop-theme-toggle')?.addEventListener('click', toggleThemeHandler);
            document.getElementById('mobile-theme-toggle')?.addEventListener('click', toggleThemeHandler);

            // Responsive mobile touch interaction logic anchors
            document.getElementById('sidebar-drag-handle')?.addEventListener('click', (e) => {
                e.stopPropagation();
                if (currentMobileSidebarUIState === 'peek') setMobileSidebarSheetUIState('mid');
                else if (currentMobileSidebarUIState === 'mid') setMobileSidebarSheetUIState('full');
                else if (currentMobileSidebarUIState === 'full') setMobileSidebarSheetUIState('peek');
            });

            document.getElementById('detail-sheet-drag-handle')?.addEventListener('click', (e) => {
                e.stopPropagation();
                if (currentMobileSheetUIState === 'peek') setMobileDetailInspectorSheetUIState('mid');
                else if (currentMobileSheetUIState === 'mid') setMobileDetailInspectorSheetUIState('full');
                else if (currentMobileSheetUIState === 'full') setMobileDetailInspectorSheetUIState('peek');
            });
        }

        // Launch application initialization framework mapping window load state triggers
        window.addEventListener('DOMContentLoaded', () => {
            initializeSpatialMapEngine();
            initializeComponentEventWiringGrid();
            setupAutocompleteListeners();
            executeViewportDataExtractionPipeline();
            
            // Auto adjust layout state options for small smartphone display architectures
            if (window.innerWidth < 768) {
                setMobileSidebarSheetUIState('peek');
            }
        });
    </script>
</body>
</html>
