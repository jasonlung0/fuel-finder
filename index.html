<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuel Pipeline Optimization Engine</title>
    
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        html, body, #root { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden; }
        #map { height: 100%; width: 100%; position: absolute; top: 0; bottom: 0; left: 0; right: 0; z-index: 1; }
        
        .custom-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #2563eb;
            cursor: pointer;
            border: 2px solid white;
            box-shadow: 0 1px 4px rgba(0,0,0,0.2);
        }

        .custom-leaflet-pin { background: transparent !important; border: none !important; }
        .marker-badge-pulse {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: center center;
            backface-visibility: hidden;
        }
        .marker-badge-pulse:hover {
            transform: scale(1.15) translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
            z-index: 99999 !important;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-900 font-sans overflow-hidden select-none">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Fix: Deterministic seeded coordinate generator ensuring markers map 100% inland 
        // (restricted explicitly to the terrestrial bounds of Edinburgh & Dunfermline)
        const generatePersistentMasterPool = () => {
            const brands = ['ASDA', 'SAINSBURYS', 'MORRISONS', 'GULF', 'JET', 'BP', 'SHELL'];
            const areas = [
                { name: 'Dunfermline Central', lat: 56.071, lng: -3.452 },
                { name: 'Halbeath Terminal', lat: 56.082, lng: -3.415 },
                { name: 'Inverkeithing Deck', lat: 56.034, lng: -3.402 },
                { name: 'Queensferry Corridor', lat: 55.991, lng: -3.395 },
                { name: 'Gyle Logistics Hub', lat: 55.938, lng: -3.292 },
                { name: 'Corstorphine Spine', lat: 55.942, lng: -3.275 },
                { name: 'Chancelot System', lat: 55.978, lng: -3.195 },
                { name: 'Milton Link Infrastructure', lat: 55.939, lng: -3.104 },
                { name: 'Straiton Gateway', lat: 55.888, lng: -3.182 },
                { name: 'Sighthill Node', lat: 55.924, lng: -3.298 }
            ];

            let pool = [];
            let idCounter = 1;
            
            areas.forEach((area, areaIdx) => {
                // Generate 6 strictly constrained inland stations surrounding each regional hub
                for (let i = 0; i < 6; i++) {
                    const seedInput = (areaIdx * 7) + i;
                    const pseudoRandomLat = Math.sin(seedInput) * 0.015;
                    const pseudoRandomLng = Math.cos(seedInput + 1) * 0.022;
                    
                    const lat = area.lat + pseudoRandomLat;
                    const lng = area.lng + pseudoRandomLng;
                    
                    const basePrice = 142.5 + (Math.abs(Math.sin(seedInput + 5)) * 14.5);
                    const brand = brands[(seedInput) % brands.length];

                    pool.push({
                        id: `st-master-${idCounter++}`,
                        brand,
                        address: `${Math.floor(11 + (seedInput * 3))} ${area.name} Grid`,
                        lat: parseFloat(lat.toFixed(5)),
                        lng: parseFloat(lng.toFixed(5)),
                        prices: {
                            e10: parseFloat(basePrice.toFixed(1)),
                            e5: parseFloat((basePrice + 14.0).toFixed(1)),
                            b7: parseFloat((basePrice + 17.5).toFixed(1))
                        }
                    });
                }
            });
            return pool;
        };

        const GLOBAL_STATION_POOL = generatePersistentMasterPool();

        function App() {
            // Fix: Local area search is selected by default
            const [searchMode, setSearchMode] = useState('local'); 
            
            // Fix: Route planner inputs are completely empty on mount
            const [startInput, setStartInput] = useState('');
            const [destInput, setDestInput] = useState('');
            const [interimInput, setInterimInput] = useState('');
            
            // Fix: Interim stop row hidden unconditionally until explicitly requested
            const [showInterimField, setShowInterimField] = useState(false);
            
            const [localSearch, setLocalSearch] = useState('City of Edinburgh, Scotland');
            
            // Configuration Parameters
            const [radius, setRadius] = useState(8);
            const [efficiency, setEfficiency] = useState(48);
            const [fuelVariant, setFuelVariant] = useState('Petrol Unleaded (E10)');

            // Active Render Data States
            const [visibleMarkers, setVisibleMarkers] = useState([]);
            const [selectedStation, setSelectedStation] = useState(null);
            const [suggestions, setSuggestions] = useState([]);
            const [activeSuggestionField, setActiveSuggestionField] = useState(null);
            
            // Layout Modal / Drawer Overlay States
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isPoolsOpen, setIsPoolsOpen] = useState(false);
            
            // Fix: Main menu dropdown tracking for Starred and Saved options
            const [activeHeaderDropdown, setActiveHeaderDropdown] = useState(null); // 'saved' | 'starred' | null

            // Mocked content lists for dropdown systems
            const savedRoutesMock = [
                { id: 'r1', title: 'Dunfermline → Edinburgh Central', info: '18.2 miles · 3 stations' },
                { id: 'r2', title: 'Falkirk Corridor Bypass', info: '26.4 miles · 5 stations' }
            ];
            const starredForecourtsMock = [
                { id: 'f1', title: 'ASDA Halbeath Terminal', price: '143.2p' },
                { id: 'f2', title: 'JET Corstorphine Spine', price: '144.5p' }
            ];

            // Mapping References
            const mapRef = useRef(null);
            const routeGroupRef = useRef(null);
            const markerGroupRef = useRef(null);
            const activeCircleOverlayRef = useRef(null);

            // Initialize Map Canvas Elements
            useEffect(() => {
                if (!mapRef.current) {
                    mapRef.current = L.map('map', { zoomControl: false }).setView([55.9533, -3.1883], 11);
                    
                    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                        attribution: '© OpenStreetMap contributors'
                    }).addTo(mapRef.current);

                    markerGroupRef.current = L.layerGroup().addTo(mapRef.current);
                    routeGroupRef.current = L.layerGroup().addTo(mapRef.current);

                    // Seed starting map coordinates view markers from static pool
                    syncMarkersWithMapViewport();
                }
            }, []);

            // Fix: Universal filter hook computing visible items from stable dataset
            const syncMarkersWithMapViewport = () => {
                if (!mapRef.current) return;
                const bounds = mapRef.current.getBounds();
                
                // Extract valid elements inside active coordinates boundaries
                const filtered = GLOBAL_STATION_POOL.filter(station => {
                    return bounds.contains([station.lat, station.lng]);
                });
                
                setVisibleMarkers(filtered);
            };

            // Sync visual layer components whenever dataset changes
            useEffect(() => {
                if (markerGroupRef.current && mapRef.current) {
                    markerGroupRef.current.clearLayers();

                    visibleMarkers.forEach(station => {
                        const price = station.prices.e10;
                        let colorVariantClass = 'bg-blue-600'; 
                        if (price < 146) colorVariantClass = 'bg-emerald-500';
                        if (price > 152) colorVariantClass = 'bg-rose-500';

                        const htmlContent = `
                            <div class="marker-badge-pulse ${colorVariantClass} text-white text-[11px] font-bold px-2 py-0.5 rounded shadow-md border border-white flex items-center justify-center gap-1 cursor-pointer">
                                ${price}p
                            </div>
                        `;

                        const customIcon = L.divIcon({
                            className: 'custom-leaflet-pin',
                            html: htmlContent,
                            iconSize: [52, 22],
                            iconAnchor: [26, 11]
                        });

                        const marker = L.marker([station.lat, station.lng], { icon: customIcon });
                        marker.on('click', () => setSelectedStation(station));
                        markerGroupRef.current.addLayer(marker);
                    });
                }
            }, [visibleMarkers]);

            // Track dynamic georadius circles
            useEffect(() => {
                if (searchMode === 'local' && mapRef.current) {
                    if (activeCircleOverlayRef.current) {
                        mapRef.current.removeLayer(activeCircleOverlayRef.current);
                    }
                    const center = mapRef.current.getCenter();
                    activeCircleOverlayRef.current = L.circle(center, {
                        radius: radius * 1609.34, 
                        color: '#3b82f6',
                        fillColor: '#2563eb',
                        fillOpacity: 0.05,
                        weight: 1.5,
                        dashArray: '4, 6'
                    }).addTo(mapRef.current);
                } else {
                    if (activeCircleOverlayRef.current && mapRef.current) {
                        mapRef.current.removeLayer(activeCircleOverlayRef.current);
                        activeCircleOverlayRef.current = null;
                    }
                }
            }, [radius, searchMode]);

            // Geocoding Suggester Framework
            const executeGeocodeLookup = async (textVal, fieldIdentifier) => {
                if (fieldIdentifier === 'start') setStartInput(textVal);
                if (fieldIdentifier === 'dest') setDestInput(textVal);
                if (fieldIdentifier === 'interim') setInterimInput(textVal);
                if (fieldIdentifier === 'local') setLocalSearch(textVal);

                if (textVal.trim().length < 3) {
                    setSuggestions([]);
                    return;
                }

                setActiveSuggestionField(fieldIdentifier);
                try {
                    const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(textVal)}&countrycodes=gb&limit=4`;
                    const res = await fetch(url, { headers: { 'Accept-Language': 'en' } });
                    const data = await res.json();
                    setSuggestions(data);
                } catch (err) {
                    console.error("Geocoding lookup exception:", err);
                }
            };

            const confirmSuggestionAssignment = (selectedItem, fieldIdentifier) => {
                const titleStr = selectedItem.display_name.split(',')[0] + ', ' + (selectedItem.display_name.split(',')[1] || '').trim();
                
                if (fieldIdentifier === 'start') setStartInput(titleStr);
                if (fieldIdentifier === 'dest') setDestInput(titleStr);
                if (fieldIdentifier === 'interim') setInterimInput(titleStr);
                if (fieldIdentifier === 'local') {
                    setLocalSearch(titleStr);
                    const lat = parseFloat(selectedItem.lat);
                    const lon = parseFloat(selectedItem.lon);
                    mapRef.current.setView([lat, lon], 12);
                    setTimeout(syncMarkersWithMapViewport, 400);
                }

                setSuggestions([]);
                setActiveSuggestionField(null);
            };

            // Reverse fields tracking state handler
            const executeRouteFieldsSwap = () => {
                const temp = startInput;
                setStartInput(destInput);
                setDestInput(temp);
            };

            // Build Route Polyline Path
            const computeNetworkRoadCorridor = async () => {
                if (!startInput || !destInput) return;
                routeGroupRef.current.clearLayers();

                try {
                    const locations = [startInput, showInterimField ? interimInput : '', destInput].filter(str => str && str.trim() !== '');
                    const coords = [];

                    for (let address of locations) {
                        const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}&countrycodes=gb&limit=1`;
                        const res = await fetch(url);
                        const dataset = await res.json();
                        if (dataset && dataset.length > 0) {
                            coords.push(`${dataset[0].lon},${dataset[0].lat}`);
                        }
                    }

                    if (coords.length < 2) return;

                    const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${coords.join(';')}?overview=full&geometries=geojson`;
                    const response = await fetch(osrmUrl);
                    const routePayload = await response.json();

                    if (routePayload.routes && routePayload.routes.length > 0) {
                        const geom = routePayload.routes[0].geometry;
                        const leafletLatLngs = geom.coordinates.map(node => [node[1], node[0]]);

                        const line = L.polyline(leafletLatLngs, {
                            color: '#2563eb',
                            weight: 5,
                            opacity: 0.85
                        }).addTo(routeGroupRef.current);

                        mapRef.current.fitBounds(line.getBounds(), { padding: [40, 40] });
                        setTimeout(syncMarkersWithMapViewport, 600);
                    }
                } catch (error) {
                    console.error("OSRM pipeline corridor mapping layer crash:", error);
                }
            };

            const clearField = (field) => {
                if (field === 'start') setStartInput('');
                if (field === 'dest') setDestInput('');
                if (field === 'interim') setInterimInput('');
                if (field === 'local') setLocalSearch('');
            };

            const topThreeCheapest = [...visibleMarkers]
                .sort((x, y) => x.prices.e10 - y.prices.e10)
                .slice(0, 3);

            return (
                <div className="relative w-full h-full flex overflow-hidden bg-slate-50" onClick={() => setActiveHeaderDropdown(null)}>
                    
                    {/* Leaflet Map Context Layer */}
                    <div id="map"></div>

                    {/* Navigation Pills Header Panel */}
                    <div className="absolute top-4 right-4 z-[2000] flex flex-col items-end gap-1">
                        <div className="bg-white/95 backdrop-blur-md px-4 py-2 rounded-xl shadow-lg border border-slate-200/80 flex items-center gap-5 text-xs font-semibold text-slate-700" onClick={(e) => e.stopPropagation()}>
                            <div className="flex items-center gap-1.5 text-emerald-600 font-bold uppercase tracking-wider">
                                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                System Live
                            </div>
                            <div className="w-px h-3 bg-slate-200"></div>
                            <button className="hover:text-blue-600 transition">Dashboard</button>
                            
                            {/* Saved Routes Pill Toggle */}
                            <div className="relative">
                                <button 
                                    onClick={() => setActiveHeaderDropdown(activeHeaderDropdown === 'saved' ? null : 'saved')}
                                    className={`hover:text-blue-600 transition flex items-center gap-1.5 ${activeHeaderDropdown === 'saved' ? 'text-blue-600' : ''}`}
                                >
                                    Saved Routes 
                                    <span className="bg-blue-100 text-blue-600 font-extrabold px-1.5 py-0.5 rounded text-[10px]">2</span>
                                </button>
                                
                                {activeHeaderDropdown === 'saved' && (
                                    <div className="absolute right-0 mt-2 w-64 bg-white rounded-xl shadow-xl border border-slate-100 p-2 flex flex-col gap-1 z-[3000] animate-in fade-in zoom-in-95 duration-100">
                                        <div className="p-2 text-[10px] font-bold text-slate-400 uppercase tracking-wider border-b border-slate-50">Stored Paths Pool</div>
                                        {savedRoutesMock.map(r => (
                                            <div key={r.id} className="p-2 hover:bg-slate-50 rounded-lg cursor-pointer transition">
                                                <div className="text-xs font-bold text-slate-800">{r.title}</div>
                                                <div className="text-[10px] text-slate-400 font-semibold">{r.info}</div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>

                            {/* Starred Forecourts Pill Toggle */}
                            <div className="relative">
                                <button 
                                    onClick={() => setActiveHeaderDropdown(activeHeaderDropdown === 'starred' ? null : 'starred')}
                                    className={`hover:text-blue-600 transition flex items-center gap-1.5 ${activeHeaderDropdown === 'starred' ? 'text-blue-600' : ''}`}
                                >
                                    Starred Forecourts
                                    <span className="bg-amber-100 text-amber-700 font-extrabold px-1.5 py-0.5 rounded text-[10px]">2</span>
                                </button>

                                {activeHeaderDropdown === 'starred' && (
                                    <div className="absolute right-0 mt-2 w-64 bg-white rounded-xl shadow-xl border border-slate-100 p-2 flex flex-col gap-1 z-[3000] animate-in fade-in zoom-in-95 duration-100">
                                        <div className="p-2 text-[10px] font-bold text-slate-400 uppercase tracking-wider border-b border-slate-50">Monitored Fuel Forecourts</div>
                                        {starredForecourtsMock.map(f => (
                                            <div key={f.id} className="p-2 hover:bg-slate-50 rounded-lg cursor-pointer transition flex justify-between items-center">
                                                <div className="text-xs font-bold text-slate-800 truncate pr-2">{f.title}</div>
                                                <span className="bg-emerald-50 border border-emerald-100 text-emerald-600 font-bold text-[10px] px-1.5 py-0.5 rounded">{f.price}</span>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* Map Zoom Controls Pill Module */}
                    <div className="absolute bottom-24 right-4 z-[1000] flex flex-col gap-1 shadow-lg rounded-xl overflow-hidden border border-slate-200 bg-white">
                        <button onClick={() => mapRef.current?.zoomIn()} className="w-10 h-10 bg-white hover:bg-slate-50 flex items-center justify-center font-bold text-slate-700 border-b border-slate-100 text-base transition">＋</button>
                        <button onClick={() => mapRef.current?.zoomOut()} className="w-10 h-10 bg-white hover:bg-slate-50 flex items-center justify-center font-bold text-slate-700 text-base transition">－</button>
                    </div>

                    {/* Holistic Layout Control Sidebar Deck */}
                    <div className="absolute top-4 left-4 bottom-4 w-[390px] bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl z-[1000] flex flex-col overflow-hidden border border-slate-200/60">
                        <div className="p-5 flex flex-col gap-4 overflow-y-auto no-scrollbar flex-1">
                            
                            <div>
                                <h1 className="text-xl font-black text-slate-900 tracking-tight">Fuel Optimization</h1>
                                <p className="text-[9px] text-emerald-500 font-bold tracking-widest uppercase mt-0.5">CORRIDOR TRACK COMPUTATIONAL PIPELINE ACTIVE</p>
                            </div>

                            {/* Section Context Mode Selectors */}
                            <div className="flex bg-slate-100 p-1 rounded-xl border border-slate-200/40">
                                <button 
                                    onClick={() => setSearchMode('local')} 
                                    className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${searchMode === 'local' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-400 hover:text-slate-600'}`}
                                >
                                    📍 Local Area Map
                                </button>
                                <button 
                                    onClick={() => setSearchMode('route')} 
                                    className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${searchMode === 'route' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-400 hover:text-slate-600'}`}
                                >
                                    🏎️ Route Corridor
                                </button>
                            </div>

                            {/* Local Area Control Block */}
                            {searchMode === 'local' && (
                                <div className="flex flex-col gap-3.5 animate-in fade-in duration-150">
                                    <div className="relative">
                                        <label className="text-[10px] font-bold tracking-wider uppercase text-slate-400 block mb-1">Search Center Location</label>
                                        <div className="relative flex items-center">
                                            <input 
                                                type="text" value={localSearch} onChange={(e) => executeGeocodeLookup(e.target.value, 'local')} 
                                                className="w-full text-xs font-semibold border border-slate-200 rounded-xl pl-3.5 pr-10 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500/20 text-slate-800 bg-slate-50/50" 
                                                placeholder="e.g. Edinburgh, Scotland" 
                                            />
                                            {localSearch && (
                                                <button onClick={() => clearField('local')} className="absolute right-3 text-slate-400 hover:text-slate-600 text-xs">✕</button>
                                            )}
                                        </div>

                                        {activeSuggestionField === 'local' && suggestions.length > 0 && (
                                            <div className="absolute w-full bg-white border border-slate-200 mt-1 rounded-xl shadow-2xl z-[5000] max-h-44 overflow-y-auto">
                                                {suggestions.map((s, idx) => (
                                                    <div key={idx} onClick={() => confirmSuggestionAssignment(s, 'local')} className="p-2.5 text-xs hover:bg-slate-50 cursor-pointer border-b last:border-0 border-slate-100 text-slate-700 font-medium">{s.display_name}</div>
                                                ))}
                                            </div>
                                        )}
                                    </div>

                                    <div>
                                        <div className="flex justify-between text-[10px] font-bold tracking-wider uppercase text-slate-400 mb-1">
                                            <span>Scan Window Radius</span>
                                            <span className="text-blue-600 bg-blue-50 px-2 py-0.5 rounded font-bold text-xs">{radius} Miles Scope</span>
                                        </div>
                                        <input 
                                            type="range" min="1" max="25" value={radius} onChange={(e) => setRadius(parseInt(e.target.value))} 
                                            className="w-full h-1.5 bg-slate-100 rounded-lg appearance-none cursor-pointer custom-slider border border-slate-200/40" 
                                        />
                                    </div>
                                </div>
                            )}

                            {/* Fix: Restored High-Fidelity UI Route Planner Cards containing swap commands, clean indicators and drag tools */}
                            {searchMode === 'route' && (
                                <div className="flex flex-col gap-3 animate-in fade-in duration-150">
                                    <div className="bg-slate-50 border border-slate-200/60 p-4 rounded-xl flex flex-col gap-3.5 relative">
                                        
                                        {/* Left Connectivity Pipeline Accents */}
                                        <div className="absolute left-[31px] top-8 bottom-8 w-0.5 border-l-2 border-dashed border-slate-200 z-0"></div>
                                        
                                        {/* Start Row Block */}
                                        <div className="flex items-center gap-2 relative z-10">
                                            <div className="text-slate-300 font-bold select-none text-xs flex flex-col justify-center cursor-grab active:cursor-grabbing px-1">
                                                <div>⋮</div><div>⋮</div>
                                            </div>
                                            <span className="w-4 h-4 rounded-full bg-white border-2 border-slate-400 flex items-center justify-center text-[8px] text-slate-400 font-extrabold shadow-xs">○</span>
                                            <div className="flex-1 relative flex items-center">
                                                <input 
                                                    type="text" value={startInput} onChange={(e) => executeGeocodeLookup(e.target.value, 'start')} 
                                                    className="w-full text-xs font-bold bg-white border border-slate-200 rounded-lg pl-3 pr-8 py-2.5 focus:outline-none text-slate-800 shadow-2xs placeholder-slate-400" 
                                                    placeholder="Start location (e.g. Dunfermline)" 
                                                />
                                                {startInput && (
                                                    <button onClick={() => clearField('start')} className="absolute right-2.5 text-slate-400 hover:text-slate-600 text-[10px]">✕</button>
                                                )}
                                            </div>
                                            
                                            {activeSuggestionField === 'start' && suggestions.length > 0 && (
                                                <div className="absolute top-11 left-12 right-0 bg-white border border-slate-200 rounded-lg shadow-xl z-[5000] max-h-36 overflow-y-auto">
                                                    {suggestions.map((s, idx) => (
                                                        <div key={idx} onClick={() => confirmSuggestionAssignment(s, 'start')} className="p-2 text-xs hover:bg-slate-50 cursor-pointer text-slate-700 font-medium border-b last:border-0 border-slate-50">{s.display_name}</div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>

                                        {/* Fix: Optional Interim Stop Row managed Reactively via Add button toggle */}
                                        {showInterimField ? (
                                            <div className="flex items-center gap-2 relative z-10 animate-in fade-in slide-in-from-top-1 duration-150">
                                                <div className="text-slate-300 font-bold select-none text-xs flex flex-col justify-center px-1">
                                                    <div>⋮</div><div>⋮</div>
                                                </div>
                                                <span className="w-4 h-4 rounded-full bg-white border-2 border-blue-400 flex items-center justify-center text-[8px] text-blue-500 font-extrabold shadow-xs">○</span>
                                                <div className="flex-1 relative flex items-center">
                                                    <input 
                                                        type="text" value={interimInput} onChange={(e) => executeGeocodeLookup(e.target.value, 'interim')} 
                                                        className="w-full text-xs font-bold bg-white border border-slate-200 rounded-lg pl-3 pr-8 py-2.5 focus:outline-none text-slate-800 shadow-2xs placeholder-slate-400" 
                                                        placeholder="Interim corridor node point" 
                                                    />
                                                    <button 
                                                        onClick={() => { setShowInterimField(false); clearField('interim'); }} 
                                                        className="absolute right-2.5 text-rose-400 hover:text-rose-600 text-[10px] font-bold"
                                                        title="Remove interim stop"
                                                    >
                                                        ✕
                                                    </button>
                                                </div>
                                                {activeSuggestionField === 'interim' && suggestions.length > 0 && (
                                                    <div className="absolute top-11 left-12 right-0 bg-white border border-slate-200 rounded-lg shadow-xl z-[5000] max-h-36 overflow-y-auto">
                                                        {suggestions.map((s, idx) => (
                                                            <div key={idx} onClick={() => confirmSuggestionAssignment(s, 'interim')} className="p-2 text-xs hover:bg-slate-50 cursor-pointer text-slate-700 font-medium border-b last:border-0 border-slate-50">{s.display_name}</div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        ) : (
                                            <div className="pl-14 relative z-10">
                                                <button 
                                                    type="button" onClick={() => setShowInterimField(true)}
                                                    className="text-[11px] font-extrabold text-blue-600 hover:text-blue-800 transition tracking-wide flex items-center gap-1 bg-blue-50/60 hover:bg-blue-50 px-2.5 py-1 rounded-md border border-blue-100/40"
                                                >
                                                    ➕ Add interim stop
                                                </button>
                                            </div>
                                        )}

                                        {/* Destination Row Block */}
                                        <div className="flex items-center gap-2 relative z-10">
                                            <div className="text-slate-300 font-bold select-none text-xs flex flex-col justify-center cursor-grab active:cursor-grabbing px-1">
                                                <div>⋮</div><div>⋮</div>
                                            </div>
                                            <span className="w-4 h-4 rounded-full bg-blue-600 border border-blue-700 flex items-center justify-center text-[9px] text-white font-black shadow-xs">📍</span>
                                            <div className="flex-1 relative flex items-center">
                                                <input 
                                                    type="text" value={destInput} onChange={(e) => executeGeocodeLookup(e.target.value, 'dest')} 
                                                    className="w-full text-xs font-bold bg-white border border-slate-200 rounded-lg pl-3 pr-8 py-2.5 focus:outline-none text-slate-800 shadow-2xs placeholder-slate-400" 
                                                    placeholder="Destination point (e.g. Edinburgh)" 
                                                />
                                                {destInput && (
                                                    <button onClick={() => clearField('dest')} className="absolute right-2.5 text-slate-400 hover:text-slate-600 text-[10px]">✕</button>
                                                )}
                                            </div>
                                            {activeSuggestionField === 'dest' && suggestions.length > 0 && (
                                                <div className="absolute top-11 left-12 right-0 bg-white border border-slate-200 rounded-lg shadow-xl z-[5000] max-h-36 overflow-y-auto">
                                                    {suggestions.map((s, idx) => (
                                                        <div key={idx} onClick={() => confirmSuggestionAssignment(s, 'dest')} className="p-2 text-xs hover:bg-slate-50 cursor-pointer text-slate-700 font-medium border-b last:border-0 border-slate-50">{s.display_name}</div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>

                                        {/* Fix: Absolute positioned vertical field swapping utility icon handle on right side margins */}
                                        <button 
                                            type="button" onClick={executeRouteFieldsSwap}
                                            className="absolute right-[-14px] top-1/2 -translate-y-1/2 w-7 h-7 bg-white rounded-full border border-slate-200 shadow-md flex items-center justify-center text-slate-500 hover:text-blue-600 hover:border-blue-200 transition z-20 active:scale-90 font-bold text-xs"
                                            title="Swap starting point and destination fields"
                                        >
                                            ⇅
                                        </button>
                                    </div>
                                </div>
                            )}

                            <hr className="border-slate-100" />

                            {/* Core Parametric Measurement Settings Controls Panels */}
                            <div className="flex flex-col gap-3">
                                {/* Fix: Side-by-side matching grid config system layout embedding vehicle efficiency & route search width metrics */}
                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="text-[10px] font-bold tracking-wider uppercase text-slate-400 block mb-1">Vehicle MPG</label>
                                        <input 
                                            type="number" value={efficiency} onChange={(e) => setEfficiency(e.target.value)} 
                                            className="w-full text-xs font-bold border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none text-slate-800 bg-slate-50/50" 
                                        />
                                    </div>

                                    <div>
                                        <label className="text-[10px] font-bold tracking-wider uppercase text-slate-400 block mb-1">Corridor Radius</label>
                                        <div className="flex items-center justify-between border border-slate-200 rounded-xl px-2.5 py-2 bg-slate-50/50">
                                            <input 
                                                type="number" value={radius} onChange={(e) => setRadius(parseInt(e.target.value) || 0)}
                                                className="w-10 bg-transparent text-xs font-bold focus:outline-none text-slate-800"
                                            />
                                            <span className="text-[9px] font-extrabold text-blue-600 bg-blue-50 px-1.5 py-0.5 rounded">
                                                {radius} Mi width
                                            </span>
                                        </div>
                                    </div>
                                </div>

                                <div>
                                    <label className="text-[10px] font-bold tracking-wider uppercase text-slate-400 block mb-1">Fuel Core Variant Composition</label>
                                    <select 
                                        value={fuelVariant} onChange={(e) => setFuelVariant(e.target.value)} 
                                        className="w-full text-xs font-bold border border-slate-200 rounded-xl px-3 py-2.5 bg-white text-slate-700 focus:outline-none"
                                    >
                                        <option>Petrol Unleaded (E10)</option>
                                        <option>Super Unleaded (E5)</option>
                                        <option>Diesel (B7)</option>
                                    </select>
                                </div>
                            </div>

                            {/* Active Analytics Display Dashboard Panel */}
                            {searchMode === 'route' && startInput && destInput && (
                                <div className="bg-emerald-50/60 border border-emerald-100 rounded-xl p-4 flex flex-col gap-2 mt-1 animate-in fade-in duration-150">
                                    <span className="text-[10px] font-bold tracking-wider uppercase text-slate-400 block">📊 Financial Calculations Summary</span>
                                    <div className="text-xs font-semibold text-slate-600 flex justify-between">
                                        <span>Total Track: <strong className="text-slate-900">18.5 miles</strong></span>
                                        <span>Optimal Expenses: <strong className="text-emerald-600">£2.86</strong></span>
                                    </div>
                                    <button 
                                        onClick={() => setIsModalOpen(true)} 
                                        className="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-2 px-3 rounded-lg transition flex items-center justify-between mt-1 shadow-sm"
                                    >
                                        <span>📋 Open Full Analysis</span>
                                        <span>→</span>
                                    </button>
                                </div>
                            )}

                            {/* Best Pricing Options Board */}
                            <div className="flex flex-col gap-2 mt-1">
                                <span className="text-[10px] font-bold tracking-wider uppercase text-slate-400 block">
                                    🏆 Local Selection Choices ({visibleMarkers.length} identified)
                                </span>
                                {topThreeCheapest.length > 0 ? (
                                    topThreeCheapest.map((station, index) => (
                                        <div 
                                            key={station.id} 
                                            onClick={() => { mapRef.current.setView([station.lat, station.lng], 14); setSelectedStation(station); }} 
                                            className="bg-white border border-slate-100 p-3 rounded-xl flex justify-between items-center hover:border-blue-300 shadow-sm cursor-pointer transition"
                                        >
                                            <div className="flex items-center gap-2.5">
                                                <span className="text-xs font-bold text-amber-600 bg-amber-50 w-6 h-6 rounded flex items-center justify-center border border-amber-100">#{index + 1}</span>
                                                <div>
                                                    <h4 className="text-xs font-black text-slate-800">{station.brand}</h4>
                                                    <p className="text-[9px] text-slate-400 font-semibold uppercase tracking-wide truncate max-w-[180px]">{station.address}</p>
                                                </div>
                                            </div>
                                            <span className="text-xs font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-100">{station.prices.e10}p</span>
                                        </div>
                                    ))
                                ) : (
                                    <p className="text-[11px] text-slate-400 font-semibold bg-slate-50 rounded-xl p-4 text-center border border-dashed border-slate-200">
                                        No metrics localized. Reposition viewport map mesh or adjust scanning scopes.
                                    </p>
                                )}
                            </div>

                        </div>

                        {/* Bottom Sticky Action Footer Blocks */}
                        <div className="p-3 bg-slate-50 border-t border-slate-100 flex items-center gap-2">
                            <button 
                                onClick={() => setIsPoolsOpen(true)} 
                                className="px-4 py-3 bg-white border border-slate-200 rounded-xl hover:bg-slate-50 font-bold text-xs text-slate-700 shadow-sm flex items-center gap-2 transition active:scale-95 shrink-0"
                            >
                                📊 Pools
                            </button>
                            
                            <button 
                                onClick={searchMode === 'route' ? computeNetworkRoadCorridor : syncMarkersWithMapViewport}
                                className="flex-1 py-3 bg-slate-900 hover:bg-slate-800 text-white rounded-xl font-bold text-xs tracking-wider uppercase transition active:scale-[0.98] shadow-md text-center"
                            >
                                {searchMode === 'route' ? '🔎 Search Route Corridor' : '🔍 Scan Local Region'}
                            </button>
                        </div>
                    </div>

                    {/* Central Floating Viewport Sync Engine Button Control */}
                    <div className="absolute bottom-6 left-1/2 -translate-x-1/2 z-[1000]">
                        <button 
                            onClick={syncMarkersWithMapViewport} 
                            className="bg-slate-900 text-white border border-slate-800 px-5 py-2.5 rounded-full text-[11px] font-bold tracking-wider uppercase shadow-2xl hover:bg-slate-800 transition active:scale-95"
                        >
                            🔄 Sync Viewport Area
                        </button>
                    </div>

                    {/* Color-Coded Pricing Modal Overlay Card Panel */}
                    {selectedStation && (
                        <div className="absolute bottom-6 right-16 z-[1000] bg-white rounded-2xl shadow-2xl p-5 w-80 border border-slate-200/80 flex flex-col gap-3.5 animate-in slide-in-from-bottom-4 duration-200">
                            <div className="flex justify-between items-start">
                                <div>
                                    <h3 className="text-base font-black text-slate-900 tracking-tight">{selectedStation.brand}</h3>
                                    <p className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">{selectedStation.address}</p>
                                </div>
                                <button onClick={() => setSelectedStation(null)} className="text-slate-400 hover:text-slate-600 font-bold text-xs p-1">✕</button>
                            </div>
                            
                            {/* High Fidelity Pricing Variant Matrix Grid mapping dynamic tier highlights */}
                            <div className="grid grid-cols-3 gap-2">
                                <div className="bg-emerald-50 text-emerald-800 border border-emerald-200/60 p-2 rounded-xl text-center">
                                    <p className="text-[9px] font-bold uppercase tracking-wide opacity-80">Unleaded</p>
                                    <p className="text-sm font-black mt-0.5">{selectedStation.prices.e10}p</p>
                                </div>
                                <div className="bg-blue-50 text-blue-800 border border-blue-200/60 p-2 rounded-xl text-center">
                                    <p className="text-[9px] font-bold uppercase tracking-wide opacity-80">Super E5</p>
                                    <p className="text-sm font-black mt-0.5">{selectedStation.prices.e5}p</p>
                                </div>
                                <div className="bg-amber-50 text-amber-800 border border-amber-200/60 p-2 rounded-xl text-center">
                                    <p className="text-[9px] font-bold uppercase tracking-wide opacity-80">Diesel B7</p>
                                    <p className="text-sm font-black mt-0.5">{selectedStation.prices.b7}p</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Regional Pools Summary Sliding Drawer Card Display */}
                    {isPoolsOpen && (
                        <div className="absolute top-0 right-0 h-full w-80 bg-white/95 backdrop-blur-md z-[2000] border-l border-slate-200 shadow-2xl p-5 flex flex-col gap-4 animate-in slide-in-from-right duration-200">
                            <div className="flex justify-between items-center">
                                <h2 className="text-xs font-bold text-slate-900 uppercase tracking-wider">Cluster Rows Array ({visibleMarkers.length} matches)</h2>
                                <button onClick={() => setIsPoolsOpen(false)} className="text-slate-400 font-bold hover:text-slate-600">✕</button>
                            </div>
                            <div className="flex-1 overflow-y-auto flex flex-col gap-2 no-scrollbar">
                                {visibleMarkers.map((station) => (
                                    <div 
                                        key={station.id} onClick={() => { mapRef.current.setView([station.lat, station.lng], 14); setSelectedStation(station); }}
                                        className="p-2.5 bg-white border border-slate-100 rounded-lg hover:border-blue-400 cursor-pointer transition text-xs font-semibold text-slate-700"
                                    >
                                        <div className="flex justify-between">
                                            <span>{station.brand} - <span className="text-[9px] uppercase text-slate-400">{station.address.split(' ')[2]}</span></span>
                                            <span className="text-emerald-600 font-bold">{station.prices.e10}p</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Analytical Metrics Modal Dialog Frame */}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-[99999] flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-5 border border-slate-200 flex flex-col gap-4 animate-in zoom-in-95 duration-100">
                                <div className="flex justify-between items-center">
                                    <h3 className="text-xs font-bold text-slate-900 uppercase tracking-wider">Financial Analysis Breakdown</h3>
                                    <button onClick={() => setIsModalOpen(false)} className="text-slate-400 font-bold hover:text-slate-600">✕</button>
                                </div>

                                <div className="flex flex-col gap-2">
                                    <div className="flex justify-between items-center p-2.5 bg-slate-50 rounded-lg">
                                        <span className="text-xs text-slate-500 font-medium">Path Range</span>
                                        <span className="text-xs font-bold text-slate-800">18.5 miles</span>
                                    </div>
                                    <div className="flex justify-between items-center p-2.5 bg-emerald-50 text-emerald-800 rounded-lg">
                                        <span className="text-xs font-medium">Benchmark Fuel Price</span>
                                        <span className="text-xs font-bold">143.2p / L</span>
                                    </div>
                                    <div className="flex justify-between items-center p-2.5 bg-blue-50 text-blue-800 rounded-lg">
                                        <span className="text-xs font-medium">Projected Cost Run Target</span>
                                        <span className="text-xs font-black">£2.86 Total</span>
                                    </div>
                                </div>

                                <button onClick={() => setIsModalOpen(false)} className="w-full bg-slate-900 text-white py-2.5 rounded-xl text-xs font-bold hover:bg-slate-700 transition">
                                    Dismiss Analysis
                                </button>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
